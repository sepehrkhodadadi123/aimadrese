</style></head><body><div class="wrap"><header class="header"><div class="header-label" id="header-label">سلام! 👋</div><img class="brand-logo" src="/aimadrese-logo.png" alt="ای‌آی مدرسه"></header><main class="screen" id="screen"></main><div class="composer hidden" id="composer"><div id="attachment-preview" class="attachment-preview hidden"><span id="attachment-name"></span><button id="remove-attachment" type="button">حذف ×</button></div><input type="file" id="image-file" accept="image/jpeg,image/png,image/webp"><button id="pick-image" class="tool-btn" type="button">📷</button><button id="record-voice" class="tool-btn" type="button">🎙️</button><input id="question" placeholder="سؤالت رو بپرس..."><button id="send" class="send-btn">➤</button></div><nav class="nav hidden" id="nav"><button data-page="home"><span>⌂</span>خانه</button><button data-page="courses"><span>▣</span>دوره‌ها</button><button data-page="explore"><span>◈</span>اکسپلور</button><button data-page="assistant"><span>♧</span>دستیار</button><button data-page="profile"><span>♙</span>پروفایل</button></nav></div><script>
(()=>{const $=x=>document.querySelector(x),screen=$('#screen'),composer=$('#composer'),input=$('#question');
const defaultState={name:'دانش‌آموز',lastName:'',grade:'نهم',tasks:[false,false,false],messages:[],page:'home',following:[]};
const activeKey='aimadrese-demo-active-v2',profilesKey='aimadrese-demo-profiles-v2';let profiles={};try{profiles=JSON.parse(localStorage.getItem(profilesKey)||'{}')||{}}catch{};let activeId=localStorage.getItem(activeKey)||'',isRegistered=!!(activeId&&profiles[activeId]);let s=isRegistered?{...defaultState,...profiles[activeId]}:{...defaultState};const save=()=>{if(isRegistered&&activeId){profiles[activeId]={...s};localStorage.setItem(profilesKey,JSON.stringify(profiles))}};const profileId=(a,b,c,d)=>JSON.stringify([a.trim().toLocaleLowerCase('fa'),b.trim().toLocaleLowerCase('fa'),c,d.trim()]);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const grades=['اول','دوم','سوم','چهارم','پنجم','ششم','هفتم','هشتم','نهم','دهم','یازدهم','دوازدهم'];
const teachers=[{name:'استاد کریمی',subject:'ریاضی',emoji:'👨🏻‍🏫',followers:'۲۴ هزار'},{name:'استاد رهایی',subject:'علوم تجربی',emoji:'👩🏻‍🏫',followers:'۱۸ هزار'},{name:'استاد مرادی',subject:'فیزیک',emoji:'👨🏽‍🏫',followers:'۱۵ هزار'},{name:'استاد نادری',subject:'فارسی',emoji:'👩🏽‍🏫',followers:'۱۲ هزار'}];
const courses=[{title:'معادلات درجه یک',teacher:0,emoji:'📐',price:'۳۹۰٬۰۰۰',desc:'۶ جلسه · ۱۲۰ دقیقه'},{title:'ساختار و عملکرد DNA',teacher:1,emoji:'🧬',price:'۴۵۰٬۰۰۰',desc:'۴ جلسه · ۱۶۰ دقیقه'},{title:'نسبت‌های مثلثاتی',teacher:2,emoji:'📏',price:'۴۹۰٬۰۰۰',desc:'۳ جلسه · ۹۰ دقیقه'},{title:'آشنایی با قانون اهرم',teacher:2,emoji:'⚛️',price:'۲۹۰٬۰۰۰',desc:'۵ جلسه · ۷۵ دقیقه'}];
 // دوره‌های جدید از Supabase بارگیری می‌شوند؛ دوره‌های نمایشی ثابت باقی می‌مانند.
 const localCoursesKey='aimadrese-teacher-courses-v1';
 let addedCourses=[];let ownedCourses=[];let authSession=null;let teacherError='';let teacherBusy=false;let editingCourseId=null;
 const SB_URL='https://foznqubojmiizvohojkn.supabase.co', SB_KEY='sb_publishable_CdpbMrbkXHqenFDLfZ862Q_bICiitax', AUTH_KEY='aimadrese-supabase-teacher-session-v1';
 try{authSession=JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch{}
 const allCourses=()=>[...courses,...addedCourses];
 function remoteCourse(c){return {id:c.id,teacherId:c.teacher_id,teacherName:c.teacher_name,title:c.title,subject:c.subject,grade:c.grade,topics:c.topics,description:c.description,price:String(c.price),emoji:c.emoji||'📚',status:c.status,desc:'دوره آموزشی',lessons:String(c.topics||'').split(/[،,\n]/).map(x=>x.trim()).filter(Boolean).slice(0,8)}}
 function authHeaders(token){return {'apikey':SB_KEY,'Authorization':'Bearer '+(token||SB_KEY),'Content-Type':'application/json'}}
 async function sbRequest(path,options={}){const res=await fetch(SB_URL+path,{...options,headers:{...authHeaders(options.token),...(options.headers||{})}});let data=null;const raw=await res.text();try{data=raw?JSON.parse(raw):null}catch{data={message:raw}};if(!res.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.error||('خطای سرور '+res.status));return data}
 async function ensureSession(){if(!authSession)return null;if(authSession.expires_at&&Date.now()/1000<authSession.expires_at-60)return authSession;try{const a=await sbRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:authSession.refresh_token})});setSession(a);return authSession}catch{authSession=null;localStorage.removeItem(AUTH_KEY);return null}}
 function setSession(a){if(!a?.access_token)return;authSession={...a,expires_at:Math.floor(Date.now()/1000)+(a.expires_in||3600)};localStorage.setItem(AUTH_KEY,JSON.stringify(authSession))}
 async function loadPublished(){try{const a=await sbRequest('/rest/v1/teacher_courses?select=*&status=eq.published&order=created_at.desc&limit=100');addedCourses=(a||[]).map(remoteCourse);if(isRegistered&&['courses','home','explore','course-detail','assistant','learning-analysis'].includes(s.page))render()}catch(err){console.warn('Published courses:',err.message);teacherError='بارگیری دوره‌ها ناموفق بود: '+err.message}}
 async function loadOwned(){const session=await ensureSession();if(!session){ownedCourses=[];return}const a=await sbRequest('/rest/v1/teacher_courses?select=*&teacher_id=eq.'+encodeURIComponent(session.user.id)+'&order=created_at.desc',{token:session.access_token});ownedCourses=(a||[]).map(remoteCourse)}
 function teacherLoginMarkup(){return `<h2>ورود معلم 👩🏻‍🏫</h2><div class="card"><p class="muted">برای ساخت و انتشار دوره، با ایمیل و رمز عبور حساب واقعی بساز یا وارد شو.</p><form id="teacher-auth-form"><label class="field-label">ایمیل</label><input class="field" name="email" type="email" autocomplete="email" required><label class="field-label">رمز عبور (حداقل ۶ کاراکتر)</label><input class="field" name="password" type="password" minlength="6" autocomplete="current-password" required><div class="row"><button class="btn" type="submit" name="action" value="login">ورود</button><button class="btn ghost" type="submit" name="action" value="signup">ثبت‌نام</button></div></form>${teacherError?`<p class="notice">${esc(teacherError)}</p>`:''}</div><p class="notice">اگر تأیید ایمیل فعال باشد، بعد از ثبت‌نام باید لینک تأیید را از ایمیل باز کنی. حساب آزمایشی دانش‌آموز مستقل از این ورود است.</p><button class="chip" data-page="profile">بازگشت</button>`}
 function teacherDashboardMarkup(){const pub=ownedCourses.filter(x=>x.status==='published').length;return `<h2>پنل معلم 🎓</h2><div class="studio-head"><h3>${esc(authSession?.user?.email||'حساب معلم')}</h3><p class="muted">دوره‌ها در دیتابیس مرکزی ذخیره می‌شوند.</p></div><div class="grid"><div class="card"><h3>${ownedCourses.length}</h3><p class="muted">کل دوره‌ها</p></div><div class="card"><h3>${pub}</h3><p class="muted">منتشرشده</p></div></div><div class="row"><button class="btn" data-teacher-new="1">＋ دوره جدید</button><button class="chip" data-teacher-refresh="1">↻ تازه‌سازی</button></div><div class="section-title">دوره‌های من</div>${ownedCourses.length?ownedCourses.map(c=>`<div class="card"><h3>${esc(c.title)}</h3><p class="muted">${esc(c.subject)} · پایه ${esc(c.grade)} · ${c.status==='published'?'🟢 منتشرشده':'🟠 پیش‌نویس'}</p><div class="row" style="flex-wrap:wrap"><button class="chip" data-teacher-edit="${esc(c.id)}">ویرایش</button><button class="chip" data-teacher-toggle="${esc(c.id)}">${c.status==='published'?'لغو انتشار':'انتشار'}</button><button class="chip" data-teacher-delete="${esc(c.id)}">حذف</button></div></div>`).join(''):'<p class="muted">هنوز دوره‌ای ثبت نکرده‌ای.</p>'}<div class="card"><h3>🤖 دستیار معلم</h3><p class="muted">برای طراحی تمرین و درس می‌توانی از دستیار عمومی اپ استفاده کنی. تحلیل خودکار ویدئو هنوز فعال نیست.</p><button class="chip" data-page="assistant">گفت‌وگو با دستیار</button></div><p class="notice">آمار فروش، ثبت‌نام دانش‌آموزان، کیف پول و بارگذاری ویدئو هنوز متصل نشده‌اند.</p><button class="chip" data-teacher-logout="1">خروج از حساب معلم</button>`}
 function teacherFormMarkup(){const c=ownedCourses.find(x=>x.id===editingCourseId)||{};return `<h2>${editingCourseId?'ویرایش دوره':'ساخت دوره جدید'}</h2><form id="remote-course-form"><label class="field-label">نام مدرس</label><input class="field" name="teacherName" required maxlength="70" value="${esc(c.teacherName||appProfile?.display_name||'')}"><label class="field-label">عنوان دوره</label><input class="field" name="title" required maxlength="100" value="${esc(c.title||'')}"><label class="field-label">درس</label><select class="field" name="subject">${['ریاضی','علوم','فیزیک','فارسی'].map(x=>`<option ${c.subject===x?'selected':''}>${x}</option>`).join('')}</select><label class="field-label">پایه</label><select class="field" name="grade">${grades.map(g=>`<option ${c.grade===g||(!c.grade&&g===s.grade)?'selected':''}>${g}</option>`).join('')}</select><label class="field-label">سرفصل‌ها</label><textarea class="field" name="topics" required maxlength="600" rows="3">${esc(c.topics||'')}</textarea><label class="field-label">توضیحات</label><textarea class="field" name="description" maxlength="600" rows="3">${esc(c.description||'')}</textarea><label class="field-label">قیمت (ریال)</label><input class="field" name="price" type="number" min="0" max="999999999" required value="${esc(c.price||'0')}"><div class="upload">☁️ آپلود ویدئو در این نسخه هنوز فعال نیست</div><button class="btn" style="width:100%" type="submit">${editingCourseId?'ذخیره تغییرات':'ذخیره پیش‌نویس در Supabase'}</button></form><p class="notice">دوره ابتدا پیش‌نویس است؛ از داشبورد آن را منتشر کن.</p><button class="chip" data-page="teacher-dashboard">بازگشت</button>`}
 async function openTeacher(){teacherError='';if(await ensureSession()){try{await loadOwned();s.page='teacher-dashboard'}catch(err){teacherError=err.message;s.page='teacher-login'}}else{s.page='teacher-login'}render()}
 async function teacherAction(fn){if(teacherBusy)return;teacherBusy=true;try{await fn();teacherError='';await loadOwned();await loadPublished();s.page='teacher-dashboard';render()}catch(err){teacherError=err.message;alert('خطا: '+err.message);render()}finally{teacherBusy=false}}
 const topics=[
 {words:['معادله','معادلات','مجهول'],title:'معادلات درجه یک',subject:'ریاضی',emoji:'📐'},
 {words:['مثلث','مثلثات','سینوس','کسینوس'],title:'نسبت‌های مثلثاتی',subject:'ریاضی',emoji:'📏'},
 {words:['dna','دی ان ای','ژنتیک','سلول'],title:'ساختار و عملکرد DNA',subject:'علوم',emoji:'🧬'},
 {words:['اهرم','نیرو','گشتاور'],title:'آشنایی با قانون اهرم',subject:'فیزیک',emoji:'⚛️'},
 {words:['توان','ریشه','رادیکال'],title:'توان و ریشه',subject:'ریاضی',emoji:'📘'},
 {words:['هندسه','زاویه','چندضلعی'],title:'هندسه',subject:'ریاضی',emoji:'📐'}
];
const norm=x=>String(x||'').toLocaleLowerCase('fa').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ').trim();
function inferTopics(messages){const hits={};for(const m of messages||[]){if(m.role!=='user')continue;const t=norm(m.text);for(const topic of topics){if(topic.words.some(w=>t.includes(norm(w))))hits[topic.title]=(hits[topic.title]||0)+1}}return Object.entries(hits).sort((a,b)=>b[1]-a[1]);}
function courseScore(c,hit){const t=norm([c.title,c.subject,c.topics,c.description].join(' '));const topic=topics.find(x=>x.title===hit[0]);return (t.includes(norm(hit[0]))?10:0)+(topic&&t.includes(norm(topic.subject))?2:0)+(topic&&topic.words.some(w=>t.includes(norm(w)))?3:0)}
function recommendations(){const hits=inferTopics(s.messages);if(!hits.length)return[];return allCourses().map((c,i)=>({c,i,score:Math.max(...hits.map(h=>courseScore(c,h)),0)})).filter(x=>x.score>=3).sort((a,b)=>b.score-a.score).slice(0,3)}
function recommendationMarkup(limit=3){const recs=recommendations().slice(0,limit);if(!recs.length)return '<p class="smart-empty">هنوز موضوع مشخصی از سؤال‌هایت شناسایی نشده. درباره یک مبحث درسی از دستیار سؤال بپرس تا دوره مرتبط نمایش داده شود.</p>';return recs.map(({c,i})=>`<div class="smart-card"><span class="smart-pill">✨ پیشنهاد بر اساس سؤال‌های تو</span><h3>${esc(c.emoji||'📚')} ${esc(c.title)}</h3><p>${esc(c.description||c.desc||'دوره آموزشی')} · ${esc(c.price||'رایگان')} ریال</p><p>این پیشنهاد از موضوع سؤال‌های اخیرت به دست آمده، نه از نمره یا آزمون واقعی.</p><button class="btn" data-course="${i}">مشاهده دوره ←</button></div>`).join('')}
function learningMarkup(){const hits=inferTopics(s.messages);const count=(s.messages||[]).filter(m=>m.role==='user').length;return `<div class="smart-banner"><span class="smart-pill">📊 تحلیل آزمایشی یادگیری</span><h3>موضوع‌های مورد توجه تو</h3><p>${hits.length?hits.slice(0,3).map(h=>`${esc(h[0])} (${h[1]} سؤال)`).join(' · '):'هنوز داده‌ای از سؤال‌ها ثبت نشده است.'}</p><p>تعداد سؤال‌های ثبت‌شده: ${count} · تشخیص ضعف واقعی نیازمند آزمون و ارزیابی است.</p></div>`}

// تبدیل Markdown و LaTeX به نمایش امن و خوانا
function formatAnswer(raw){
  const source=String(raw||'');
  if(!window.marked||!window.DOMPurify)return esc(source).replace(/\n/g,'<br>');
  const maths=[];
  const tokenized=source.replace(/\\\[([\s\S]*?)\\\]|\$\$([\s\S]*?)\$\$|\\\(([\s\S]*?)\\\)|(?<!\$)\$([^$\n]+)\$(?!\$)/g,(full,a,b,c,d)=>{
    const expression=a??b??c??d;
    const display=a!==undefined||b!==undefined;
    const token=`MATHPLACEHOLDER${maths.length}END`;
    try{maths.push(window.katex?window.katex.renderToString(expression,{throwOnError:false,displayMode:display,output:'html'}):esc(full))}
    catch{maths.push(esc(full))}
    return token;
  });
  let html=window.marked.parse(tokenized,{breaks:true,gfm:true});
  html=html.replace(/MATHPLACEHOLDER(\d+)END/g,(_,i)=>maths[Number(i)]||'');
  return window.DOMPurify.sanitize(html);
}
let attachment=null, recorder=null, recordParts=[],busy=false;
const preview=$('#attachment-preview'),attachmentName=$('#attachment-name');
function updateAttachment(){preview.classList.toggle('hidden',!attachment);attachmentName.textContent=attachment?(attachment.kind==='image'?'📷 عکس آماده ارسال':'🎙️ ویس آماده ارسال'):'';}
function fileAsBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)})}
$('#image-file').addEventListener('change',async e=>{
  const file=e.target.files?.[0];if(!file)return;
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){alert('فقط JPG، PNG یا WebP مجاز است.');return}
  if(file.size>4*1024*1024){alert('حجم عکس باید کمتر از ۴ مگابایت باشد.');return}
  attachment={kind:'image',mimeType:file.type,data:await fileAsBase64(file)};updateAttachment();e.target.value='';
});
$('#record-voice').addEventListener('click',async()=>{
  if(recorder&&recorder.state==='recording'){recorder.stop();return}
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){alert('ضبط صدا در این مرورگر پشتیبانی نمی‌شود.');return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(x=>MediaRecorder.isTypeSupported(x))||'';
    recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);recordParts=[];
    recorder.ondataavailable=e=>{if(e.data.size)recordParts.push(e.data)};
    recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());$('#record-voice').classList.remove('recording');$('#record-voice').textContent='🎙️';const blob=new Blob(recordParts,{type:recorder.mimeType||'audio/webm'});if(blob.size>6*1024*1024){alert('ویس طولانی است؛ کوتاه‌تر ضبط کن.');return}attachment={kind:'audio',mimeType:blob.type.split(';')[0],data:await fileAsBase64(blob)};updateAttachment()};
    recorder.start();$('#record-voice').classList.add('recording');$('#record-voice').textContent='⏹';
  }catch{alert('برای ضبط ویس، دسترسی میکروفون را در مرورگر فعال کن.')}
});
async function ask(q){
  if(busy)return;
  q=String(q??input.value).trim();if(!q&&!attachment)return;
  const media=attachment;if(media){alert('ارسال عکس و ویس هنوز به Worker متصل نشده؛ فعلاً سؤال را متنی بپرس.');return}attachment=null;updateAttachment();input.value='';
  const text=q||(media?.kind==='image'?'لطفاً سؤال داخل تصویر را بخوان و مرحله‌به‌مرحله توضیح بده.':'لطفاً به سؤال صوتی من به فارسی پاسخ بده.');
  s.page='assistant';s.messages.push({role:'user',text,mediaLabel:media?.kind==='image'?'📷 تصویر پیوست شده':media?.kind==='audio'?'🎙️ پیام صوتی پیوست شده':undefined});
  const history=s.messages.filter(m=>!m.pending).slice(-12).map(m=>({role:m.role,content:m.text}));
  const pendingIndex=s.messages.length;s.messages.push({role:'assistant',text:'در حال بررسی سؤال…',pending:true});busy=true;$('#send').disabled=true;render();
  try{
    const response=await fetch('https://aimadrese-gemini.sepehrkhodadadi84.workers.dev/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,grade:s.grade,attachment:media})});
    const data=await response.json();if(!response.ok)throw new Error(data.error||'خطا در ارتباط با دستیار');
    s.messages[pendingIndex].text=data.reply||'پاسخی دریافت نشد.';
  }catch(err){s.messages[pendingIndex].text='⚠️ '+(err.message||'ارتباط برقرار نشد');}
  s.messages[pendingIndex].pending=false;busy=false;$('#send').disabled=false;render();
}

 const avatar=other?.avatar_url?`<img src="${appEsc(other.avatar_url)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:`<span>${other?.role==='teacher'?'👨🏻‍🏫':'🎓'}</span>`;
 const messages=appMessages.map((m,i)=>{
  const mine=m.sender_id===authSession.user.id,media=appChatMedia.get(m.id),kind=m.attachment_type||'';
  const stamp=new Date(m.created_at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
  let attachment='';
  if(m.attachment_path){
   if(!media)attachment='<div class="v8-loading-file">در حال دریافت پیوست…</div>';
   else if(kind.startsWith('image/'))attachment=`<a class="v8-image-link" href="${appEsc(media)}" target="_blank" rel="noopener noreferrer" title="نمایش تصویر در اندازه کامل"><img class="v8-chat-image" src="${appEsc(media)}" alt="تصویر ارسالی" loading="lazy"><span class="v8-image-hint">⤢ مشاهده تصویر</span></a>`;
   else if(kind.startsWith('audio/'))attachment=`<div class="v8-audio"><span class="v8-audio-icon">♫</span><audio controls preload="metadata" src="${appEsc(media)}" aria-label="پیام صوتی"></audio></div>`;
   else attachment=`<a class="v8-file-link" href="${appEsc(media)}" target="_blank" rel="noopener noreferrer">📎 ${appEsc(m.attachment_name||'دریافت فایل')}</a>`;
  }
  const text=m.body&&m.body.trim()?`<div class="v8-bubble-text">${appEsc(m.body).replace(/\n/g,'<br>')}</div>`:'';
  return `<div class="v8-message ${mine?'v8-out':'v8-in'}"><div class="v8-message-content">${text}${attachment}<div class="v8-message-meta"><time>${stamp}</time>${mine?'<span aria-label="ارسال شده">✓✓</span>':''}</div></div></div>`;
 }).join('');
 return `<section class="chat-panel v8-chat" aria-label="گفت‌وگوی خصوصی">
 <div class="v8-chat-header"><button type="button" class="v8-back" data-page="messages" aria-label="بازگشت به پیام‌ها">❯</button><div class="v8-person-avatar">${avatar}${onlineMark(other)}</div><div class="v8-person-info"><strong>${name}</strong><small>${isUserOnline(other)?'🟢 آنلاین':'⚪ آفلاین'} · ${other?.role==='teacher'?'معلم':'دانش‌آموز'} · گفت‌وگوی آموزشی خصوصی</small></div><span class="v8-private" title="گفت‌وگوی خصوصی">♧ خصوصی</span></div>
 <div class="chat-feed v8-feed" id="chat-feed"><div class="v8-day-divider"><span>گفت‌وگوی شما</span></div>${messages||'<div class="v8-empty-chat"><span>💬</span><strong>گفت‌وگو را شروع کنید</strong><p>اولین پیام آموزشی‌تان را ارسال کنید.</p></div>'}</div>
 <div id="chat-file-preview" class="chat-attach-preview v8-preview" style="display:${appPendingFile?'flex':'none'}"><span>${appPendingFile?appEsc(appPendingFile.name):''}</span><button type="button" class="chip" data-remove-attachment="1">حذف ×</button></div>
 <form id="app-chat-form" class="chat-compose v8-compose"><input id="chat-media-file" type="file" accept="image/jpeg,image/png,image/webp,audio/webm,audio/mp4,audio/mpeg,audio/ogg,audio/wav" aria-label="انتخاب عکس یا صوت"><button class="chat-tool v8-voice" type="button" data-record-voice="1" title="شروع یا پایان ضبط ویس" aria-label="ضبط ویس">🎙</button><button class="chat-tool v8-media" type="button" data-pick-attachment="1" title="انتخاب عکس یا فایل صوتی" aria-label="انتخاب عکس یا فایل صوتی">▧</button><input name="body" maxlength="2000" placeholder="پیام خود را بنویسید…" autocomplete="off" aria-label="متن پیام"><button class="chat-send v8-send" type="submit" ${appUploading?'disabled':''} aria-label="ارسال پیام">➤</button></form>
 <p class="chat-status v8-hint">عکس تا ۵ مگابایت · ویس تا ۱۰ مگابایت · فقط اعضای گفت‌وگو</p></section>`;
}
function teacherHomeMarkup(){return teacherDashboardMarkup().replace('<h2>پنل معلم 🎓</h2>','<h2>داشبورد معلم 🎓</h2>')+`<div class="card"><h3>💬 گفت‌وگوهای دانش‌آموزان</h3><p class="muted">پیام‌های آموزشی دریافتی را از اینجا پاسخ بده.</p><button class="btn" data-page="messages">ورود به پیام‌ها</button></div>`}
function syncStudentMessagesShortcut(){
 const header=document.querySelector('.header');if(!header)return;
 let shortcut=document.getElementById('student-messages-shortcut');
 if(!shortcut){shortcut=document.createElement('button');shortcut.id='student-messages-shortcut';shortcut.type='button';shortcut.dataset.page='messages';shortcut.className='student-message-shortcut';shortcut.textContent='💬 پیام‌ها';shortcut.setAttribute('aria-label','پیام‌های من');header.appendChild(shortcut)}
 shortcut.hidden=!(authSession&&appProfile&&appProfile.role==='student');
}
function appRender(){syncStudentMessagesShortcut();if(appLoading){screen.innerHTML='<div class="card">در حال بررسی حساب کاربری...</div>';$('#nav').classList.add('hidden');composer.classList.add('hidden');return}if(!authSession||!appProfile){screen.innerHTML=authMarkup();$('#nav').classList.add('hidden');composer.classList.add('hidden');return}isRegistered=true;navForRole();queueMicrotask(updateMessageBadge);composer.classList.toggle('hidden',s.page!=='assistant');$('#header-label').textContent='ای‌آی مدرسه · '+(appProfile.role==='teacher'?'معلم':'دانش‌آموز');if(s.page==='account-profile')screen.innerHTML=profileMarkup();else if(s.page==='messages')screen.innerHTML=messagesMarkup();else if(s.page==='chat')screen.innerHTML=chatMarkup();else if(s.page==='teacher-directory'||s.page==='user-directory')screen.innerHTML=directoryMarkup();else if(s.page==='teacher-dashboard')screen.innerHTML=teacherHomeMarkup();else if(s.page==='teacher-courses')screen.innerHTML=`<h2>دوره‌های من</h2>${teacherDashboardMarkup()}`;else if(s.page==='teacher-course-form')screen.innerHTML=teacherFormMarkup();else if(s.page==='teacher-login')s.page='teacher-dashboard',screen.innerHTML=teacherHomeMarkup();else if(appProfile.role==='teacher'&&!['assistant','courses','course-detail','explore'].includes(s.page)){s.page='teacher-dashboard';screen.innerHTML=teacherHomeMarkup()}else if(s.page==='profile'){s.page='account-profile';screen.innerHTML=profileMarkup()}else{originalRender();navForRole();syncStudentMessagesShortcut();if(s.page==='teachers'){screen.innerHTML+=`<div class="card"><h3>معلم‌های واقعی</h3><button class="btn" data-page="teacher-directory">مشاهده و ارسال پیام</button></div>`}if(s.page==='course-detail'){const c=allCourses()[s.selectedCourse||0];if(c?.teacherId)screen.innerHTML+=`<button class="btn" data-start-chat="${appEsc(c.teacherId)}">💬 پیام به مدرس دوره</button>`}}}
render=appRender;
async function getProfile(){const a=await ensureSession();if(!a)return null;const data=await sbRequest('/rest/v1/app_profiles?select=*&id=eq.'+encodeURIComponent(a.user.id),{token:a.access_token});return data?.[0]||null}
async function initApp(){appLoading=true;appRender();try{const a=await ensureSession();if(a){appProfile=await getProfile();if(appProfile){s={...defaultState,...s,name:appProfile.display_name||'کاربر',grade:appProfile.grade||'نهم',page:appProfile.role==='teacher'?'teacher-dashboard':'home'};isRegistered=true;if(appProfile.role==='teacher')await loadOwned();await loadPublished();await fetchThreads()}}}catch(e){appAuthError=e.message}finally{appLoading=false;appRender();startAccountIndicators()}}
async function fetchThreads(){if(!appProfile)return;const a=await ensureSession();if(!a)return;const data=await sbRequest('/rest/v1/app_conversations?select=*,student:app_profiles!app_conversations_student_id_fkey(id,display_name,role,avatar_url,last_seen_at),teacher:app_profiles!app_conversations_teacher_id_fkey(id,display_name,role,avatar_url,last_seen_at)&order=updated_at.desc',{token:a.access_token});appThreads=data||[]}
async function fetchUsers(){const a=await ensureSession();appUsers=[];for(let offset=0;offset<10000;offset+=500){const batch=await sbRequest('/rest/v1/app_profiles?select=id,display_name,role,subject,grade,avatar_url,last_seen_at&order=created_at.desc&limit=500&offset='+offset,{token:a.access_token})||[];appUsers.push(...batch);if(batch.length<500)break}appUsers=appUsers.filter(x=>x.id!==a.user.id)}
async function fetchTeachers(){const a=await ensureSession();appTeachers=await sbRequest('/rest/v1/app_profiles?select=id,display_name,subject,bio&role=eq.teacher&order=created_at.desc',{token:a.access_token})||[]}
async function fetchMessages(){if(!appChatId)return;const a=await ensureSession();if(!a)return;const data=await sbRequest('/rest/v1/app_messages?select=id,conversation_id,sender_id,body,created_at,attachment_path,attachment_type,attachment_name&conversation_id=eq.'+encodeURIComponent(appChatId)+'&order=created_at.asc&limit=200',{token:a.access_token});const previous=JSON.stringify(appMessages.map(m=>[m.id,m.attachment_path]));appMessages=data||[];const changed=previous!==JSON.stringify(appMessages.map(m=>[m.id,m.attachment_path]));if(s.page==='chat'&&changed){const oldFeed=document.getElementById('chat-feed');const nearBottom=!oldFeed||oldFeed.scrollHeight-oldFeed.scrollTop-oldFeed.clientHeight<100;const typed=document.querySelector('#app-chat-form input[name=body]')?.value||'';appRender();const newInput=document.querySelector('#app-chat-form input[name=body]');if(newInput)newInput.value=typed;const feed=document.getElementById('chat-feed');if(feed&&nearBottom)feed.scrollTop=feed.scrollHeight}await resolveChatMedia();if(s.page==='chat')markChatRead().catch(console.warn)}
async function resolveChatMedia(){const a=await ensureSession();if(!a)return;const pending=appMessages.filter(m=>m.attachment_path&&!appChatMedia.has(m.id));if(!pending.length)return;for(const m of pending){try{const r=await sbRequest('/storage/v1/object/sign/aimadrese-chat/'+m.attachment_path,{method:'POST',token:a.access_token,body:JSON.stringify({expiresIn:3600})});const signed=r.signedURL||r.signedUrl;if(signed)appChatMedia.set(m.id,SB_URL+(signed.startsWith('/storage/v1/')?signed:'/storage/v1'+(signed.startsWith('/')?signed:'/'+signed)))}catch(err){console.warn('پیوست:',err.message)}}if(s.page==='chat'&&pending.some(m=>appChatMedia.has(m.id))){const feed=document.getElementById('chat-feed');const nearBottom=!feed||feed.scrollHeight-feed.scrollTop-feed.clientHeight<100;const typed=document.querySelector('#app-chat-form input[name=body]')?.value||'';appRender();const input=document.querySelector('#app-chat-form input[name=body]');if(input)input.value=typed;const next=document.getElementById('chat-feed');if(next&&nearBottom)next.scrollTop=next.scrollHeight}}
function validateChatFile(file){if(!file)return;const allowed=['image/jpeg','image/png','image/webp','audio/webm','audio/mp4','audio/mpeg','audio/ogg','audio/wav'];if(!allowed.includes(file.type))throw new Error('فقط عکس JPG/PNG/WebP و فایل صوتی مجاز است.');const max=file.type.startsWith('image/')?5:10;if(file.size>max*1024*1024)throw new Error('حجم فایل نباید بیشتر از '+max+' مگابایت باشد.')}
async function sendChatMessage(body,file){if(!appChatId||(!body&&!file)||appUploading)return;appUploading=true;const a=await ensureSession();try{const data={conversation_id:appChatId,sender_id:a.user.id,body:body||' '};if(file){validateChatFile(file);const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','audio/webm':'webm','audio/mp4':'m4a','audio/mpeg':'mp3','audio/ogg':'ogg','audio/wav':'wav'}[file.type];const path=appChatId+'/'+a.user.id+'/'+crypto.randomUUID()+'.'+ext;const res=await fetch(SB_URL+'/storage/v1/object/aimadrese-chat/'+path,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+a.access_token,'Content-Type':file.type,'x-upsert':'false'},body:file});if(!res.ok){const error=await res.text();throw new Error('آپلود ناموفق بود: '+error.slice(0,200))}data.attachment_path=path;data.attachment_type=file.type;data.attachment_name=file.name.slice(0,150)}await sbRequest('/rest/v1/app_messages',{method:'POST',token:a.access_token,headers:{Prefer:'return=minimal'},body:JSON.stringify(data)});appPendingFile=null;await fetchMessages();appRender();const feed=document.getElementById('chat-feed');if(feed)feed.scrollTop=feed.scrollHeight}catch(e){alert('خطا در ارسال: '+e.message)}finally{appUploading=false}}
async function toggleVoiceRecord(btn){if(appRecorder&&appRecorder.state==='recording'){appRecorder.stop();btn.classList.remove('chat-recording');btn.textContent='🎙';return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){alert('مرورگر شما ضبط ویس را پشتیبانی نمی‌کند.');return}try{appRecordingStream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(x=>MediaRecorder.isTypeSupported(x));appRecorder=new MediaRecorder(appRecordingStream,mime?{mimeType:mime}:undefined);appAudioChunks=[];appRecorder.ondataavailable=e=>{if(e.data.size)appAudioChunks.push(e.data)};appRecorder.onstop=()=>{const type=appRecorder.mimeType.split(';')[0]||'audio/webm';const blob=new Blob(appAudioChunks,{type});appRecordingStream?.getTracks().forEach(t=>t.stop());appRecordingStream=null;const file=new File([blob],'voice-'+Date.now()+(type==='audio/mp4'?'.m4a':'.webm'),{type});try{validateChatFile(file);appPendingFile=file;const preview=document.getElementById('chat-file-preview');if(preview){preview.style.display='flex';preview.querySelector('span').textContent='🎙 '+file.name}}catch(e){alert(e.message)}};appRecorder.start();btn.classList.add('chat-recording');btn.textContent='■'}catch(e){alert('اجازه دسترسی به میکروفون داده نشد: '+e.message)}}
function stopPolling(){if(appPoll){clearInterval(appPoll);appPoll=null}}
async function goPage(page){stopPolling();s.page=page;try{if(page==='teacher-dashboard'||page==='teacher-courses')await loadOwned();if(page==='messages'){await Promise.all([fetchThreads(),fetchUsers()]);await updateUnread()};if(page==='teacher-directory')await fetchTeachers();if(page==='user-directory')await fetchUsers();if(page==='courses')await loadPublished()}catch(e){alert('خطا در دریافت اطلاعات: '+e.message)}appRender()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.studentTab){e.stopImmediatePropagation();studentProfileTab=b.dataset.studentTab;appRender();return}if(b.dataset.studentProfileReset){e.stopImmediatePropagation();studentProfileTab='info';appRender();return}if(b.dataset.studentAvatar){e.stopImmediatePropagation();document.getElementById('sp-avatar-file')?.click();return}if(b.dataset.studentSetting){e.stopImmediatePropagation();const labels={notifications:'اعلان‌ها و یادآورها',privacy:'حریم خصوصی و امنیت',appearance:'ظاهر برنامه'};alert('بخش «'+(labels[b.dataset.studentSetting]||'تنظیمات')+'» هنوز پیاده‌سازی نشده است.');return}},true);
// Capture new account/chat navigation before legacy demo handlers.
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.msgFilter){e.stopImmediatePropagation();appMsgFilter=b.dataset.msgFilter;appRender();return}if(b.dataset.pickAttachment){e.stopImmediatePropagation();document.getElementById('chat-media-file')?.click();return}if(b.dataset.removeAttachment){e.stopImmediatePropagation();appPendingFile=null;appRender();return}if(b.dataset.recordVoice){e.stopImmediatePropagation();await toggleVoiceRecord(b);return}if(b.dataset.chooseRole){e.stopImmediatePropagation();chosenRole=b.dataset.chooseRole;appRender();return}if(b.dataset.switchAuth){e.stopImmediatePropagation();appMode=appMode==='login'?'signup':'login';appAuthError='';appRender();return}if(b.dataset.appLogout){e.stopImmediatePropagation();stopPolling();clearInterval(appStatusTimer);clearInterval(appUnreadTimer);appUnread=0;authSession=null;appProfile=null;ownedCourses=[];appThreads=[];appMessages=[];localStorage.removeItem(AUTH_KEY);isRegistered=false;s={...defaultState};appMode='login';appRender();return}if(b.dataset.startChat){e.stopImmediatePropagation();try{const a=await ensureSession();const data=await sbRequest('/rest/v1/rpc/app_start_direct_chat',{method:'POST',token:a.access_token,body:JSON.stringify({p_target:b.dataset.startChat})});await fetchThreads();appChatId=data;appMessages=[];appPendingFile=null;appChatMedia.clear();await goPage('chat');await fetchMessages();await markChatRead();appPoll=setInterval(()=>fetchMessages().catch(console.warn),4000)}catch(err){alert('خطا: '+err.message)}return}if(b.dataset.openChat){e.stopImmediatePropagation();appChatId=b.dataset.openChat;appMessages=[];appPendingFile=null;appChatMedia.clear();await goPage('chat');try{await fetchMessages();await markChatRead()}catch(err){alert(err.message)}appPoll=setInterval(()=>fetchMessages().catch(console.warn),4000);return}if(b.dataset.page&&['account-profile','messages','teacher-directory','user-directory','teacher-dashboard','teacher-courses','teacher-course-form','profile'].includes(b.dataset.page)){e.stopImmediatePropagation();await goPage(b.dataset.page==='profile'?'account-profile':b.dataset.page);return}if(b.id==='teacher-mode'){e.stopImmediatePropagation();await goPage(appProfile?.role==='teacher'?'teacher-dashboard':'account-profile');return}if(b.dataset.teacherLogout!==undefined){e.stopImmediatePropagation();await goPage('account-profile');return}},true);
document.addEventListener('submit',async e=>{if(!['app-auth-form','app-profile-form','app-chat-form'].includes(e.target.id))return;e.preventDefault();e.stopImmediatePropagation();const f=new FormData(e.target);try{if(e.target.id==='app-auth-form'){const email=String(f.get('email')||'').trim(),password=String(f.get('password')||'');const signup=appMode==='signup';const a=await sbRequest(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify(signup?{email,password,data:{requested_role:chosenRole}}:{email,password})});if(!a.access_token){appAuthError='ثبت‌نام انجام شد. ابتدا ایمیل خود را تأیید کن، سپس وارد شو.';appMode='login';appRender();return}setSession(a);appProfile=await getProfile();if(!appProfile){throw new Error('پروفایل ساخته نشد. ابتدا فایل SQL نسخه جدید را در Supabase اجرا کن.')}s={...defaultState,name:appProfile.display_name||'کاربر',grade:appProfile.grade||'نهم',page:appProfile.role==='teacher'?'teacher-dashboard':'home'};isRegistered=true;appAuthError='';if(appProfile.role==='teacher')await loadOwned();await loadPublished();appRender();startAccountIndicators()}else if(e.target.id==='app-profile-form'){const a=await ensureSession();const data={display_name:String(f.get('display_name')||'').trim(),bio:String(f.get('bio')||'').trim()};const avatarFile=document.getElementById(appProfile.role==='teacher'?'teacher-avatar-file':'sp-avatar-file')?.files?.[0];if(avatarFile)data.avatar_url=await uploadProfileAvatar(avatarFile,a);if(appProfile.role==='teacher')data.subject=String(f.get('subject')||'').trim();else data.grade=String(f.get('grade')||'نهم');await sbRequest('/rest/v1/app_profiles?id=eq.'+encodeURIComponent(a.user.id),{method:'PATCH',token:a.access_token,headers:{Prefer:'return=minimal'},body:JSON.stringify(data)});appProfile=await getProfile();s.name=appProfile.display_name;s.grade=appProfile.grade||'نهم';appRender();alert('پروفایل ذخیره شد')}else if(e.target.id==='app-chat-form'){const body=String(f.get('body')||'').trim();await sendChatMessage(body,appPendingFile)}}catch(err){appAuthError=err.message;alert('خطا: '+err.message);appRender()}},true);
document.addEventListener('change',e=>{if(e.target.id==='chat-media-file'){try{const file=e.target.files?.[0];validateChatFile(file);appPendingFile=file;const preview=document.getElementById('chat-file-preview');if(preview){preview.style.display='flex';preview.querySelector('span').textContent=file?.name||''}}catch(err){appPendingFile=null;alert(err.message)}}});
document.addEventListener('input',e=>{if(e.target.id==='msg-search'){const term=e.target.value.trim().toLocaleLowerCase('fa');document.querySelectorAll('#msg-list .msg-person').forEach(el=>el.hidden=!el.textContent.toLocaleLowerCase('fa').includes(term))}});
// Prevent legacy signup and local profile from being used as authentication.
document.addEventListener('submit',e=>{if(['guest-signup','teacher-auth-form'].includes(e.target.id)){e.preventDefault();e.stopImmediatePropagation();appRender()}},true);

document.addEventListener('input',e=>{if(e.target.id!=='msg-search')return;const q=e.target.value.trim().toLocaleLowerCase('fa');const list=appUsers.filter(p=>(appMsgFilter==='all'||p.role===appMsgFilter)&&[p.display_name,p.subject,p.grade].join(' ').toLocaleLowerCase('fa').includes(q));const box=document.getElementById('msg-directory-results');if(box)box.innerHTML=messagePeopleMarkup(list)});
document.addEventListener('input',e=>{if(e.target.id!=='directory-search')return;const q=e.target.value.trim().toLocaleLowerCase('fa');const filtered=appUsers.filter(u=>[u.display_name,u.role==='teacher'?'معلم':'دانش‌آموز',u.subject].join(' ').toLocaleLowerCase('fa').includes(q));const el=document.querySelector('#directory-results');if(el)el.innerHTML=directoryItemsMarkup(filtered)});
initApp()})();
