const activeKey='aimadrese-demo-active-v2',profilesKey='aimadrese-demo-profiles-v2';let profiles={};try{profiles=JSON.parse(localStorage.getItem(profilesKey)||'{}')||{}}catch{};let activeId=localStorage.getItem(activeKey)||'',isRegistered=!!(activeId&&profiles[activeId]);let s=isRegistered?{...defaultState,...profiles[activeId]}:{...defaultState};const save=()=>{if(isRegistered&&activeId){profiles[activeId]={...s};localStorage.setItem(profilesKey,JSON.stringify(profiles))}};const profileId=(a,b,c,d)=>JSON.stringify([a.trim().toLocaleLowerCase('fa'),b.trim().toLocaleLowerCase('fa'),c,d.trim()]);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const grades=['اول','دوم','سوم','چهارم','پنجم','ششم','هفتم','هشتم','نهم','دهم','یازدهم','دوازدهم'];

 // دوره‌های جدید از Supabase بارگیری می‌شوند؛ دوره‌های نمایشی ثابت باقی می‌مانند.
 const localCoursesKey='aimadrese-teacher-courses-v1';
 let addedCourses=[];let ownedCourses=[];let authSession=null;let teacherError='';let teacherBusy=false;let editingCourseId=null;
 const SB_URL='https://94-184-25-78.sslip.io', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzk1MjQ5ODI0LCJleHAiOjE5NTI5Mjk4MjR9.6DEcI_1HAn6e7P-DUxFTK3PFkDxzTpYe_ju881E9sxQ', AUTH_KEY='aimadrese-supabase-teacher-session-v1';
 try{authSession=JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch{}

 async function sbRequest(path,options={}){const res=await fetch(SB_URL+path,{...options,headers:{...authHeaders(options.token),...(options.headers||{})}});let data=null;const raw=await res.text();try{data=raw?JSON.parse(raw):null}catch{data={message:raw}};if(!res.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.error||('خطای سرور '+res.status));return data}
 async function ensureSession(){if(!authSession)return null;if(authSession.expires_at&&Date.now()/1000<authSession.expires_at-60)return authSession;try{const a=await sbRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:authSession.refresh_token})});setSession(a);return authSession}catch{authSession=null;localStorage.removeItem(AUTH_KEY);return null}}
 function setSession(a){if(!a?.access_token)return;authSession={...a,expires_at:Math.floor(Date.now()/1000)+(a.expires_in||3600)};localStorage.setItem(AUTH_KEY,JSON.stringify(authSession))}

 function teacherDashboardMarkup(){const pub=ownedCourses.filter(x=>x.status==='published').length;return `<h2>پنل معلم 🎓</h2><section class="ai36-dashboard-entry" dir="rtl"><div><strong>📝 آزمون‌ساز هوشمند</strong><p>ساخت آزمون و ارسال برای دانش‌آموزان</p></div><button type="button" data-ai36="open">ورود به آزمون‌ساز ←</button></section><div class="studio-head"><h3>${esc(authSession?.user?.email||'حساب معلم')}</h3><p class="muted">دوره‌ها در دیتابیس مرکزی ذخیره می‌شوند.</p></div><div class="grid"><div class="card"><h3>${ownedCourses.length}</h3><p class="muted">کل دوره‌ها</p></div><div class="card"><h3>${pub}</h3><p class="muted">منتشرشده</p></div></div><div class="row"><button class="btn" data-teacher-new="1">＋ دوره جدید</button><button class="chip" data-teacher-refresh="1">↻ تازه‌سازی</button></div><div class="section-title">دوره‌های من</div>${ownedCourses.length?ownedCourses.map(c=>`<div class="card"><h3>${esc(c.title)}</h3><p class="muted">${esc(c.subject)} · پایه ${esc(c.grade)} · ${c.status==='published'?'🟢 منتشرشده':'🟠 پیش‌نویس'}</p><div class="row" style="flex-wrap:wrap"><button class="chip" data-teacher-edit="${esc(c.id)}">ویرایش</button><button class="chip" data-teacher-toggle="${esc(c.id)}">${c.status==='published'?'لغو انتشار':'انتشار'}</button><button class="chip" data-teacher-delete="${esc(c.id)}">حذف</button></div></div>`).join(''):'<p class="muted">هنوز دوره‌ای ثبت نکرده‌ای.</p>'}<div class="card"><h3>🤖 دستیار معلم</h3><p class="muted">برای طراحی تمرین و درس می‌توانی از دستیار عمومی اپ استفاده کنی. تحلیل خودکار ویدئو هنوز فعال نیست.</p><button class="chip" data-page="assistant">گفت‌وگو با دستیار</button></div><p class="notice">آمار فروش، ثبت‌نام دانش‌آموزان، کیف پول و بارگذاری ویدئو هنوز متصل نشده‌اند.</p><button class="chip" data-teacher-logout="1">خروج از حساب معلم</button>`}
 function teacherFormMarkup(){const c=ownedCourses.find(x=>x.id===editingCourseId)||{};return `<h2>${editingCourseId?'ویرایش دوره':'ساخت دوره جدید'}</h2><form id="remote-course-form"><label class="field-label">نام مدرس</label><input class="field" name="teacherName" required maxlength="70" value="${esc(c.teacherName||appProfile?.display_name||'')}"><label class="field-label">عنوان دوره</label><input class="field" name="title" required maxlength="100" value="${esc(c.title||'')}"><label class="field-label">درس</label><select class="field" name="subject">${['ریاضی','علوم','فیزیک','فارسی'].map(x=>`<option ${c.subject===x?'selected':''}>${x}</option>`).join('')}</select><label class="field-label">پایه</label><select class="field" name="grade">${grades.map(g=>`<option ${c.grade===g||(!c.grade&&g===s.grade)?'selected':''}>${g}</option>`).join('')}</select><label class="field-label">سرفصل‌ها</label><textarea class="field" name="topics" required maxlength="600" rows="3">${esc(c.topics||'')}</textarea><label class="field-label">توضیحات</label><textarea class="field" name="description" maxlength="600" rows="3">${esc(c.description||'')}</textarea><label class="field-label">قیمت (ریال)</label><input class="field" name="price" type="number" min="0" max="999999999" required value="${esc(c.price||'0')}"><div class="upload">☁️ آپلود ویدئو در این نسخه هنوز فعال نیست</div><button class="btn" style="width:100%" type="submit">${editingCourseId?'ذخیره تغییرات':'ذخیره پیش‌نویس در Supabase'}</button></form><p class="notice">دوره ابتدا پیش‌نویس است؛ از داشبورد آن را منتشر کن.</p><button class="chip" data-page="teacher-dashboard">بازگشت</button>`}

function formatAnswer(raw){
  const source=String(raw||'');
  if(!window.marked||!window.DOMPurify)return esc(source).replace(/\n/g,'<br>');
  const maths=[];
  const tokenized=source.replace(/\\\[([\s\S]*?)\\\]|\$\$([\s\S]*?)\$\$|\\\(([\s\S]*?)\\\)|(?<!\$)\$([^$\n]+)\$(?!\$)/g,(full,a,b,c,d)=>{
    const expression=a??b??c??d;
    const display=a!==undefined||b!==undefined;
    const token=`MATHPLACEHOLDER${maths.length}END`;
    try{maths.push(window.katex?window.katex.renderToString(expression,{throwOnError:false,displayMode:display,output:'html'}):esc(full))}
    catch{maths.push(esc(full))}
    return token;
  });
  let html=window.marked.parse(tokenized,{breaks:true,gfm:true});
  html=html.replace(/MATHPLACEHOLDER(\d+)END/g,(_,i)=>maths[Number(i)]||'');
  return window.DOMPurify.sanitize(html);
}

 if(!decoded.duration||decoded.duration>90)throw Error('ویس باید حداکثر ۹۰ ثانیه باشد.');
 const rate=16000,n=Math.ceil(decoded.duration*rate),data=new ArrayBuffer(44+n*2),view=new DataView(data);

let studentProfileTab='info';
async function uploadProfileAvatar(file,session){
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>3*1024*1024)throw Error('عکس باید JPG، PNG یا WebP و کمتر از ۳ مگابایت باشد.');
 const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type];
 const path=session.user.id+'/'+crypto.randomUUID()+'.'+ext;
 const r=await fetch(SB_URL+'/storage/v1/object/aimadrese-avatars/'+path,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+session.access_token,'Content-Type':file.type,'x-upsert':'false'},body:file});
 if(!r.ok)throw Error('آپلود تصویر: '+(await r.text()).slice(0,180));
 return SB_URL+'/storage/v1/object/public/aimadrese-avatars/'+path;
}
let appUnread=0,appStatusTimer=null,appUnreadTimer=null;
function isUserOnline(p){return !!(p?.last_seen_at&&Date.now()-new Date(p.last_seen_at).getTime()<90000)}
function onlineMark(p){return isUserOnline(p)?'<span class="online-dot" title="آنلاین"></span>':''}
function updateMessageBadge(){document.querySelectorAll('[data-page="messages"],#student-messages-shortcut').forEach(b=>{let badge=b.querySelector('.unread-badge');if(appUnread>0){if(!badge){badge=document.createElement('span');badge.className='unread-badge';b.appendChild(badge)}badge.textContent=appUnread>99?'۹۹+':appUnread.toLocaleString('fa-IR')}else badge?.remove()})}
async function heartbeat(){const a=await ensureSession();if(!a||!appProfile)return;await sbRequest('/rest/v1/app_profiles?id=eq.'+encodeURIComponent(a.user.id),{method:'PATCH',token:a.access_token,headers:{Prefer:'return=minimal'},body:JSON.stringify({last_seen_at:new Date().toISOString()})})}
// V41: monitor unread private messages for each signed-in account.
let ai41UnreadBaselineUser='',ai41UnreadBaseline=null;
function ai41MessageSound(next,userId){
 if(ai41UnreadBaselineUser!==userId){ai41UnreadBaselineUser=userId;ai41UnreadBaseline=null;}
 const previous=ai41UnreadBaseline;
 ai41UnreadBaseline=next;
 // First reading is a baseline, not a new message. Avoid sounds for older unread messages.
 if(previous!==null&&next>previous&&typeof ai39PlayChime==='function')ai39PlayChime();
}

const CHAT_REPLY_MARK='\u2063AIMR1:';
function chatReplyDecode(body){
 const raw=String(body??'');
 if(!raw.startsWith(CHAT_REPLY_MARK))return {text:raw,reply:null};
 const end=raw.indexOf('\u2063',CHAT_REPLY_MARK.length);
 if(end<0||end>1400)return {text:raw,reply:null};
 try{
  const reply=JSON.parse(decodeURIComponent(raw.slice(CHAT_REPLY_MARK.length,end)));
  if(typeof reply?.id!=='string'||reply.id.length>100)return {text:raw,reply:null};
  return {text:raw.slice(end+1),reply:{id:reply.id,name:String(reply.name||'پیام').slice(0,80),preview:String(reply.preview||'').slice(0,150)}};
 }catch{return {text:raw,reply:null}}
}
function chatReplyEncode(body,reply){
 if(!reply)return String(body||'');
 const meta={id:reply.id,name:reply.name,preview:reply.preview};
 const combined=CHAT_REPLY_MARK+encodeURIComponent(JSON.stringify(meta))+'\u2063'+String(body||'');
 if(combined.length>2000)throw Error('متن ریپلای طولانی است؛ لطفاً پیام را کمی کوتاه‌تر کنید.');
 return combined;
}

function syncStudentMessagesShortcut(){
 const header=document.querySelector('.header');if(!header)return;
 let shortcut=document.getElementById('student-messages-shortcut');

 shortcut.hidden=!(authSession&&appProfile&&appProfile.role==='student');
}

// V55: preserve chat scroll and animate only genuinely new message IDs.
let v55ChatId=null,v55Seen=new Set(),v55Opened=false;
function renderChatStable(){
 const old=document.getElementById('chat-feed');
 const same=v55ChatId===appChatId;
 const oldIds=new Set(old?[...old.querySelectorAll('[data-chat-mid]')].map(n=>n.dataset.chatMid):[]);
 const oldTop=old?.scrollTop||0;
 const oldHeight=old?.scrollHeight||0;
 const oldClient=old?.clientHeight||0;
 const bottom=!old||oldHeight-oldTop-oldClient<125;
 const text=document.querySelector('#app-chat-form input[name="body"]')?.value;
 const active=document.activeElement?.matches?.('#app-chat-form input[name="body"]');
 if(!same){v55ChatId=appChatId;v55Seen=new Set();v55Opened=false;}
 screen.innerHTML=chatMarkup();
 const input=document.querySelector('#app-chat-form input[name="body"]');
 if(input&&text!==undefined)input.value=text;
 const feed=document.getElementById('chat-feed');
 if(!feed)return;
 const nodes=[...feed.querySelectorAll('[data-chat-mid]')];
 const newNodes=nodes.filter(n=>!v55Seen.has(n.dataset.chatMid));
 if(v55Opened){newNodes.slice(-8).forEach((n,i)=>{n.classList.add('v55-arrive');n.style.animationDelay=Math.min(i*35,140)+'ms';});}
 nodes.forEach(n=>v55Seen.add(n.dataset.chatMid));
 v55Opened=true;
 // Do not reset to the first message on any rerender, including media refresh.
 feed.scrollTop=bottom?feed.scrollHeight:Math.max(0,oldTop+(feed.scrollHeight-oldHeight));
 requestAnimationFrame(()=>{if(!feed.isConnected)return;feed.scrollTop=bottom?feed.scrollHeight:Math.max(0,oldTop+(feed.scrollHeight-oldHeight));});
 if(active&&input)input.focus({preventScroll:true});
}

function v12UpdateInboxDom(){const search=document.getElementById('msg-search');const term=(search?.value||'').trim().toLocaleLowerCase('fa');const threads=v12Inbox.filter(t=>chatThreadVisible(t)&&(appMsgFilter==='all'||t.role===appMsgFilter)&&[t.display_name,chatReplyDecode(t.last_body).text,t.subject,t.grade].join(' ').toLocaleLowerCase('fa').includes(term));const el=document.getElementById('msg-list');if(el)el.innerHTML=threads.length?threads.map(v12Card).join(''):'<div class="v12-empty">گفت‌وگویی پیدا نشد.</div>'}
async function v12SetupRealtime(){if(!authSession||!appProfile||!window.supabase?.createClient)return;const a=await ensureSession();if(!a)return;try{if(v12Client)await v12Client.removeAllChannels();v12Client=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false},realtime:{params:{eventsPerSecond:10}}});v12Client.realtime.setAuth(a.access_token);v12UserChannel=v12Client.channel('aimadrese-user-'+a.user.id,{config:{private:true}}).on('broadcast',{event:'inbox-update'},()=>{v12FetchInbox();if(s.page==='chat')fetchMessages().catch(console.warn)}).subscribe();v12Client.channel('aimadrese-inbox-db-'+a.user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'app_messages'},()=>{v12FetchInbox();if(s.page==='chat')fetchMessages().catch(console.warn)}).subscribe();v43Subscribe();v12AttachTyping()}catch(e){console.warn('Realtime:',e.message)}}
function v12AttachTyping(){if(!v12Client)return;if(v12ChatChannel){v12Client.removeChannel(v12ChatChannel);v12ChatChannel=null}if(!appChatId)return;const id=appChatId;v12ChatChannel=v12Client.channel('aimadrese-typing-'+id,{config:{private:true}}).on('broadcast',{event:'typing'},({payload})=>{if(!payload||payload.sender===authSession?.user?.id)return;v12Typing[payload.sender]=payload.active?Date.now()+3200:0;if(s.page==='messages')v12UpdateInboxDom();if(s.page==='chat'){const el=document.getElementById('v12-typing-chat');if(el)el.innerHTML=payload.active?'در حال نوشتن... <span class="v12-typing-dots"><i></i><i></i><i></i></span>':''}}).subscribe()}

function v12StartTimers(){if(v12RefreshTimer)clearInterval(v12RefreshTimer);v12RefreshTimer=setInterval(()=>{if(!document.hidden&&authSession){v12FetchInbox();if(s.page==='chat')fetchMessages().catch(console.warn)}},15000);v12FetchInbox();v12SetupRealtime()}

function validateChatFile(file){if(!file)return;const allowed=['image/jpeg','image/png','image/webp','audio/webm','audio/mp4','audio/mpeg','audio/ogg','audio/wav'];if(!allowed.includes(file.type))throw new Error('فقط عکس JPG/PNG/WebP و فایل صوتی مجاز است.');const max=file.type.startsWith('image/')?5:10;if(file.size>max*1024*1024)throw new Error('حجم فایل نباید بیشتر از '+max+' مگابایت باشد.')}
async function sendChatMessage(body,file){
 if(!appChatId||(!body&&!file)||appUploading)return;
 const conversationId=appChatId;
 appUploading=true;
 const submitButton=document.querySelector('#app-chat-form button[type="submit"]');
 if(submitButton)submitButton.disabled=true;
 let sent=false;
 try{
  const a=await ensureSession();
  if(!a?.user?.id)throw new Error('نشست کاربری منقضی شده است؛ دوباره وارد حساب شوید.');
  const reply=chatReplyTarget?.chatId===conversationId?chatReplyTarget:null;
   const prepared=chatReplyEncode(body||' ',reply);
   const data={conversation_id:conversationId,sender_id:a.user.id,body:prepared};
  if(file){
   validateChatFile(file);
   const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','audio/webm':'webm','audio/mp4':'m4a','audio/mpeg':'mp3','audio/ogg':'ogg','audio/wav':'wav'}[file.type];
   const path=conversationId+'/'+a.user.id+'/'+crypto.randomUUID()+'.'+ext;
   const res=await fetch(SB_URL+'/storage/v1/object/aimadrese-chat/'+path,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+a.access_token,'Content-Type':file.type,'x-upsert':'false'},body:file});
   if(!res.ok){const error=await res.text();throw new Error('آپلود ناموفق بود: '+error.slice(0,200))}
   data.attachment_path=path;data.attachment_type=file.type;data.attachment_name=file.name.slice(0,150);
  }
  await sbRequest('/rest/v1/app_messages',{method:'POST',token:a.access_token,headers:{Prefer:'return=minimal'},body:JSON.stringify(data)});
  sent=true;appPendingFile=null;if(chatReplyTarget?.chatId===conversationId)chatReplyTarget=null;
  // Clear the text as soon as the server accepts the message, before any asynchronous rerender.
  const input=document.querySelector('#app-chat-form input[name="body"]');if(input)input.value='';
  try{await fetchMessages()}catch(refreshError){console.warn('Message refresh:',refreshError)}
  try{await v12FetchInbox()}catch(inboxError){console.warn('Inbox refresh:',inboxError)}
 }catch(e){console.error('Chat send failed:',e);alert('خطا در ارسال: '+e.message)}
 finally{
  // Reset BEFORE rendering: otherwise the newly rendered Send button remains disabled.
  appUploading=false;
  if(s.page==='chat'&&appChatId===conversationId){
   const currentText=document.querySelector('#app-chat-form input[name="body"]')?.value||'';
   appRender();
   const nextInput=document.querySelector('#app-chat-form input[name="body"]');
   if(nextInput)nextInput.value=sent?'':currentText;
   const feed=document.getElementById('chat-feed');if(feed&&sent)feed.scrollTop=feed.scrollHeight;
  }
 }
}

function socialMarkup(){if(socView==='feed')return socFeed();if(socView==='reel')return socReels(socCurrent);if(socView==='profile')return socProfile(socCurrent);if(socView==='create')return socCreate();if(socView==='story')return socStory(socCurrent);return socDetail(socPosts.find(p=>p.id===socCurrent))}
async function socMutate(path,method,body){const a=await ensureSession();return sbRequest('/rest/v1/'+path,{method,token:a.access_token,headers:{Prefer:'return=minimal'},body:body?JSON.stringify(body):undefined})}
async function socUpload(file){const a=await ensureSession();if(!file)throw Error('فایل را انتخاب کنید');const type=file.type,video=type.startsWith('video/'),allowed=['image/jpeg','image/png','image/webp','video/mp4','video/webm'];if(!allowed.includes(type))throw Error('فرمت فایل مجاز نیست');if(file.size>(video?30:5)*1024*1024)throw Error('حجم فایل بیش از حد مجاز است');const ext=type.split('/')[1]==='jpeg'?'jpg':type.split('/')[1];const path=socMe()+'/'+crypto.randomUUID()+'.'+ext;const r=await fetch(SB_URL+'/storage/v1/object/aimadrese-social/'+path,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+a.access_token,'Content-Type':type,'x-upsert':'false'},body:file});if(!r.ok)throw Error('آپلود فایل انجام نشد: '+(await r.text()).slice(0,180));return {path,media_type:video?'video':'image'}}
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-soc-go],button[data-soc-open],button[data-soc-tag],button[data-soc-follow],button[data-soc-like],button[data-soc-save],button[data-soc-share],button[data-soc-delete],button[data-soc-report],button[data-soc-message]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();try{if(b.dataset.socType)socDraftType=b.dataset.socType;if(b.dataset.socTag){socTag=b.dataset.socTag;appRender();return}if(b.dataset.socOpen){const chosen=socPosts.find(p=>p.id===b.dataset.socOpen);socGo(chosen?.media_type==='video'?'reel':'post',b.dataset.socOpen);return}if(b.dataset.socGo){socGo(b.dataset.socGo,b.dataset.socId);return}if(b.dataset.socMessage){s.page='messages';appRender();alert('از فهرست کاربران در بخش پیام‌ها مخاطب را انتخاب کنید.');return}if(b.dataset.socShare){const url=location.href.split('#')[0]+'#social-'+b.dataset.socShare;await navigator.clipboard.writeText(url);alert('لینک کپی شد');return}if(b.dataset.socReport){const reason=prompt('دلیل گزارش محتوا را بنویسید');if(reason?.trim()){await socMutate('social_reports','POST',{post_id:b.dataset.socReport,reporter_id:socMe(),reason:reason.slice(0,500)});alert('گزارش ثبت شد')}return}if(b.dataset.socDelete){if(!await ai56Confirm('این پست حذف شود؟'))return;await socMutate('social_posts?id=eq.'+b.dataset.socDelete,'DELETE');socGo('feed');return}if(b.dataset.socFollow){const id=b.dataset.socFollow;if(socFollowing.includes(id))await socMutate('social_follows?follower_id=eq.'+socMe()+'&following_id=eq.'+id,'DELETE');else await socMutate('social_follows','POST',{follower_id:socMe(),following_id:id});await socFetch();return}if(b.dataset.socLike||b.dataset.socSave){const id=b.dataset.socLike||b.dataset.socSave,table=b.dataset.socLike?'social_likes':'social_saves';const a=await ensureSession();const exists=await sbRequest('/rest/v1/'+table+'?post_id=eq.'+id+'&user_id=eq.'+socMe()+'&select=post_id',{token:a.access_token});if(exists.length)await socMutate(table+'?post_id=eq.'+id+'&user_id=eq.'+socMe(),'DELETE');else await socMutate(table,'POST',{post_id:id,user_id:socMe()});b.textContent=exists.length?'♡ پسندیدن':'✓ ثبت شد';return}}catch(err){alert('خطا: '+err.message)}},true);

// V20.2: immediate navigation with an independent first paint.
let socFetchInFlight=false;
function socSafeRender(){
 try{appRender();}
 catch(err){
  console.error('Explore render failed',err);
  const target=document.getElementById('screen');
  if(target)target.innerHTML='<section class="soc" dir="rtl"><h2>اکسپلور</h2><p class="notice">نمایش اکسپلور با مشکل مواجه شد.</p><button class="btn" id="soc-retry">تلاش مجدد</button></section>';
 }
}
function socFirstPaint(){
 const target=document.getElementById('screen');
 if(!target)return;
 try{
  target.innerHTML=socFeed();
 }catch(err){
  console.error('Explore initial paint failed',err);
  target.innerHTML='<section class="soc" dir="rtl"><h2>اکسپلور</h2><p class="notice">صفحه باز شد، اما نمایش محتوا با مشکل مواجه شد.</p><button class="btn" id="soc-retry">تلاش مجدد</button></section>';
 }
 const composer=document.getElementById('composer');
 if(composer)composer.classList.add('hidden');
 const nav=document.getElementById('nav');
 if(nav){nav.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page==='explore'));}
}
async function socSafeFetch(){
 if(socFetchInFlight)return;
 socFetchInFlight=true;
 try{
  // Fetch does not block navigation. Existing socFetch handles Supabase errors.
  await Promise.race([socFetch(),new Promise((_,reject)=>setTimeout(()=>reject(Error('timeout')),12000))]);
 }catch(err){
  socError='دریافت محتوا طول کشید. دوباره تلاش کنید.';
  if(s.page==='explore')socFirstPaint();
 }finally{socFetchInFlight=false;}
}
// Capture the nav click before older handlers and never wait for a network request.
document.addEventListener('click',function(e){
 const b=e.target.closest?.('button[data-page="explore"]');
 if(!b)return;
 e.preventDefault();e.stopImmediatePropagation();
 socView='feed';s.page='explore';socError='';
 socFirstPaint();
 if(Date.now()-socLastLoaded>15000)queueMicrotask(()=>{socSafeFetch();});
},true);
document.addEventListener('click',function(e){
 if(!e.target.closest?.('#soc-retry'))return;
 e.preventDefault();socFirstPaint();socSafeFetch();
},true);

let ai39Audio=null;
let ai39SoundEnabled=localStorage.getItem('ai39-sound')==='on';
function ai39UnlockAudio(){
 try{
  if(!ai39Audio){ai39Audio=new Audio(ai40NotificationSound);ai39Audio.preload='auto';}
  return true;
 }catch(e){return false}
}
function ai39PlayChime(){
 if(!ai39SoundEnabled||document.hidden)return;
 try{
  if(!ai39UnlockAudio())return;
  ai39Audio.pause();ai39Audio.currentTime=0;
  const playing=ai39Audio.play();if(playing?.catch)playing.catch(e=>console.warn('Audio requires user interaction:',e));
 }catch(e){console.warn('Notification sound unavailable',e)}
}
// V42: ask for sound consent once per app entry until accepted; no floating control.
function ai42AskSoundPermission(){
 if(localStorage.getItem('ai39-sound')==='on'||document.getElementById('ai42-sound-dialog'))return;
 const overlay=document.createElement('div');
 overlay.id='ai42-sound-dialog';
 overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');
 overlay.setAttribute('aria-label','فعال‌سازی صدای اعلان‌ها');
 overlay.style.cssText='position:fixed;inset:0;z-index:2147483000;background:rgba(25,18,48,.55);display:flex;align-items:center;justify-content:center;padding:20px;direction:rtl';
 overlay.innerHTML='<div style="width:min(100%,370px);background:#fff;border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 20px 70px #0003;font-family:inherit;color:#29203e"><div style="font-size:40px;margin-bottom:12px">🔔</div><div style="font-weight:800;font-size:19px;margin-bottom:9px">صدای اعلان‌ها فعال بشه؟</div><p style="font-size:14px;line-height:2;color:#665b79;margin:0 0 22px">با فعال‌سازی، برای پیام‌ها و دعوت‌نامه‌های جدید آزمون صدای اعلان پخش می‌شه.</p><div style="display:flex;gap:10px"><button id="ai42-yes" style="flex:1;border:0;border-radius:12px;background:#7446bb;color:#fff;padding:13px;font:inherit;font-weight:700;cursor:pointer">بله، فعال کن</button><button id="ai42-no" style="flex:1;border:1px solid #ddd2ee;border-radius:12px;background:#fff;color:#624391;padding:13px;font:inherit;font-weight:700;cursor:pointer">نه، فعلاً</button></div></div>';
 document.body.appendChild(overlay);
 overlay.querySelector('#ai42-yes').addEventListener('click',()=>{
  ai39SoundEnabled=true;localStorage.setItem('ai39-sound','on');
  ai39UnlockAudio();ai39PlayChime();try{window.AiMadreseNative?.requestPermission()}catch(e){}overlay.remove();
 });
 overlay.querySelector('#ai42-no').addEventListener('click',()=>{
  ai39SoundEnabled=false;localStorage.removeItem('ai39-sound');overlay.remove();
 });
}
// Ask only after a signed-in user has entered the app, once per page load.
let ai42PromptHandled=false;
const ai42PromptTimer=setInterval(()=>{
 if(ai42PromptHandled)return;
 if(!appProfile||!authSession||ai72.status!=='complete'||appProfile.role==='parent')return;
 ai42PromptHandled=true;clearInterval(ai42PromptTimer);
 if(localStorage.getItem('ai39-sound')!=='on')ai42AskSoundPermission();
},600);
// Recreate the audio element after browser suspends playback; no visible control.
document.addEventListener('pointerdown',()=>{if(ai39SoundEnabled)ai39UnlockAudio()},{passive:true});
function ai38NotifyNewInvites(items){
 try{
  const uid=authSession?.user?.id;if(!uid||!Array.isArray(items))return;
  const key='ai38-invites-'+uid;
  const old=JSON.parse(localStorage.getItem(key)||'null');
  const ids=items.map(x=>x.exam_id).filter(Boolean);
  localStorage.setItem(key,JSON.stringify(ids.slice(0,100)));
  if(!old)return;
  const fresh=items.filter(x=>x.exam_id&&!old.includes(x.exam_id)&&!x.submitted_at);
  if(!fresh.length)return;
  // V43 owns notification sounds; retain invitation refresh without duplicate audio.
  const toast=document.createElement('div');toast.className='ai38-toast';toast.textContent='🔔 '+fresh.length+' دعوت‌نامه آزمون جدید دارید';toast.onclick=()=>{toast.remove();ai36Open()};document.body.appendChild(toast);setTimeout(()=>toast.remove(),9000);
  if('Notification' in window&&Notification.permission==='granted'&&document.visibilityState==='visible')new Notification('ای‌آی مدرسه: آزمون جدید',{body:fresh[0].title||'دعوت‌نامه آزمون دریافت کردید'});
 }catch(e){console.warn('Exam notification:',e)}
}

function ai36Teacher(){if(ai36.view==='editor')return ai36Editor();if(ai36.view==='publish')return ai36Publish();if(ai36.view==='report')return ai36Report();return `<div class="ai36-card"><div class="ai36-row"><h3>آزمون‌های من</h3><button class="ai36-btn" data-ai36="new">＋ ساخت آزمون</button></div><p class="ai36-muted">آزمون‌ها فقط برای دانش‌آموزان متصل به حساب شما ارسال می‌شوند.</p></div>${ai36.exams.length?ai36.exams.map(x=>`<div class="ai36-card"><div class="ai36-row"><b>${ai36Safe(x.title)}</b><span class="ai36-pill">${x.published_at?'منتشرشده':'پیش‌نویس'}</span></div><p class="ai36-muted">${ai36Safe(x.subject||'')} · ${ai36Safe(ai36Kinds[x.kind]||x.kind)} · ${ai36Num(x.settings?.duration)} دقیقه</p><button class="ai36-outline" data-ai36="${x.published_at?'report':'edit'}" data-id="${x.id}">${x.published_at?'گزارش و نظارت':'ویرایش و انتشار'}</button><button class="ai36-outline ai38-archive" data-ai36="archive" data-id="${x.id}" data-title="${ai36Safe(x.title)}">🗂 حذف از فهرست</button></div>`).join(''):'<div class="ai36-card">هنوز آزمونی ساخته نشده است.</div>'}<button class="ai36-outline" data-ai36="reload">↻ تازه‌سازی</button>`}

card"><div class="ai36-row"><h3>۳. سؤال‌ها (${ai36Num(d.questions.length)})</h3><button class="ai36-outline" data-ai36="add">＋ سؤال</button></div><div class="ai36-note">تولید پیشنهادی با Gemini: خروجی را حتماً از نظر صحت علمی، بارم و پاسخ صحیح بررسی کنید.</div><button class="ai36-outline" data-ai36="generate">✨ پیشنهاد ۵ سؤال با هوش مصنوعی</button>${d.questions.map((q,i)=>ai36QuestionEditor(q,i)).join('')}<p class="ai36-muted">پاسخ صحیح فقط در دیتابیس محافظت‌شده ذخیره می‌شود و برای دانش‌آموز ارسال نمی‌شود.</p></div><div class="ai36-nav"><button class="ai36-outline" data-ai36="list">بازگشت</button><button class="ai36-btn" data-ai36="save">ذخیره پیش‌نویس</button><button class="ai36-btn" data-ai36="go-publish">انتخاب دانش‌آموزان</button></div>`}

function ai36Student(){if(ai36.view==='take')return ai36Take();if(ai36.view==='detail')return ai36StudentDetail();return `<div class="ai36-card"><h3>دعوت‌نامه‌های آزمون</h3><button class="ai36-outline" data-ai36="notify-enable">🔔 فعال‌سازی اعلان مرورگر</button><p class="ai36-muted">آزمون‌های ارسال‌شده توسط معلم‌های متصل به شما</p></div>${ai36.inbox.length?ai36.inbox.map(x=>`<div class="ai36-card"><div class="ai36-row"><b>${ai36Safe(x.title)}</b><span class="ai36-pill">${x.submitted_at?'تحویل‌شده':x.started_at?'در حال انجام':'دعوت جدید'}</span></div><p class="ai36-muted">${ai36Safe(x.subject||'')} · ${ai36Num(x.duration)} دقیقه · شروع: ${ai36Safe(ai36FormatDate(x.opens_at))}</p><button class="ai36-btn" data-ai36="student-open" data-id="${x.exam_id}">مشاهده آزمون</button></div>`).join(''):'<div class="ai36-card">فعلاً دعوت‌نامه آزمونی ندارید.</div>'}<button class="ai36-outline" data-ai36="reload">↻ تازه‌سازی پیام‌ها</button>`}
function ai36StudentDetail(){const x=ai36.exam;if(!x)return '';const at=x.attempt;const opens=new Date(x.settings.opens_at).getTime(),closes=new Date(x.settings.closes_at).getTime(),now=Date.now();return `<div class="ai36-card"><h3>${ai36Safe(x.title)}</h3><p class="ai36-muted">${ai36Safe(x.subject||'')} · ${ai36Safe(ai36Kinds[x.kind]||x.kind)}</p><p>⏱ ${ai36Num(x.settings.duration)} دقیقه · ${ai36Num(x.questions?.length)} سؤال</p><p class="ai36-muted">شروع: ${ai36FormatDate(x.settings.opens_at)}<br/>پایان: ${ai36FormatDate(x.settings.closes_at)}</p><div class="ai36-note">فقط یک تلاش مجاز است. پاسخ‌ها در سرور ذخیره می‌شوند. خروج از برنامه ممکن است ثبت شود. با قطع اینترنت، ذخیره پاسخ‌ها تضمین نمی‌شود.</div>${at?.submitted_at?`<div class="ai36-ok">آزمون تحویل داده شده است.${at.score!==null?' نمره تستی: '+ai36Num(at.score):' نتیجه هنوز منتشر نشده است.'}</div>`:at?.started_at?'<button class="ai36-btn" data-ai36="resume">ادامه آزمون</button>':now<opens?'<div class="ai36-note">آزمون هنوز شروع نشده است.</div>':now>closes?'<div class="ai36-note">مهلت شرکت تمام شده است.</div>':'<button class="ai36-btn" data-ai36="start">شروع آزمون</button>'}</div><button class="ai36-outline" data-ai36="list">بازگشت</button>`}
function ai36Take(){const x=ai36.exam,at=x?.attempt;if(!x||!at)return '';const qs=x.questions||[],order=ai36Order(qs.length,x.settings.shuffle),i=ai36.question||0,qi=order[i],q=qs[qi];if(!q)return '<div class="ai36-card">سؤالی وجود ندارد.</div>';const a=ai36.answers[String(qi)],remaining=Math.max(0,Math.ceil((new Date(at.deadline).getTime()-Date.now())/1000));return `<div class="ai36-card ai38-exam-card"><div class="ai36-row"><b>${ai36Safe(x.title)}</b><span class="ai36-timer" id="ai36-clock">${ai36Clock(remaining)}</span></div><div class="ai36-progress"><span style="width:${100*Object.keys(ai36.answers).length/Math.max(qs.length,1)}%"></span></div><p class="ai36-muted">سؤال ${ai36Num(i+1)} از ${ai36Num(qs.length)} · ${ai36Num(q.points||1)} نمره</p><h3 class="ai38-question-title">${ai36Safe(q.text)}</h3><div class="ai38-answer-grid">${ai36AnswerWidget(q,qi,a)}</div><p class="ai36-muted" id="ai36-save-status">${ai36Safe(ai36.lastSave||'پاسخ‌ها پس از تغییر ذخیره می‌شوند')}</p></div><div class="ai36-card ai38-question-nav"><div class="ai36-row">${order.map((idx,k)=>`<button class="ai36-outline" style="${k===i?'background:#eee3ff;':''}" data-ai36="jump" data-index="${k}">${ai36Num(k+1)}${ai36.answers[String(idx)]!==undefined?' ✓':''}</button>`).join('')}</div></div><div class="ai36-nav"><button class="ai36-outline" data-ai36="prev" ${i===0?'disabled':''}>قبلی</button><button class="ai36-btn" data-ai36="${i===qs.length-1?'submit':'next'}">${i===qs.length-1?'تحویل نهایی':'بعدی'}</button></div>`}
function ai36AnswerWidget(q,i,a){if(['single','boolean'].includes(q.type)){const opts=q.type==='boolean'?['درست','نادرست']:q.options||[];return opts.map((o,k)=>`<button class="ai36-option ${String(a)===String(k)?'selected':''}" data-ai36="answer" data-index="${i}" data-value="${k}">${ai36Safe(o)}</button>`).join('')}if(q.type==='multi')return (q.options||[]).map((o,k)=>`<label class="ai36-option"><input type="checkbox" data-ai36-multi="${i}" value="${k}" ${Array.isArray(a)&&a.includes(String(k))?'checked':''}/> ${ai36Safe(o)}</label>`).join('');if(['matching','ordering'].includes(q.type))return `<p class="ai36-muted">ترتیب یا تطبیق را به‌صورت آرایه JSON وارد کنید (برای نمونه ["0","2","1"]).</p><textarea class="ai36-field" data-ai36-text="${i}" data-ai36-json="1" rows="3">${ai36Safe(JSON.stringify(a||[]))}</textarea>`;return `<textarea class="ai36-field" data-ai36-text="${i}" rows="${q.type==='essay'?7:2}" placeholder="پاسخ شما">${ai36Safe(a??'')}</textarea>`}
function ai36DateInput(v){const d=new Date(v||Date.now());return Number.isNaN(+d)?'':new Date(+d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function ai36FormatDate(v){try{return new Date(v).toLocaleString('fa-IR')}catch{return '—'}}
function ai36Clock(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function ai36Order(n,shuffle){const a=Array.from({length:n},(_,i)=>i);if(shuffle){const seed=String(ai36.exam?.id||'')+String((authSession?.user?.id)||'');let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);for(let i=a.length-1;i>0;i--){h=(Math.imul(h,1664525)+1013904223)|0;const j=(h>>>0)%(i+1);[a[i],a[j]]=[a[j],a[i]]}}return a}
async function ai36Generate(){
 const d=ai36.draft;
 const prompt=`برای معلم درس ${d.subject} پایه ${d.grade}، پنج سؤال چهارگزینه‌ای مستقل و دقیق متناسب با آزمون «${d.title||'آزمون کلاسی'}» تولید کن. فقط JSON معتبر بدون markdown با ساختار {"questions":[{"type":"single","text":"...","options":["...","...","...","..."],"answer":"0","points":1,"topic":"..."}]} برگردان. answer شماره گزینه درست از صفر تا سه باشد.`;
 const res=await fetch('https://aimadrese-gemini.sepehrkhodadadi84.workers.dev/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],grade:d.grade})});
 const data=await res.json();if(!res.ok)throw Error(data.error||'خطا در تولید سؤال');
 const raw=String(data.reply||data.answer||data.response||data.text||data.message||'');
 const json=raw.match(/\{[\s\S]*\}/);if(!json)throw Error('Gemini پاسخ ساختاریافته معتبر نداد. سؤال‌ها را دستی اضافه کنید.');
 let parsed;try{parsed=JSON.parse(json[0])}catch{throw Error('قالب JSON خروجی Gemini معتبر نبود')}
 const arr=parsed.questions;if(!Array.isArray(arr))throw Error('فهرست سؤال‌ها دریافت نشد');
 const valid=arr.slice(0,5).filter(q=>q&&typeof q.text==='string'&&Array.isArray(q.options)&&q.options.length===4&&/^[0-3]$/.test(String(q.answer))).map(q=>({type:'single',text:q.text.slice(0,2000),options:q.options.map(v=>String(v).slice(0,500)),answer:String(q.answer),points:1,topic:String(q.topic||'').slice(0,100)}));
 if(!valid.length)throw Error('سؤال قابل‌استفاده‌ای تولید نشد');
 d.questions.push(...valid);ai36Draw();alert(`${valid.length} سؤال پیشنهادی اضافه شد. قبل از انتشار بررسی کنید.`)
}
async function ai36SaveDraft(){const d=ai36.draft;const q=d.questions;if(!d.title.trim())throw Error('عنوان آزمون را وارد کنید');if(!q.length)throw Error('حداقل یک سؤال اضافه کنید');for(const x of q){if(!x.text.trim())throw Error('متن همه سؤال‌ها باید تکمیل شود');if(['single','multi','ordering','matching'].includes(x.type)&&(!x.options||x.options.length<2))throw Error('گزینه‌های سؤال کامل نیست');if(['multi','ordering','matching'].includes(x.type)&&typeof x.answer==='string'){try{x.answer=JSON.parse(x.answer)}catch{throw Error('پاسخ چندگزینه‌ای یا ترتیبی باید JSON معتبر باشد')}}}const result=await ai36Api('teacher_save',d);d.id=result.id;ai36.error='';return result}
async function ai36Students(){const a=await ensureSession();const term=encodeURIComponent(ai36.search||'');const rows=await sbRequest('/rest/v1/rpc/ai32_teacher_student_search',{method:'POST',token:a.access_token,body:JSON.stringify({p_query:ai36.search||'',p_grade:null,p_limit:20,p_offset:(ai36.studentPage||0)*20})});ai36.studentRows=rows||[];ai36Draw()}

 async function finalize(){
  const p=chatDeletePending;if(!p)return;

  await chatPersistClear(p.id,p.clearedAt);

 function beginDelete(id){
  if(!id||!authSession?.user?.id)return;
  if(chatDeletePending){
   // Finish the previous deletion before starting another one.
   finalize().catch(err=>console.warn('Chat delete:',err));
  }
  const thread=v12Inbox.find(t=>t.conversation_id===id);
  const lastAt=Date.parse(thread?.last_at||'')||0;
  const clearedAt=new Date(Math.max(Date.now(),lastAt)).toISOString();
  const p={id,deadline:Date.now()+10000,clearedAt,timeout:null,interval:null};
  chatDeletePending=p;
  p.timeout=setTimeout(()=>{if(chatDeletePending===p)finalize().catch(err=>console.warn('Chat delete:',err))},10000);
  p.interval=setInterval(()=>{if(chatDeletePending===p)redrawToast();else clearInterval(p.interval)},250);

 }

 catch(e){ai72.status='db-missing';throw Error('جدول ai72_onboarding موجود نیست یا دسترسی آن تنظیم نشده است. ابتدا SQL نسخه V72 را اجرا کن. '+e.message)}
 const row=rows?.[0]||null;
 ai72.row=row;
 ai72.role=appProfile.role;
 ai72.draft=ai72Defaults(a.user,row||{});
 if(row?.city&&row?.province&&!(ai72Provinces[row.province]||[]).includes(row.city)){ai72.draft.city='سایر شهرها';ai72.draft.city_other=row.city;}
 ai72.step=row?.onboarding_step||0;
 if(!row||!row.completed_at||ai72.step===5){ai72.status='onboard';return}
 ai72.status='complete';
 s={...defaultState,...s,name:appProfile.display_name||'کاربر',grade:appProfile.grade||'نهم',page:appProfile.role==='teacher'?'teacher-dashboard':'home'};
 isRegistered=true;
 if(appProfile.role==='teacher')await loadOwned().catch(e=>console.warn('Teacher load',e));

  await fetchThreads().catch(e=>console.warn('Threads',e));
  if(appProfile.role==='student')await ai37FetchInvites().catch(e=>console.warn('Invites',e));
 }

async function ai72Bootstrap(){
 appLoading=true;appRender();
 try{await ai72HandleCallback();if(authSession)await ai72LoadAccount();else ai72.status='guest'}
 catch(e){appAuthError=e.message;console.warn('V72 startup:',e.message);if(ai72.status!=='db-missing')ai72.status='guest'}
 finally{appLoading=false;appRender()}
}
async function ai72AfterLogin(a){

 setSession(a);appAuthError='';ai72.error='';await ai72LoadAccount();appRender();
}
async function ai72OAuth(){
 if(!window.supabase?.createClient)throw Error('کتابخانه Supabase بارگذاری نشده؛ اتصال اینترنت را بررسی کن.');
 const client=window.supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'implicit',persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
 const {data,error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,skipBrowserRedirect:true}});
 if(error||!data?.url)throw Error(error?.message||'لینک ورود گوگل ایجاد نشد.');
 location.assign(data.url);
}
function ai72QueueSave(data){
 const a=authSession;
 if(!a?.user?.id)return Promise.resolve();
 ai72SaveChain=ai72SaveChain.catch(()=>{}).then(async()=>{
  const sess=await ensureSession();if(!sess||sess.user.id!==a.user.id)throw Error('حساب تغییر کرده یا نشست منقضی شده است.');
  return sbRequest('/rest/v1/ai72_onboarding?id=eq.'+encodeURIComponent(sess.user.id),{method:'PATCH',token:sess.access_token,headers:{Prefer:'return=minimal'},body:JSON.stringify(data)});
 });
 return ai72SaveChain;
}
function ai72Payload(){
 const d=ai72.draft;
 const city=d.city==='سایر شهرها'?String(d.city_other||'').trim():d.city;
 const fields=['first_name','last_name','birth_date','phone','grade','level','track','academic_year','province','school_name','school_type','learning_goal','subject','welcome_character'];
 const data={};for(const k of fields)data[k]=d[k]||null;
 data.city=city||null;
 data.welcome_character=['girl','boy','any'].includes(d.welcome_character)?d.welcome_character:'any';
 data.favorite_subjects=Array.isArray(d.favorite_subjects)?d.favorite_subjects:[];
 data.support_subjects=Array.isArray(d.support_subjects)?d.support_subjects:[];
 if(!data.birth_date)data.birth_date=null;
 if(ai72.role==='student')data.level=ai72GradeNum()?ai72Level():null;
 return data;
}
function ai72ScheduleSave(){
 if(ai72.status!=='onboard'||!ai72.row||ai72.step<1||ai72.step>4)return;
 clearTimeout(ai72AutoTimer);
 ai72AutoTimer=setTimeout(()=>{ai72QueueSave(ai72Payload()).catch(e=>{ai72SaveError=e.message;console.warn('V72 autosave',e.message)})},750);
}
function ai72Validate(step){
 const d=ai72.draft;
 if(step===1){
  if(String(d.first_name||'').trim().length<2||String(d.last_name||'').trim().length<2)return 'نام و نام خانوادگی باید حداقل دو حرف داشته باشند.';
  if(d.phone&&!/^(09\d{9}|\+989\d{9})$/.test(ai72Nums(d.phone).replace(/[\s-]/g,'')))return 'شماره موبایل را به شکل ۰۹۱۲… وارد کن یا خالی بگذار.';
  if(d.birth_date&&new Date(d.birth_date)>new Date())return 'تاریخ تولد نمی‌تواند در آینده باشد.';
  if(ai72.role==='teacher'&&String(d.subject||'').trim().length<2)return 'زمینه تدریس را وارد کن.';
 }
 if(step===2){if(!ai72GradeNum())return 'پایه تحصیلی را انتخاب کن.';if(ai72GradeNum()>=10&&!d.track)return 'رشته تحصیلی را انتخاب کن.'}
 if(step===3&&d.city==='سایر شهرها'&&!String(d.city_other||'').trim())return 'نام شهر را وارد کن یا شهر دیگری انتخاب کن.';
 return '';
}
async function ai72ChooseRole(role){
 if(!['student','teacher','parent'].includes(role)||ai72.loading)return;
 ai72.loading=true;ai72.error='';appRender();
 try{
  const a=await ensureSession();if(!a)throw Error('لطفاً دوباره وارد حساب شو.');
  await sbRequest('/rest/v1/rpc/ai72_claim_role',{method:'POST',token:a.access_token,body:JSON.stringify({p_role:role})});
  appProfile=await getProfile();
  const rows=await sbRequest('/rest/v1/ai72_onboarding?select=*&id=eq.'+encodeURIComponent(a.user.id),{token:a.access_token});
  ai72.row=rows?.[0]||null;
  ai72.role=appProfile.role;
  ai72.draft=ai72Defaults(a.user,ai72.row||{});
  ai72.step=1;
 }catch(e){ai72.error=e.message}
 finally{ai72.loading=false;appRender()}
}
async function ai72StepNext(skip=false){
 if(ai72.loading)return;
 const step=ai72.step;
 const error=skip?'':ai72Validate(step);
 if(error){ai72.error=error;appRender();return}
 clearTimeout(ai72AutoTimer);ai72.error='';ai72.loading=true;
 try{
  await ai72SaveChain.catch(()=>{});
  const isLast=ai72.role!=='student'||step===4;
  const payload={...ai72Payload(),onboarding_step:isLast?5:step+1};
  if(isLast)payload.completed_at=new Date().toISOString();
  await ai72QueueSave(payload);
  if(isLast){
   const a=await ensureSession();if(!a)throw Error('نشست ورود منقضی شده.');
   const display=(String(ai72.draft.first_name||'').trim()+' '+String(ai72.draft.last_name||'').trim()).trim();
   const data={display_name:display||'کاربر'};
   if(ai72.role==='student')data.grade=ai72.draft.grade;
   if(ai72.role==='teacher')data.subject=ai72.draft.subject||'';
   await sbRequest('/rest/v1/app_profiles?id=eq.'+encodeURIComponent(a.user.id),{method:'PATCH',token:a.access_token,headers:{Prefer:'return=minimal'},body:JSON.stringify(data)});
   appProfile=await getProfile();
  }
  ai72.step=payload.onboarding_step;
  ai72.row={...(ai72.row||{}),...payload};
 }catch(e){ai72.error='ذخیره اطلاعات انجام نشد: '+e.message}
 finally{ai72.loading=false;appRender()}
}
async function ai72GoBack(){
 if(ai72.loading)return;
 clearTimeout(ai72AutoTimer);
 ai72.error='';
 if(ai72.step===1){ai72.step=0;appRender();return}
 if(ai72.step>1&&ai72.step<=4){
  try{await ai72SaveChain.catch(()=>{});await ai72QueueSave({...ai72Payload(),onboarding_step:ai72.step-1});ai72.step--}
  catch(e){ai72.error='ذخیره اطلاعات انجام نشد: '+e.message}
 }
 appRender();
}
async function ai72EnterDashboard(){
 if(ai72.loading)return;
 ai72.loading=true;ai72.error='';appRender();
 try{
  const a=await ensureSession();if(!a)throw Error('نشست ورود معتبر نیست.');
  const display=(String(ai72.draft.first_name||'').trim()+' '+String(ai72.draft.last_name||'').trim()).trim();
  const update={display_name:display||'کاربر'};
  if(ai72.role==='student')update.grade=ai72.draft.grade;
  if(ai72.role==='teacher')update.subject=ai72.draft.subject||'';
  await sbRequest('/rest/v1/app_profiles?id=eq.'+encodeURIComponent(a.user.id),{method:'PATCH',token:a.access_token,headers:{Prefer:'return=minimal'},body:JSON.stringify(update)});
  await ai72QueueSave({onboarding_step:99});
  ai72.step=99;ai72.status='complete';
  appProfile=await getProfile();
  s={...defaultState,...s,name:appProfile.display_name||'کاربر',grade:appProfile.grade||'نهم',page:appProfile.role==='teacher'?'teacher-dashboard':'home'};
  isRegistered=true;
  if(appProfile.role==='teacher')await loadOwned().catch(console.warn);
  if(appProfile.role!=='parent'){
   await loadPublished().catch(console.warn);
   await fetchThreads().catch(console.warn);
  }
  startAccountIndicators();v12StartTimers();
 }catch(e){ai72.error=e.message;ai72.status='onboard';ai72.step=5}
 finally{ai72.loading=false;appRender()}
}
window.addEventListener('click',async e=>{
 const b=e.target.closest('[data-ai72],[data-ai72-role],[data-ai72-chip]');if(!b)return;
 e.preventDefault();e.stopImmediatePropagation();
 if(b.dataset.ai72Role){await ai72ChooseRole(b.dataset.ai72Role);return}
 if(b.dataset.ai72Chip){
  const name=b.dataset.ai72Chip,value=b.dataset.ai72Value;
  if(['favorite_subjects','support_subjects'].includes(name)){
   const arr=Array.isArray(ai72.draft[name])?[...ai72.draft[name]]:[];
   ai72.draft[name]=arr.includes(value)?arr.filter(x=>x!==value):[...arr,value];
  }else ai72.draft[name]=value;
  const selected=Array.isArray(ai72.draft[name])?ai72.draft[name].includes(value):ai72.draft[name]===value;
  b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));
  if(name==='learning_goal'||name==='welcome_character')b.parentElement.querySelectorAll('[data-ai72-chip="'+name+'"]').forEach(el=>{el.classList.toggle('selected',el.dataset.ai72Value===value);el.setAttribute('aria-pressed',String(el.dataset.ai72Value===value))});
  ai72ScheduleSave();return;
 }
 switch(b.dataset.ai72){
  case 'begin':case 'have-account':localStorage.setItem(ai72IntroKey,'1');ai72.introDismissed=true;appMode='login';appAuthError='';appRender();break;
  case 'login':appMode='login';appAuthError='';ai72.error='';appRender();break;
  case 'signup':appMode='signup';appAuthError='';ai72.error='';appRender();break;
  case 'reset':appMode='reset';appAuthError='';ai72.error='';appRender();break;
  case 'google':try{ai72.error='';await ai72OAuth()}catch(err){ai72.error=err.message;appRender()}break;
  case 'back':await ai72GoBack();break;
  case 'skip':await ai72StepNext(true);break;
  case 'enter':await ai72EnterDashboard();break;
  case 'retry':appAuthError='';await ai72Bootstrap();break;
 }
},true);
window.addEventListener('submit',async e=>{
 const form=e.target;if(!['ai72-auth-form','ai72-reset-form','ai72-onboard-form'].includes(form?.id))return;
 e.preventDefault();e.stopImmediatePropagation();
 if(ai72.loading)return;
 if(form.id==='ai72-onboard-form'){await ai72StepNext(false);return}
 const data=new FormData(form),email=String(data.get('email')||'').trim(),password=String(data.get('password')||'');
 ai72.error='';appAuthError='';ai72.loading=true;
 try{
  if(form.id==='ai72-reset-form'){
   await sbRequest('/auth/v1/recover',{method:'POST',body:JSON.stringify({email})});
   appMode='login';appAuthError='اگر این ایمیل حساب فعال داشته باشد، لینک بازیابی ارسال می‌شود.';
  }else{
   const signup=appMode==='signup';
   const a=await sbRequest(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify(signup?{email,password}:{email,password})});
   if(!a?.access_token){appMode='login';appAuthError='ثبت‌نام انجام شد؛ اگر تأیید ایمیل فعال است، ایمیلت را تأیید کن و سپس وارد شو.'}
   else await ai72AfterLogin(a);
  }
 }catch(err){ai72.error=err.message}
 finally{ai72.loading=false;appRender()}
},true);
window.addEventListener('input',e=>{
 const el=e.target;if(!el?.closest?.('.ai72-root')||!el.name||!el.closest('#ai72-onboard-form'))return;
 ai72.draft[el.name]=el.value;ai72.error='';ai72ScheduleSave();
},true);
window.addEventListener('change',e=>{
 const el=e.target;if(!el?.closest?.('#ai72-onboard-form')||!el.name)return;
 ai72.draft[el.name]=el.value;
 if(el.name==='province'){ai72.draft.city='';ai72.draft.city_other='';appRender()}
 if(el.name==='city'){ai72.draft.city_other='';appRender()}
 if(el.name==='grade'){ai72.draft.track='';ai72.draft.level=ai72Level();appRender()}
 ai72ScheduleSave();
},true);

ai72Bootstrap()})();

// Voice playback uses the actual audio duration and currentTime; waveform bars are visual.
const v13WaveHeights=[8,12,9,16,21,13,24,17,11,20,26,14,18,31,20,13,26,18,12,23,30,17,12,20,14,9,15,11];
function voiceCardMarkup(url,id){
 const escapeVoiceValue=value=>String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
 const safeUrl=escapeVoiceValue(url),safeId=escapeVoiceValue(id);
 const bars=v13WaveHeights.map((h,i)=>`<span class="v13-bar" style="height:${h}px" data-bar="${i}"></span>`).join('');
 return `<div class="v13-voice" data-voice-id="${safeId}"><button class="v13-play" type="button" aria-label="پخش پیام صوتی" data-v13-play="1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg></button><div class="v13-middle"><div class="v13-wave" data-v13-seek="1" role="slider" tabindex="0" aria-label="موقعیت پخش ویس" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">${bars}</div><span class="v13-duration">۰:۰۰</span></div><button class="v13-speed" type="button" data-v13-speed="1" aria-label="سرعت پخش">1x</button><audio preload="metadata" src="${safeUrl}"></audio></div>`;
}
function v13Time(seconds){if(!Number.isFinite(seconds)||seconds<0)return '۰:۰۰';const n=Math.floor(seconds),v=`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;return v.replace(/\d/g,c=>'۰۱۲۳۴۵۶۷۸۹'[Number(c)])}
function v13Update(box){const a=box.querySelector('audio');if(!a)return;const total=Number.isFinite(a.duration)?a.duration:0;const percent=total?Math.max(0,Math.min(1,a.currentTime/total)):0;box.querySelectorAll('.v13-bar').forEach((bar,i,arr)=>bar.classList.toggle('played',(i+.5)/arr.length<=percent));const time=box.querySelector('.v13-duration');if(time)time.textContent=v13Time(a.paused&&a.currentTime===0?total:a.currentTime)+(a.paused&&a.currentTime===0?'':' / '+v13Time(total));const slider=box.querySelector('.v13-wave');if(slider)slider.setAttribute('aria-valuenow',String(Math.round(percent*100)));const btn=box.querySelector('.v13-play');if(btn){btn.setAttribute('aria-label',a.paused?'پخش پیام صوتی':'توقف پیام صوتی');btn.innerHTML=a.paused?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>'}}
document.addEventListener('click',async e=>{const btn=e.target.closest('[data-v13-play],[data-v13-speed],[data-v13-seek]');if(!btn)return;const box=btn.closest('.v13-voice'),a=box?.querySelector('audio');if(!a)return;e.preventDefault();e.stopImmediatePropagation();if(btn.hasAttribute('data-v13-play')){if(a.paused){document.querySelectorAll('.v13-voice audio').forEach(other=>{if(other!==a)other.pause()});try{await a.play()}catch(err){alert('پخش ویس ممکن نشد: '+err.message)}}else a.pause()}else if(btn.hasAttribute('data-v13-speed')){a.playbackRate=a.playbackRate===1?1.5:a.playbackRate===1.5?2:1;btn.textContent=a.playbackRate+'x'}else if(Number.isFinite(a.duration)&&a.duration>0){const r=btn.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration}v13Update(box)},true);
document.addEventListener('keydown',e=>{const wave=e.target.closest('[data-v13-seek]');if(!wave||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const a=wave.closest('.v13-voice')?.querySelector('audio');if(!a||!Number.isFinite(a.duration))return;e.preventDefault();a.currentTime=e.key==='Home'?0:e.key==='End'?a.duration:Math.max(0,Math.min(a.duration,a.currentTime+(e.key==='ArrowRight'?5:-5)));v13Update(wave.closest('.v13-voice'))});
for(const eventName of ['loadedmetadata','timeupdate','play','pause','ended','durationchange'])document.addEventListener(eventName,e=>{if(e.target.matches?.('.v13-voice audio'))v13Update(e.target.closest('.v13-voice'))},true);

 const key=id=>'aimadrese-reaction-v54--'+id;
 // Deliberately no MutationObserver. Persisted reactions are painted in chatMarkup().
 // Update only the clicked badge, without re-rendering or scanning the document.
 function updateReactionBadge(id){
  const badge=Array.from(document.querySelectorAll('#chat-feed [data-v54-reaction-for]'))
   .find(el=>el.dataset.v54ReactionFor===String(id));
  if(badge){let value='';try{value=localStorage.getItem(key(id))||'';}catch{}if(badge.textContent!==value)badge.textContent=value;}
 }
 function pickerRender(){
  const p=document.getElementById('v54-picker');if(!p)return;
  p.innerHTML='<div class="v54-tabs"><button type="button" class="'+(tab==='emoji'?'active':'')+'" data-v54-tab="emoji">☺ ایموجی</button><button type="button" class="'+(tab==='sticker'?'active':'')+'" data-v54-tab="sticker">▧ استیکر</button></div><div class="v54-grid '+(tab==='sticker'?'stickers':'')+'">'+(tab==='emoji'?emojis:stickers).map(v=>'<button type="button" data-v54-insert="'+esc(v)+'" aria-label="'+esc(v)+'">'+v+'</button>').join('')+'</div>';
 }
 function showReactions(id,anchor){
  target=id;const p=document.getElementById('v54-reactions');if(!p)return;
  p.innerHTML=reactions.map(v=>'<button type="button" data-v54-choose="'+v+'">'+v+'</button>').join('')+'<button type="button" class="v54-more" data-v54-more="1">⋯</button>';
  p.hidden=false;const r=anchor.getBoundingClientRect(),w=Math.min(355,innerWidth-20);
  p.style.width=w+'px';p.style.left=Math.max(10,Math.min(innerWidth-w-10,r.left+r.width/2-w/2))+'px';
  p.style.top=Math.max(8,Math.min(innerHeight-65,r.top-70))+'px';
 }
 document.addEventListener('click',e=>{
  if(swallowMessageClick&&Date.now()<=swallowMessageClick.until){const row=e.target.closest('#chat-feed [data-chat-mid]');if(row?.dataset.chatMid===swallowMessageClick.id){e.preventDefault();e.stopImmediatePropagation();swallowMessageClick=null;return;}}
  const p=document.getElementById('v54-picker'),r=document.getElementById('v54-reactions');
  const toggle=e.target.closest('[data-v54-picker]');if(toggle){e.preventDefault();if(p){p.hidden=!p.hidden;if(!p.hidden)pickerRender()}return}
  const t=e.target.closest('[data-v54-tab]');if(t){tab=t.dataset.v54Tab;pickerRender();return}
  const insert=e.target.closest('[data-v54-insert]');if(insert){const input=document.querySelector('#app-chat-form input[name="body"]');if(input){const i=input.selectionStart??input.value.length;input.setRangeText(insert.dataset.v54Insert,i,input.selectionEnd??i,'end');input.dispatchEvent(new Event('input',{bubbles:true}));input.focus()}if(p)p.hidden=true;return}
  const trigger=e.target.closest('[data-v54-react]');if(trigger){e.preventDefault();showReactions(trigger.dataset.v54React,trigger);return}
  const choice=e.target.closest('[data-v54-choose]');if(choice&&target){try{const k=key(target),v=choice.dataset.v54Choose;localStorage.setItem(k,localStorage.getItem(k)===v?'':v)}catch(err){console.warn('Reaction storage:',err)}updateReactionBadge(target);if(r)r.hidden=true;return}
  if(e.target.closest('[data-v54-more]')){if(r)r.hidden=true;if(p){p.hidden=false;tab='emoji';pickerRender()}return}
  if(p&&!e.target.closest('#v54-picker'))p.hidden=true;
  if(r&&!e.target.closest('#v54-reactions'))r.hidden=true;
 },true);

 // V66: Telegram-like gestures, scoped to the private chat. No MutationObserver.
 let gesture=null, lastTap=null, swallowMessageClick=null;
 function dismissActionSheet(){document.querySelector('#v66-action-layer')?.remove();}
 function messageFromId(id){return window.aiChatV66?.info(id);}
 function showActionSheet(id){
  const m=messageFromId(id);if(!m||m.deleted)return;
  dismissActionSheet();
  const mine=m.mine;
  const sheet=document.createElement('div');sheet.id='v66-action-layer';sheet.className='v66-action-layer';const openedAt=Date.now();
  sheet.innerHTML=`<div class="v66-action-sheet" role="dialog" aria-modal="true" aria-label="گزینه‌های پیام">
   <div class="v66-action-grip"></div><div class="v66-action-title">گزینه‌های پیام</div>
   <div class="v66-action-items">
    <button type="button" data-v66-action="reply">↩ <span>پاسخ دادن</span></button>
    <button type="button" data-v66-action="${m.pinned?'unpin':'pin'}">📌 <span>${m.pinned?'برداشتن پین':'پین کردن'}</span></button>
    ${mine&&!m.hasAttachment?'<button type="button" data-v66-action="edit">✎ <span>ویرایش پیام</span></button>':''}
    ${mine?'<button type="button" class="v66-danger" data-v66-action="delete">🗑 <span>حذف پیام</span></button>':''}
   </div><button type="button" class="v66-action-cancel" data-v66-dismiss="1">بستن</button>
  </div>`;
  sheet.addEventListener('click',async e=>{
   const btn=e.target.closest('[data-v66-action]');
   if(!btn){if(e.target===sheet&&Date.now()-openedAt<450)return;if(e.target===sheet||e.target.closest('[data-v66-dismiss]'))dismissActionSheet();return;}
   const action=btn.dataset.v66Action;dismissActionSheet();
   try{
    if(action==='reply')window.aiChatV66.reply(id);
    else if(action==='edit')window.aiChatV66.edit(id);
    else await window.aiChatV66.action(id,action);
   }catch(err){alert('خطا: '+err.message)}
  });
  document.body.appendChild(sheet);
 }
 function clearLongPress(){clearTimeout(longTimer);longTimer=null;}
 function clearGesture(){
  clearLongPress();
  if(gesture?.bubble){const b=gesture.bubble;b.classList.remove('v66-dragging');b.style.transform='';}
  gesture=null;
 }
 document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(e.target.closest('button,a,input,textarea,select,video,audio,[contenteditable="true"]'))return;
  const bubble=e.target.closest('#chat-feed .v8-message-content');
  const row=bubble?.closest('[data-chat-mid]');
  if(!row||row.dataset.v66Active==='0')return;
  dismissActionSheet();
  clearGesture();
  gesture={id:row.dataset.chatMid,pointerId:e.pointerId,pointerType:e.pointerType,
   bubble,row,startX:e.clientX,startY:e.clientY,dx:0,dy:0,swiping:false,scrolling:false,longPressed:false};
  longTimer=setTimeout(()=>{
   if(!gesture||gesture.swiping||gesture.scrolling)return;
   gesture.longPressed=true;swallowMessageClick={id:gesture.id,until:Date.now()+600};
   showActionSheet(gesture.id);
  },580);
 },{passive:true});
 document.addEventListener('pointermove',e=>{
  const g=gesture;if(!g||e.pointerId!==g.pointerId)return;
  g.dx=e.clientX-g.startX;g.dy=e.clientY-g.startY;
  const ax=Math.abs(g.dx),ay=Math.abs(g.dy);
  if(ax>9||ay>9)clearLongPress();
  if(g.longPressed||g.scrolling)return;
  if(ay>12&&ay>ax*1.1){g.scrolling=true;return;}
  const direction=g.row.classList.contains('v8-out')?-1:1;
  if(g.dx*direction>9&&ax>ay*1.15){
   g.swiping=true;
   g.bubble.classList.add('v66-dragging');
   const distance=Math.min(70,(ax-9)*.8);
   g.bubble.style.transform=`translate3d(${direction*distance}px,0,0)`;
   if(e.cancelable)e.preventDefault();
  }
 },{passive:false});
 document.addEventListener('pointerup',e=>{
  const g=gesture;if(!g||e.pointerId!==g.pointerId)return;
  clearLongPress();gesture=null;
  g.bubble.classList.remove('v66-dragging');g.bubble.style.transform='';
  if(g.longPressed)return;
  if(g.swiping){
   swallowMessageClick={id:g.id,until:Date.now()+450};
   const direction=g.row.classList.contains('v8-out')?-1:1;
   if(g.dx*direction>=62&&Math.abs(g.dy)<65){
    window.aiChatV66?.reply(g.id);
   }
   lastTap=null;return;
  }
  if(g.scrolling||Math.abs(g.dx)>14||Math.abs(g.dy)>14){lastTap=null;return;}
  const now=Date.now();
  if(lastTap&&lastTap.id===g.id&&now-lastTap.time<380&&
     Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<32){
   lastTap=null;swallowMessageClick={id:g.id,until:now+450};
   showReactions(g.id,g.bubble);
   if(e.cancelable)e.preventDefault();
  }else lastTap={id:g.id,time:now,x:e.clientX,y:e.clientY};
 },{passive:false});
 document.addEventListener('pointercancel',()=>{clearGesture();lastTap=null;},{passive:true});
 document.addEventListener('contextmenu',e=>{
  const row=e.target.closest('#chat-feed [data-chat-mid]');
  if(!row||row.dataset.v66Active==='0'||e.target.closest('button,a,input,textarea'))return;
  e.preventDefault();clearGesture();showActionSheet(row.dataset.chatMid);
 });
 document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){dismissActionSheet();return;}
  const row=e.target.closest('#chat-feed [data-chat-mid]');
  if(row&&row.dataset.v66Active==='1'&&(e.key==='Enter'||e.key===' '||e.key==='F10')){
   e.preventDefault();showActionSheet(row.dataset.chatMid);
  }
 });

})();
</script>

<script id="ai56-dialog-system">
(function(){
window.ai56Confirm=function(message){
 return new Promise(resolve=>{
  const overlay=document.createElement('div');overlay.className='ai56-backdrop';
  overlay.innerHTML='<div class="ai56-dialog" role="alertdialog" aria-modal="true" aria-labelledby="ai56-title" aria-describedby="ai56-text"><div class="ai56-symbol">✦</div><h3 id="ai56-title">تأیید عملیات</h3><p id="ai56-text"></p><div class="ai56-actions"><button class="ai56-cancel" type="button">انصراف</button><button class="ai56-accept" type="button">تأیید</button></div></div>';
  overlay.querySelector('#ai56-text').textContent=String(message);
  const done=v=>{document.removeEventListener('keydown',onKey,true);overlay.remove();resolve(v)};
  const onKey=e=>{if(e.key==='Escape'){e.preventDefault();done(false)}};
  overlay.querySelector('.ai56-cancel').addEventListener('click',()=>done(false));
  overlay.querySelector('.ai56-accept').addEventListener('click',()=>done(true));
  overlay.addEventListener('click',e=>{if(e.target===overlay)done(false)});
  document.addEventListener('keydown',onKey,true);
  document.body.appendChild(overlay);overlay.querySelector('.ai56-cancel').focus({preventScroll:true});
 });
};
window.ai56Toast=function(message){
 let wrap=document.querySelector('.ai56-toast-wrap');
 if(!wrap){wrap=document.createElement('div');wrap.className='ai56-toast-wrap';document.body.appendChild(wrap)}
 wrap.innerHTML='<div class="ai56-toast" role="status"></div>';
 wrap.firstChild.textContent=String(message);
 clearTimeout(window.__ai56ToastTimer);
 window.__ai56ToastTimer=setTimeout(()=>wrap.remove(),3600);
};
window.alert=window.ai56Toast;
})();
</script>
