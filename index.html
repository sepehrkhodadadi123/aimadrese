<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087df4"><title>ای‌آی مدرسه</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><style>
@font-face{font-family:Vazir;src:url('/fonts/Vazir.ttf')}@font-face{font-family:Vazir;src:url('/fonts/Vazir-Medium.ttf');font-weight:600}@font-face{font-family:Vazir;src:url('/fonts/Vazir-Light.ttf');font-weight:300}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e9f7ff,#d6eeff 65%,#f6fbff);font-family:Vazirmatn,Vazir,Tahoma,sans-serif;color:#142c46}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:460px;min-height:100dvh;margin:auto;background:#fbfdff;display:flex;flex-direction:column;box-shadow:0 0 50px #2b73aa18}.header{display:flex;align-items:center;justify-content:space-between;padding:19px 22px;border-bottom:1px solid #e8f0f8}.brand{font-weight:600;color:#0876d7;font-size:23px}.brand b{color:#0eafa5}.muted{color:#7890a5;font-size:12px}.screen{flex:1;padding:20px;overflow-y:auto;min-height:0}.hero{background:linear-gradient(120deg,#087df4,#29b2e7);color:white;padding:22px;border-radius:23px;margin-bottom:20px}.hero p{color:#e7f5ff}.card{border:1px solid #e5eef6;background:white;padding:17px;border-radius:18px;margin:12px 0;box-shadow:0 4px 15px #134c7a08}.card h3{margin:0 0 9px;font-size:15px}.card p{font-size:13px;line-height:2;color:#62788c}.btn{border:0;border-radius:13px;background:#087df4;color:white;padding:10px 16px}.ghost{background:#e8f4ff;color:#076ac6}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.nav{display:grid;grid-template-columns:repeat(5,1fr);background:white;border-top:1px solid #e5edf6;padding:10px 3px max(13px,env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#8393a5;font-size:11px;padding:5px 0}.nav button span{display:block;font-size:23px}.nav button.active{color:#087df4;font-weight:600}.composer{display:flex;gap:8px;padding:10px 14px;background:#f8fbff}.composer input{flex:1;min-width:0;border:1px solid #e1eaf3;border-radius:30px;padding:11px 15px;outline:0}.composer button{border:0;border-radius:50%;background:#087df4;color:white;width:42px;height:42px}.message{white-space:pre-wrap;line-height:2;font-size:13px;padding:12px 15px;border-radius:17px;margin:11px 0;max-width:94%}.message.user{background:#087df4;color:white;margin-right:auto;border-bottom-left-radius:4px}.message.assistant{background:#e9f3fd;border-bottom-right-radius:4px}.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}.chips button{background:#eef7ff;border:1px solid #d6eafa;border-radius:30px;padding:9px 12px;color:#0874c7;font-size:12px}.center{text-align:center;padding-top:70px}.robot{font-size:54px;margin-bottom:15px}.field{width:100%;padding:12px;border:1px solid #dce7f1;border-radius:13px;background:white;margin:7px 0 17px}.bar{background:#e8eff6;height:9px;border-radius:10px;overflow:hidden}.bar div{height:100%;background:#0fb9a8}.notice{font-size:11px;line-height:1.9;color:#667e93;background:#f0f7fd;border-radius:12px;padding:11px}.status{font-size:11px;color:#9a6315}.hidden{display:none}@media(min-width:700px){body{padding:25px}.wrap{height:calc(100dvh - 50px);min-height:680px;border-radius:27px;overflow:hidden}.screen{overflow:auto}}

.message{white-space:normal;overflow-wrap:anywhere;font-size:14px;line-height:2.1}.message p{margin:0 0 10px}.message p:last-child{margin-bottom:0}.message h2,.message h3{font-size:15px;margin:12px 0 6px}.message ul,.message ol{padding-right:22px}.message .katex-display{direction:ltr;overflow-x:auto;overflow-y:hidden;padding:8px 0}.message .katex{direction:ltr;unicode-bidi:isolate}.message pre{direction:ltr;text-align:left;overflow:auto;background:#fff;border-radius:10px;padding:10px}.message table{border-collapse:collapse;display:block;overflow-x:auto}.message td,.message th{border:1px solid #bed3e6;padding:5px 8px}.msg-wrap{margin:11px 0;display:flex;flex-direction:column;align-items:flex-start}.msg-wrap.user-wrap{align-items:flex-end}.msg-wrap .message{margin:0;max-width:94%}.msg-actions{display:flex;gap:8px;margin-top:5px}.copy-btn{border:1px solid #d5e5f2;border-radius:10px;padding:4px 10px;background:white;color:#31678c;font-size:11px}.composer{align-items:center;flex-wrap:wrap}.composer input{min-height:44px}.composer .tool-btn{flex:0 0 39px;width:39px;height:39px;background:#e7f3ff;color:#126cbb}.composer .tool-btn.recording{background:#ffe5e5;color:#bc2828;animation:pulse 1s infinite}.composer .send-btn{flex:0 0 42px}.composer input[type=file]{display:none}.attachment-preview{width:100%;font-size:12px;color:#426c89;display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:#eaf5ff;border-radius:10px}.attachment-preview.hidden{display:none}.attachment-preview button{width:auto;height:auto;border-radius:8px;background:transparent;color:#b32828;padding:3px 7px}.message img{max-width:100%;border-radius:10px}.msg-media{font-size:12px;margin-top:5px;opacity:.85}@keyframes pulse{50%{opacity:.55}}.composer button:disabled{opacity:.5;cursor:wait}

.brand{display:flex;align-items:center;min-width:0}.brand-logo{display:block;width:175px;max-width:100%;height:auto;object-fit:contain}
@media(max-width:380px){.brand-logo{width:145px}}
</style></head><body><div class="wrap"><header class="header"><div class="brand"><img src="/aimadrese-logo.png" alt="ای‌آی مدرسه" class="brand-logo"></div></header><main class="screen" id="screen"></main><div class="composer hidden" id="composer"><div id="attachment-preview" class="attachment-preview hidden"><span id="attachment-name"></span><button id="remove-attachment" type="button">حذف ×</button></div><input type="file" id="image-file" accept="image/jpeg,image/png,image/webp" aria-label="انتخاب عکس"><button id="pick-image" class="tool-btn" type="button" title="ارسال عکس" aria-label="ارسال عکس">📷</button><button id="record-voice" class="tool-btn" type="button" title="ضبط ویس" aria-label="ضبط ویس">🎙️</button><input id="question" placeholder="سؤالت رو بپرس..." aria-label="سؤال درسی"><button id="send" class="send-btn" aria-label="ارسال">➤</button></div><nav class="nav" id="nav"><button data-page="home"><span>⌂</span>خانه</button><button data-page="plan"><span>▦</span>برنامه</button><button data-page="assistant"><span>🤖</span>دستیار</button><button data-page="courses"><span>▤</span>دوره‌ها</button><button data-page="profile"><span>♙</span>پروفایل</button></nav></div>
<script>
(()=>{const $=s=>document.querySelector(s),screen=$('#screen'),composer=$('#composer'),input=$('#question');
const defaultState={name:'دانش‌آموز',grade:'دوازدهم',tasks:[false,false,false],messages:[],page:'home'};
let s;try{s={...defaultState,...JSON.parse(localStorage.getItem('aimadrese-demo')||'{}')}}catch{s={...defaultState}}
const save=()=>localStorage.setItem('aimadrese-demo',JSON.stringify(s));
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const grades=['سوم','چهارم','پنجم','ششم','هفتم','هشتم','نهم','دهم','یازدهم','دوازدهم'];
function render(){save();document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===s.page));composer.classList.toggle('hidden',s.page!=='assistant');
if(s.page==='home')screen.innerHTML=`<div class="hero"><h2>سلام ${esc(s.name)} جان! 👋</h2><p>هر روز یک قدم به یادگیری بهتر نزدیک‌تر شو.</p><button class="btn" style="background:white;color:#087df4" data-page="assistant">شروع گفتگو با دستیار</button></div><h3>مسیر یادگیری تو</h3><div class="grid"><div class="card"><h3>🎯 کارهای امروز</h3><p>${s.tasks.filter(Boolean).length} از ۳ انجام شده</p></div><div class="card"><h3>📚 پایه تحصیلی</h3><p>${esc(s.grade)}</p></div></div><div class="card"><h3>📐 کمک در ریاضی</h3><p>سؤالت رو بپرس و قدم‌به‌قدم یاد بگیر.</p><button class="btn" data-ask="معادله درجه دوم را توضیح بده">شروع یادگیری</button></div><div class="card"><h3>📅 برنامه امروز</h3><button class="btn ghost" data-page="plan">مشاهده برنامه</button></div>`;
if(s.page==='plan')screen.innerHTML=`<h2>برنامه امروز 📅</h2><p class="muted">کارهای انجام‌شده رو علامت بزن.</p>${['مرور درس — ۲۵ دقیقه','حل تمرین — ۳۰ دقیقه','مرور نکات — ۱۵ دقیقه'].map((x,i)=>`<div class="card"><label><input type="checkbox" data-task="${i}" ${s.tasks[i]?'checked':''}> ${x}</label></div>`).join('')}<div class="card"><h3>پیشرفت امروز</h3><div class="bar"><div style="width:${s.tasks.filter(Boolean).length/3*100}%"></div></div><p>${s.tasks.filter(Boolean).length} از ۳ فعالیت</p></div>`;
if(s.page==='assistant'){screen.innerHTML=s.messages.length?s.messages.map((m,i)=>`<div class="msg-wrap ${m.role==='user'?'user-wrap':''}"><div class="message ${m.role}">${m.role==='assistant'?formatAnswer(m.text):esc(m.text).replace(/\n/g,'<br>')}${m.mediaLabel?`<div class="msg-media">${esc(m.mediaLabel)}</div>`:''}</div>${m.role==='assistant'&&!m.pending?`<div class="msg-actions"><button class="copy-btn" data-copy="${i}" aria-label="کپی پاسخ">📋 کپی پاسخ</button></div>`:''}</div>`).join(''):`<div class="center"><div class="robot">🤖</div><h2>سلام ${esc(s.name)} جان!</h2><p class="muted">من دستیار آموزشی ای‌آی مدرسه هستم.<br>می‌تونی سؤال رو بنویسی، عکس بفرستی یا ویس ضبط کنی.</p></div><div class="chips"><button data-ask="معادله درجه دوم را توضیح بده">📐 ریاضی</button><button data-ask="برای امتحان برنامه بده">📅 برنامه امتحان</button><button data-ask="از من آزمون بگیر">✏️ آزمون</button><button data-ask="زبان انگلیسی تمرین کنیم">🇬🇧 زبان</button></div>`;screen.scrollTop=screen.scrollHeight}
if(s.page==='courses')screen.innerHTML=`<h2>دوره‌های آموزشی 📚</h2><div class="card"><h3>ریاضی ${esc(s.grade)}</h3><p>پیش‌نمایش مفاهیم و حل تمرین</p><button class="btn" data-ask="معادله درجه دوم را توضیح بده">پیش‌نمایش</button></div><div class="card"><h3>زبان انگلیسی</h3><p>تمرین لغت و گرامر</p><button class="btn" data-ask="زبان انگلیسی تمرین کنیم">شروع تمرین</button></div><div class="notice">دوره‌ها فعلاً نمونه هستند و خرید واقعی ندارند.</div>`;
if(s.page==='profile')screen.innerHTML=`<h2>پروفایل من 👤</h2><div class="card"><label>نام نمایشی</label><input class="field" id="name" maxlength="40" value="${esc(s.name)}"><label>پایه تحصیلی</label><select class="field" id="grade">${grades.map(g=>`<option ${g===s.grade?'selected':''}>${g}</option>`).join('')}</select><button class="btn" id="save-profile">ذخیره تغییرات</button></div><div class="card"><h3>🔒 حریم خصوصی</h3><p>نام، پایه و برنامه در همین مرورگر ذخیره می‌شود. برای تست از اطلاعات واقعی حساس استفاده نکن.</p></div><button class="btn ghost" id="reset">پاک کردن داده‌های آزمایشی</button>`}
// تبدیل Markdown و LaTeX به نمایش امن و خوانا
function formatAnswer(raw){
  const source=String(raw||'');
  if(!window.marked||!window.DOMPurify)return esc(source).replace(/\n/g,'<br>');
  const maths=[];
  const tokenized=source.replace(/\\\[([\s\S]*?)\\\]|\$\$([\s\S]*?)\$\$|\\\(([\s\S]*?)\\\)|(?<!\$)\$([^$\n]+)\$(?!\$)/g,(full,a,b,c,d)=>{
    const expression=a??b??c??d;
    const display=a!==undefined||b!==undefined;
    const token=`MATHPLACEHOLDER${maths.length}END`;
    try{maths.push(window.katex?window.katex.renderToString(expression,{throwOnError:false,displayMode:display,output:'html'}):esc(full))}
    catch{maths.push(esc(full))}
    return token;
  });
  let html=window.marked.parse(tokenized,{breaks:true,gfm:true});
  html=html.replace(/MATHPLACEHOLDER(\d+)END/g,(_,i)=>maths[Number(i)]||'');
  return window.DOMPurify.sanitize(html);
}
let attachment=null, recorder=null, recordParts=[],busy=false;
const preview=$('#attachment-preview'),attachmentName=$('#attachment-name');
function updateAttachment(){preview.classList.toggle('hidden',!attachment);attachmentName.textContent=attachment?(attachment.kind==='image'?'📷 عکس آماده ارسال':'🎙️ ویس آماده ارسال'):'';}
function fileAsBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)})}
$('#image-file').addEventListener('change',async e=>{
  const file=e.target.files?.[0];if(!file)return;
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){alert('فقط JPG، PNG یا WebP مجاز است.');return}
  if(file.size>4*1024*1024){alert('حجم عکس باید کمتر از ۴ مگابایت باشد.');return}
  attachment={kind:'image',mimeType:file.type,data:await fileAsBase64(file)};updateAttachment();e.target.value='';
});
$('#record-voice').addEventListener('click',async()=>{
  if(recorder&&recorder.state==='recording'){recorder.stop();return}
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){alert('ضبط صدا در این مرورگر پشتیبانی نمی‌شود.');return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(x=>MediaRecorder.isTypeSupported(x))||'';
    recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);recordParts=[];
    recorder.ondataavailable=e=>{if(e.data.size)recordParts.push(e.data)};
    recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());$('#record-voice').classList.remove('recording');$('#record-voice').textContent='🎙️';const blob=new Blob(recordParts,{type:recorder.mimeType||'audio/webm'});if(blob.size>6*1024*1024){alert('ویس طولانی است؛ کوتاه‌تر ضبط کن.');return}attachment={kind:'audio',mimeType:blob.type.split(';')[0],data:await fileAsBase64(blob)};updateAttachment()};
    recorder.start();$('#record-voice').classList.add('recording');$('#record-voice').textContent='⏹';
  }catch{alert('برای ضبط ویس، دسترسی میکروفون را در مرورگر فعال کن.')}
});
async function ask(q){
  if(busy)return;
  q=String(q??input.value).trim();if(!q&&!attachment)return;
  const media=attachment;attachment=null;updateAttachment();input.value='';
  const text=q||(media?.kind==='image'?'لطفاً سؤال داخل تصویر را بخوان و مرحله‌به‌مرحله توضیح بده.':'لطفاً به سؤال صوتی من به فارسی پاسخ بده.');
  s.page='assistant';s.messages.push({role:'user',text,mediaLabel:media?.kind==='image'?'📷 تصویر پیوست شده':media?.kind==='audio'?'🎙️ پیام صوتی پیوست شده':undefined});
  const history=s.messages.filter(m=>!m.pending).slice(-12).map(m=>({role:m.role,content:m.text}));
  const pendingIndex=s.messages.length;s.messages.push({role:'assistant',text:'در حال بررسی سؤال…',pending:true});busy=true;$('#send').disabled=true;render();
  try{
    const response=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,grade:s.grade,attachment:media})});
    const data=await response.json();if(!response.ok)throw new Error(data.error||'خطا در ارتباط با دستیار');
    s.messages[pendingIndex].text=data.reply||'پاسخی دریافت نشد.';
  }catch(err){s.messages[pendingIndex].text='⚠️ '+(err.message||'ارتباط برقرار نشد');}
  s.messages[pendingIndex].pending=false;busy=false;$('#send').disabled=false;render();
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){s.page=b.dataset.page;render()}else if(b.dataset.ask)ask(b.dataset.ask);else if(b.id==='send')ask();else if(b.id==='pick-image')$('#image-file').click();else if(b.id==='remove-attachment'){attachment=null;updateAttachment()}else if(b.dataset.copy!==undefined){const msg=s.messages[Number(b.dataset.copy)];if(msg){navigator.clipboard.writeText(msg.text).then(()=>{b.textContent='✓ کپی شد';setTimeout(()=>b.textContent='📋 کپی پاسخ',1500)}).catch(()=>alert('کپی در این مرورگر امکان‌پذیر نیست.'))}}else if(b.id==='save-profile'){s.name=$('#name').value.trim()||'دانش‌آموز';s.grade=$('#grade').value;render()}else if(b.id==='reset'){if(confirm('داده‌های آزمایشی پاک شوند؟')){localStorage.removeItem('aimadrese-demo');s={...defaultState,tasks:[false,false,false],messages:[]};render()}}});
document.addEventListener('change',e=>{if(e.target.dataset.task!==undefined){s.tasks[+e.target.dataset.task]=e.target.checked;render()}});input.addEventListener('keydown',e=>{if(e.key==='Enter')ask()});render()})();
</script></body></html>
