<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f9f9ff"><title>ای‌آی مدرسه | اپ آموزشی</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#e9e9fa;font-family:Vazirmatn,Tahoma,sans-serif;color:#25243c}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:440px;margin:auto;min-height:100dvh;height:100dvh;background:#f9f9ff;display:flex;flex-direction:column;box-shadow:0 12px 60px #403f7d24;overflow:hidden}.header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;background:#f9f9ff}.brand-logo{width:122px;height:36px;object-fit:contain}.header-label{font-size:13px;font-weight:800}.avatar{background:#eae4ff;border-radius:50%;padding:9px}.screen{flex:1;overflow-y:auto;padding:15px 17px 25px;scrollbar-width:thin}.screen h2{font-size:19px;margin:4px 0 14px}.screen h3{font-size:14px;margin:0 0 7px}.muted{color:#8b89a3;font-size:12px;line-height:1.8}.card,.tile{background:#fff;border:1px solid #eeebfb;border-radius:20px;padding:15px;box-shadow:0 4px 13px #6255b008;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{background:linear-gradient(120deg,#9a69f4,#6540d9);color:white;border:0;border-radius:13px;padding:10px 16px;font-weight:700}.ghost{background:#f0eaff;color:#6e45d9}.nav{display:grid;grid-template-columns:repeat(5,1fr);padding:8px 3px max(12px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid #f0ecfc}.nav button{border:0;background:none;color:#9491a6;font-size:10px}.nav button span{display:block;font-size:21px;margin-bottom:3px}.nav button.active{color:#7249e8;font-weight:800}.hidden{display:none!important}.hero{background:linear-gradient(135deg,#ae81fa,#7245e4 70%,#5e3bd0);border-radius:22px;color:white;padding:21px 17px;position:relative;overflow:hidden;margin-bottom:13px;min-height:155px}.hero h2{font-size:19px;margin:0 0 6px;color:white}.hero p{font-size:12px;line-height:1.9;color:#f4efff;max-width:72%}.hero .robot{position:absolute;left:13px;top:35px;font-size:65px;filter:drop-shadow(0 8px 10px #3c228850)}.hero button{background:#fff;border:0;border-radius:15px;color:#6942d6;padding:10px 14px;font-weight:800;width:100%;margin-top:13px;text-align:right}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{border:1px solid #eeeafa;border-radius:18px;background:#fff;padding:19px 8px;color:#27243c;font-weight:700;font-size:12px}.quick span{display:block;font-size:27px;margin-bottom:5px}.section-title{font-size:16px;font-weight:800;margin:20px 0 12px}.purple{color:#7349e6}.progress{height:9px;border-radius:20px;background:#ece9fb;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#a677f8,#6d47e7)}.chip{border:0;border-radius:20px;background:#f0ecfc;color:#7458c0;padding:7px 12px;font-size:11px}.chip.active{background:#8052e7;color:#fff}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:7px}.course{display:flex;gap:12px;align-items:center;text-align:right;border:1px solid #f0edfb;border-radius:19px;background:white;padding:9px;margin:10px 0;width:100%;color:inherit}.thumb{width:100px;height:78px;flex:none;border-radius:13px;background:linear-gradient(140deg,#172f43,#426d83);color:white;display:flex;align-items:center;justify-content:center;font-size:37px;position:relative;overflow:hidden}.thumb em{position:absolute;bottom:5px;left:5px;font-size:10px;font-style:normal;background:#141628b5;padding:3px 6px;border-radius:5px}.course h3{font-size:13px;margin:0 0 5px}.course p{font-size:11px;color:#77738e;margin:4px 0}.price{color:#6b41d4;font-weight:800;font-size:12px}.cover{height:200px;border-radius:19px;background:linear-gradient(140deg,#172e3d,#3c6472);display:flex;align-items:center;justify-content:center;font-size:85px;color:white;margin-bottom:14px}.field{width:100%;border:1px solid #e9e4f5;border-radius:13px;padding:12px;margin:7px 0 13px;background:#fff}.field-label{font-size:12px;font-weight:700}.notice{padding:11px;border-radius:13px;background:#f0edfc;color:#6e638c;font-size:11px;line-height:1.9}.message{font-size:13px;line-height:2;padding:13px 15px;border-radius:18px;margin:7px 0;max-width:93%;overflow-wrap:anywhere}.message.user{background:#8053e7;color:white;margin-right:auto}.message.assistant{background:#efebff}.msg-wrap{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:10px}.msg-wrap.user-wrap{align-items:flex-end}.msg-actions{margin-top:5px}.copy-btn{border:0;border-radius:9px;padding:5px 9px;background:#eee9ff;color:#6540c5;font-size:11px}.composer{background:#fff;padding:10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;border-top:1px solid #eeeafa}.composer input#question{flex:1;min-width:0;border:1px solid #eee9f8;background:#faf9ff;border-radius:22px;padding:11px}.composer button{border:0;border-radius:50%;background:#8053e7;color:#fff;width:39px;height:39px;flex:none}.composer .tool-btn{background:#f0ebff;color:#7a51d8}.composer input[type=file]{display:none}.attachment-preview{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:11px}.attachment-preview button{border-radius:9px;width:auto;height:auto;padding:5px}.recording{background:#f44!important}.guest-welcome{text-align:center;margin:12px 0}.guest-welcome img{width:175px}.guest-welcome h1{font-size:22px}.guest-welcome p{font-size:12px;color:#817e99;line-height:2}.guest-welcome form{text-align:right;margin-top:20px}.guest-welcome label{font-size:12px;font-weight:700}.guest-welcome .btn{width:100%;margin-top:7px;padding:14px}.metric{display:flex;align-items:center;gap:10px}.metric .circle{width:85px;height:85px;flex:none;border:10px solid #8d62e9;border-left-color:#eee8fc;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:18px}.social{display:flex;gap:8px;align-items:center}.social .face{font-size:36px;border-radius:50%;background:#e9e4fc;width:55px;height:55px;text-align:center;line-height:55px}.explore-card{margin-bottom:14px;border:1px solid #ece9fa;background:#fff;border-radius:19px;overflow:hidden}.explore-cover{height:165px;background:linear-gradient(130deg,#244d68,#61469d);display:flex;align-items:center;justify-content:center;font-size:68px}.explore-card .info{padding:12px}.video-box{background:#182839;color:#fff;height:210px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:70px}.video-box small{font-size:12px;display:block;text-align:center}.tabline{display:flex;gap:8px;margin:12px 0}.tabline button{flex:1}.studio-head{background:linear-gradient(120deg,#efe9ff,#fff);border-radius:20px;padding:15px;margin-bottom:15px}.upload{border:2px dashed #bba7ed;background:#f8f5ff;border-radius:16px;padding:26px;text-align:center;color:#7c56d7;font-size:12px}.message .katex-display{direction:ltr;overflow-x:auto}.message pre{direction:ltr;overflow:auto}.message img{max-width:100%}@media(min-width:700px){body{padding:20px}.wrap{height:calc(100dvh - 40px);min-height:650px;border-radius:30px}}</style></head><body><div class="wrap"><header class="header"><div class="header-label" id="header-label">سلام! 👋</div><img class="brand-logo" src="/aimadrese-logo.png" alt="ای‌آی مدرسه"></header><main class="screen" id="screen"></main><div class="composer hidden" id="composer"><div id="attachment-preview" class="attachment-preview hidden"><span id="attachment-name"></span><button id="remove-attachment" type="button">حذف ×</button></div><input type="file" id="image-file" accept="image/jpeg,image/png,image/webp"><button id="pick-image" class="tool-btn" type="button">📷</button><button id="record-voice" class="tool-btn" type="button">🎙️</button><input id="question" placeholder="سؤالت رو بپرس..."><button id="send" class="send-btn">➤</button></div><nav class="nav hidden" id="nav"><button data-page="home"><span>⌂</span>خانه</button><button data-page="courses"><span>▣</span>دوره‌ها</button><button data-page="explore"><span>◈</span>اکسپلور</button><button data-page="assistant"><span>♧</span>دستیار</button><button data-page="profile"><span>♙</span>پروفایل</button></nav></div><script>
(()=>{const $=x=>document.querySelector(x),screen=$('#screen'),composer=$('#composer'),input=$('#question');
const defaultState={name:'دانش‌آموز',lastName:'',grade:'نهم',tasks:[false,false,false],messages:[],page:'home',following:[]};
const activeKey='aimadrese-demo-active-v2',profilesKey='aimadrese-demo-profiles-v2';let profiles={};try{profiles=JSON.parse(localStorage.getItem(profilesKey)||'{}')||{}}catch{};let activeId=localStorage.getItem(activeKey)||'',isRegistered=!!(activeId&&profiles[activeId]);let s=isRegistered?{...defaultState,...profiles[activeId]}:{...defaultState};const save=()=>{if(isRegistered&&activeId){profiles[activeId]={...s};localStorage.setItem(profilesKey,JSON.stringify(profiles))}};const profileId=(a,b,c,d)=>JSON.stringify([a.trim().toLocaleLowerCase('fa'),b.trim().toLocaleLowerCase('fa'),c,d.trim()]);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const grades=['اول','دوم','سوم','چهارم','پنجم','ششم','هفتم','هشتم','نهم','دهم','یازدهم','دوازدهم'];
const teachers=[{name:'استاد کریمی',subject:'ریاضی',emoji:'👨🏻‍🏫',followers:'۲۴ هزار'},{name:'استاد رهایی',subject:'علوم تجربی',emoji:'👩🏻‍🏫',followers:'۱۸ هزار'},{name:'استاد مرادی',subject:'فیزیک',emoji:'👨🏽‍🏫',followers:'۱۵ هزار'},{name:'استاد نادری',subject:'فارسی',emoji:'👩🏽‍🏫',followers:'۱۲ هزار'}];
const courses=[{title:'معادلات درجه یک',teacher:0,emoji:'📐',price:'۳۹۰٬۰۰۰',desc:'۶ جلسه · ۱۲۰ دقیقه'},{title:'ساختار و عملکرد DNA',teacher:1,emoji:'🧬',price:'۴۵۰٬۰۰۰',desc:'۴ جلسه · ۱۶۰ دقیقه'},{title:'نسبت‌های مثلثاتی',teacher:2,emoji:'📏',price:'۴۹۰٬۰۰۰',desc:'۳ جلسه · ۹۰ دقیقه'},{title:'آشنایی با قانون اهرم',teacher:2,emoji:'⚛️',price:'۲۹۰٬۰۰۰',desc:'۵ جلسه · ۷۵ دقیقه'}];
const courseRow=(c,i)=>`<button class="course" data-course="${i}"><div class="thumb">${c.emoji}<em>▶ پیش‌نمایش</em></div><div><h3>${c.title}</h3><p>${teachers[c.teacher].name}</p><p>${c.desc}</p><span class="price">${c.price} ریال</span></div></button>`;
function showSignup(){composer.classList.add('hidden');$('#nav').classList.add('hidden');$('#header-label').textContent='شروع یادگیری';screen.innerHTML=`<section class="guest-welcome"><img src="/aimadrese-logo.png" alt="لوگو"><h1>به ای‌آی مدرسه خوش اومدی! 💜</h1><p>با نام و پایه تحصیلی خودت وارد پنل شخصی شو.<br>این نسخه آزمایشی است و هر کدی پذیرفته می‌شود.</p><form id="guest-signup"><label>نام</label><input class="field" id="guest-first" required maxlength="40" placeholder="مثلاً علی"><label>نام خانوادگی</label><input class="field" id="guest-last" required maxlength="45" placeholder="مثلاً محمدی"><label>پایه تحصیلی</label><select class="field" id="guest-grade">${grades.map(g=>`<option ${g==='نهم'?'selected':''}>${g}</option>`).join('')}</select><label>کد ورود آزمایشی</label><input class="field" id="guest-code" required placeholder="هر کدی، مثلاً ۱۲۳۴"><button class="btn" type="submit">ورود به پنل شخصی ←</button></form><p class="notice">این پنل فقط روی همین مرورگر ذخیره می‌شود؛ حساب واقعی و پرداخت فعال نیست.</p></section>`}
function render(){if(!isRegistered){showSignup();return}save();$('#nav').classList.remove('hidden');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===s.page));composer.classList.toggle('hidden',s.page!=='assistant');$('#header-label').textContent=s.page==='home'?`سلام ${s.name}! 👋`:'ای‌آی مدرسه';
if(s.page==='home')screen.innerHTML=`<p class="muted" style="margin-top:0">پایه ${esc(s.grade)} · آماده‌ای امروز بهتر یاد بگیری؟</p><section class="hero"><div class="robot">🤖</div><h2>دستیار هوشمند تو</h2><p>هر سؤالی داری بپرس! من کمکت می‌کنم بهتر یاد بگیری.</p><button data-page="assistant">＋ سؤالت رو بپرس...</button></section><div class="quick"><button data-page="courses"><span>▶️</span>دوره‌های آموزشی</button><button data-page="teachers"><span>👥</span>جامعه معلم‌ها</button><button data-page="plan"><span>☑️</span>تمرین و آزمون</button><button data-page="plan"><span>🗓️</span>برنامه مطالعاتی</button></div><div class="section-title">تحلیل یادگیری تو <span class="purple">✦</span></div><div class="card metric"><div class="circle">${Math.round(s.tasks.filter(Boolean).length/3*100)}٪</div><div><h3>پیشرفت فعالیت‌های امروز</h3><p class="muted">${s.tasks.filter(Boolean).length} فعالیت از ۳ فعالیت انجام شده</p><div class="progress"><div style="width:${s.tasks.filter(Boolean).length/3*100}%"></div></div></div></div><div class="section-title">پیشنهادهای آموزشی</div>${courseRow(courses[0],0)}<p class="notice">پیشنهادهای هوشمند مبتنی بر ضعف درسی پس از اتصال تحلیل واقعی عملکرد فعال می‌شوند.</p>`;
if(s.page==='courses')screen.innerHTML=`<h2>دوره‌های آموزشی</h2><div class="chips"><button class="chip active">پیشنهادی برای تو</button><button class="chip" data-page="teachers">معلم‌ها</button><button class="chip" data-page="explore">اکسپلور</button></div><div class="hero" style="min-height:115px"><div class="robot">✨</div><h2>پیشنهاد هوشمند</h2><p>دوره‌های مناسب پایه ${esc(s.grade)} را ببین.</p></div><div class="section-title">دوره‌های منتخب</div>${courses.map(courseRow).join('')}<p class="notice">دوره‌ها، معلمان و قیمت‌ها در این نسخه نمونه نمایشی‌اند و فروش واقعی انجام نمی‌شود.</p>`;
if(s.page==='teachers')screen.innerHTML=`<h2>معلم‌های ای‌آی مدرسه</h2><p class="muted">معلم مورد علاقه‌ات رو دنبال کن و دوره‌هاش رو ببین.</p>${teachers.map((t,i)=>`<div class="card row"><div class="social"><div class="face">${t.emoji}</div><div><h3>${t.name}</h3><p class="muted">${t.subject} · ${t.followers} دنبال‌کننده</p></div></div><button class="chip" data-teacher="${i}">مشاهده</button></div>`).join('')}`;
if(s.page==='teacher'){const t=teachers[s.selectedTeacher||0],id=s.selectedTeacher||0;screen.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:80px">${t.emoji}</div><h2>${t.name} 🔹</h2><p class="muted">مدرس ${t.subject} · ${t.followers} دنبال‌کننده</p><button class="btn" data-follow="${id}">${(s.following||[]).includes(id)?'✓ دنبال می‌کنید':'＋ دنبال کردن'}</button></div><div class="chips"><button class="chip active">دوره‌ها</button><button class="chip" data-page="explore">ویدئوهای کوتاه</button></div>${courses.map((c,i)=>c.teacher===id?courseRow(c,i):'').join('')}<button class="chip" data-page="teachers">بازگشت به معلم‌ها</button>`}
if(s.page==='course-detail'){const id=s.selectedCourse||0,c=courses[id];screen.innerHTML=`<div class="cover">${c.emoji}</div><h2>${c.title}</h2><div class="row"><p class="muted">${c.desc}</p><span class="price">${c.price} ریال</span></div><button class="chip" data-teacher="${c.teacher}">${teachers[c.teacher].emoji} ${teachers[c.teacher].name} ←</button><div class="section-title">جلسات دوره</div>${['آشنایی با مفاهیم پایه','حل مثال‌های کاربردی','تمرین و جمع‌بندی'].map((x,i)=>`<div class="card row"><div><h3>جلسه ${i+1}: ${x}</h3><p class="muted">${i===0?'پیش‌نمایش نمایشی':'نیازمند خرید دوره'}</p></div><span>▶</span></div>`).join('')}<button class="btn" style="width:100%" data-buy="${id}">خرید دوره · ${c.price} ریال</button><p class="notice">این ویدئوها و قیمت‌ها نمونه طراحی هستند؛ پخش و خرید واقعی هنوز متصل نشده‌اند.</p>`}
if(s.page==='explore')screen.innerHTML=`<h2>اکسپلور ✨</h2><div class="chips"><button class="chip active">همه</button><button class="chip">ریاضی</button><button class="chip">علوم</button><button class="chip">فیزیک</button></div>${courses.map((c,i)=>`<div class="explore-card"><div class="explore-cover">${c.emoji}</div><div class="info"><h3>${c.title} رو در چند دقیقه یاد بگیر!</h3><div class="row"><p class="muted">${teachers[c.teacher].name} · ویدئوی آموزشی نمونه</p><button class="chip" data-course="${i}">مشاهده ←</button></div><span class="muted">♡ پسندیدن · ♧ ذخیره · ↗ اشتراک‌گذاری (نمایشی)</span></div></div>`).join('')}`;
if(s.page==='plan')screen.innerHTML=`<h2>برنامه مطالعه و تمرین ☑️</h2><p class="muted">کارهای امروزت رو انجام بده تا پیشرفتت ثبت بشه.</p>${['مرور درس — ۲۵ دقیقه','حل تمرین — ۳۰ دقیقه','مرور نکات — ۱۵ دقیقه'].map((x,i)=>`<div class="card"><label><input type="checkbox" data-task="${i}" ${s.tasks[i]?'checked':''}> ${x}</label></div>`).join('')}<div class="card"><h3>پیشرفت امروز</h3><div class="progress"><div style="width:${s.tasks.filter(Boolean).length/3*100}%"></div></div><p class="muted">${s.tasks.filter(Boolean).length} از ۳ فعالیت</p></div><button class="btn" data-ask="از من یک آزمون کوتاه متناسب با پایه تحصیلی‌ام بگیر">آزمون با دستیار هوشمند</button>`;
if(s.page==='assistant'){screen.innerHTML=s.messages.length?s.messages.map((m,i)=>`<div class="msg-wrap ${m.role==='user'?'user-wrap':''}"><div class="message ${m.role}">${m.role==='assistant'?formatAnswer(m.text):esc(m.text).replace(/\n/g,'<br>')}${m.mediaLabel?`<div>${esc(m.mediaLabel)}</div>`:''}</div>${m.role==='assistant'&&!m.pending?`<div class="msg-actions"><button class="copy-btn" data-copy="${i}">📋 کپی پاسخ</button></div>`:''}</div>`).join(''):`<div style="text-align:center;padding:48px 8px"><div style="font-size:85px">🤖</div><h2>سلام ${esc(s.name)} جان!</h2><p class="muted">سؤال درسی بپرس، عکس بفرست یا ویس ضبط کن.</p><div class="chips"><button class="chip" data-ask="معادله درجه دوم را ساده توضیح بده">ریاضی</button><button class="chip" data-ask="از من آزمون بگیر">آزمون</button><button class="chip" data-ask="برای امتحان برنامه بده">برنامه</button></div></div>`;screen.scrollTop=screen.scrollHeight}
if(s.page==='profile')screen.innerHTML=`<h2>پروفایل من 👤</h2><div class="card"><label class="field-label">نام</label><input class="field" id="name" maxlength="40" value="${esc(s.name)}"><label class="field-label">نام خانوادگی</label><input class="field" id="lastName" maxlength="45" value="${esc(s.lastName||'')}"><label class="field-label">پایه تحصیلی</label><select class="field" id="grade">${grades.map(g=>`<option ${g===s.grade?'selected':''}>${g}</option>`).join('')}</select><button class="btn" id="save-profile">ذخیره تغییرات</button></div><div class="card"><h3>برای معلم‌ها 👩🏻‍🏫</h3><p class="muted">طراحی پنل اختصاصی ساخت و انتشار دوره</p><button class="btn" id="teacher-mode">ورود به پنل نمایشی معلم</button></div><div class="notice">ورود با هر کد فقط برای تست است. داده‌ها در مرورگر نگهداری می‌شوند و حساب امن نیست.</div><p><button class="chip" id="logout-guest">خروج از پنل</button></p>`;
if(s.page==='teacher-studio')screen.innerHTML=`<h2>استودیوی معلم 🎬</h2><div class="studio-head"><h3>دوره آموزشی خودت رو منتشر کن</h3><p class="muted">نسخه نمایشی پنل تولیدکننده محتوا</p></div><label class="field-label">عنوان دوره</label><input class="field" placeholder="مثلاً معادلات درجه یک" maxlength="100"><label class="field-label">درس</label><select class="field"><option>ریاضی</option><option>علوم</option><option>فیزیک</option><option>فارسی</option></select><label class="field-label">پایه تحصیلی</label><select class="field">${grades.map(g=>`<option>${g}</option>`).join('')}</select><label class="field-label">قیمت دوره (ریال)</label><input class="field" type="number" min="0" placeholder="مثلاً ۳۹۰۰۰۰"><div class="upload">☁️<p>محل بارگذاری ویدئو و کاور دوره</p><small>اتصال ذخیره‌سازی هنوز فعال نیست</small></div><p><button class="btn" id="save-course" style="width:100%">مرحله بعدی</button></p><p class="notice">این صفحه فعلاً طراحی تعاملی است؛ انتشار، ویدئو و درآمد واقعی فعال نیست.</p>`;
}
// تبدیل Markdown و LaTeX به نمایش امن و خوانا
function formatAnswer(raw){
  const source=String(raw||'');
  if(!window.marked||!window.DOMPurify)return esc(source).replace(/\n/g,'<br>');
  const maths=[];
  const tokenized=source.replace(/\\\[([\s\S]*?)\\\]|\$\$([\s\S]*?)\$\$|\\\(([\s\S]*?)\\\)|(?<!\$)\$([^$\n]+)\$(?!\$)/g,(full,a,b,c,d)=>{
    const expression=a??b??c??d;
    const display=a!==undefined||b!==undefined;
    const token=`MATHPLACEHOLDER${maths.length}END`;
    try{maths.push(window.katex?window.katex.renderToString(expression,{throwOnError:false,displayMode:display,output:'html'}):esc(full))}
    catch{maths.push(esc(full))}
    return token;
  });
  let html=window.marked.parse(tokenized,{breaks:true,gfm:true});
  html=html.replace(/MATHPLACEHOLDER(\d+)END/g,(_,i)=>maths[Number(i)]||'');
  return window.DOMPurify.sanitize(html);
}
let attachment=null, recorder=null, recordParts=[],busy=false;
const preview=$('#attachment-preview'),attachmentName=$('#attachment-name');
function updateAttachment(){preview.classList.toggle('hidden',!attachment);attachmentName.textContent=attachment?(attachment.kind==='image'?'📷 عکس آماده ارسال':'🎙️ ویس آماده ارسال'):'';}
function fileAsBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)})}
$('#image-file').addEventListener('change',async e=>{
  const file=e.target.files?.[0];if(!file)return;
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){alert('فقط JPG، PNG یا WebP مجاز است.');return}
  if(file.size>4*1024*1024){alert('حجم عکس باید کمتر از ۴ مگابایت باشد.');return}
  attachment={kind:'image',mimeType:file.type,data:await fileAsBase64(file)};updateAttachment();e.target.value='';
});
$('#record-voice').addEventListener('click',async()=>{
  if(recorder&&recorder.state==='recording'){recorder.stop();return}
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){alert('ضبط صدا در این مرورگر پشتیبانی نمی‌شود.');return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(x=>MediaRecorder.isTypeSupported(x))||'';
    recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);recordParts=[];
    recorder.ondataavailable=e=>{if(e.data.size)recordParts.push(e.data)};
    recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());$('#record-voice').classList.remove('recording');$('#record-voice').textContent='🎙️';const blob=new Blob(recordParts,{type:recorder.mimeType||'audio/webm'});if(blob.size>6*1024*1024){alert('ویس طولانی است؛ کوتاه‌تر ضبط کن.');return}attachment={kind:'audio',mimeType:blob.type.split(';')[0],data:await fileAsBase64(blob)};updateAttachment()};
    recorder.start();$('#record-voice').classList.add('recording');$('#record-voice').textContent='⏹';
  }catch{alert('برای ضبط ویس، دسترسی میکروفون را در مرورگر فعال کن.')}
});
async function ask(q){
  if(busy)return;
  q=String(q??input.value).trim();if(!q&&!attachment)return;
  const media=attachment;attachment=null;updateAttachment();input.value='';
  const text=q||(media?.kind==='image'?'لطفاً سؤال داخل تصویر را بخوان و مرحله‌به‌مرحله توضیح بده.':'لطفاً به سؤال صوتی من به فارسی پاسخ بده.');
  s.page='assistant';s.messages.push({role:'user',text,mediaLabel:media?.kind==='image'?'📷 تصویر پیوست شده':media?.kind==='audio'?'🎙️ پیام صوتی پیوست شده':undefined});
  const history=s.messages.filter(m=>!m.pending).slice(-12).map(m=>({role:m.role,content:m.text}));
  const pendingIndex=s.messages.length;s.messages.push({role:'assistant',text:'در حال بررسی سؤال…',pending:true});busy=true;$('#send').disabled=true;render();
  try{
    const response=await fetch('https://aimadrese-gemini.sepehrkhodadadi84.workers.dev/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,grade:s.grade,attachment:media})});
    const data=await response.json();if(!response.ok)throw new Error(data.error||'خطا در ارتباط با دستیار');
    s.messages[pendingIndex].text=data.reply||'پاسخی دریافت نشد.';
  }catch(err){s.messages[pendingIndex].text='⚠️ '+(err.message||'ارتباط برقرار نشد');}
  s.messages[pendingIndex].pending=false;busy=false;$('#send').disabled=false;render();
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){s.page=b.dataset.page;render()}else if(b.dataset.ask)ask(b.dataset.ask);else if(b.id==='send')ask();else if(b.id==='pick-image')$('#image-file').click();else if(b.id==='remove-attachment'){attachment=null;updateAttachment()}else if(b.dataset.copy!==undefined){const msg=s.messages[Number(b.dataset.copy)];if(msg){navigator.clipboard.writeText(msg.text).then(()=>{b.textContent='✓ کپی شد';setTimeout(()=>b.textContent='📋 کپی پاسخ',1500)}).catch(()=>alert('کپی در این مرورگر امکان‌پذیر نیست.'))}}else if(b.dataset.course){s.selectedCourse=Number(b.dataset.course);s.page='course-detail';render()}else if(b.dataset.teacher){s.selectedTeacher=Number(b.dataset.teacher);s.page='teacher';render()}else if(b.dataset.follow!==undefined){s.following=s.following||[];const id=Number(b.dataset.follow);s.following=s.following.includes(id)?s.following.filter(x=>x!==id):[...s.following,id];render()}else if(b.dataset.buy!==undefined){alert('خرید ریالی در نسخه آزمایشی فعال نیست. این بخش پس از اتصال پرداخت و ویدئو راه‌اندازی می‌شود.')}else if(b.id==='teacher-mode'){s.page='teacher-studio';render()}else if(b.id==='save-course'){alert('فرم دوره آماده است؛ بارگذاری واقعی و قیمت‌گذاری پس از اتصال فضای ذخیره‌سازی و حساب معلم فعال می‌شود.')}else if(b.id==='save-profile'){s.name=$('#name').value.trim()||'دانش‌آموز';s.lastName=$('#lastName').value.trim();s.grade=$('#grade').value;save();render()}else if(b.id==='logout-guest'){if(confirm('از پنل خارج شوی؟ اطلاعات این پنل در همین مرورگر باقی می‌ماند.')){save();localStorage.removeItem(activeKey);activeId='';isRegistered=false;s={...defaultState};render()}}else if(b.id==='reset'){if(confirm('فقط اطلاعات همین پنل از این مرورگر پاک شود؟')){delete profiles[activeId];localStorage.setItem(profilesKey,JSON.stringify(profiles));localStorage.removeItem(activeKey);activeId='';isRegistered=false;s={...defaultState};render()}}});
document.addEventListener('submit',e=>{if(e.target.id!=='guest-signup')return;e.preventDefault();const name=$('#guest-first').value.trim(),lastName=$('#guest-last').value.trim(),grade=$('#guest-grade').value,code=$('#guest-code').value.trim();if(!name||!lastName||!grade||!code)return;activeId=profileId(name,lastName,grade,code);s=profiles[activeId]?{...defaultState,...profiles[activeId]}:{...defaultState,name,lastName,grade,tasks:[false,false,false],messages:[],page:'home'};s.page='home';isRegistered=true;localStorage.setItem(activeKey,activeId);render()});
document.addEventListener('change',e=>{if(e.target.dataset.task!==undefined){s.tasks[+e.target.dataset.task]=e.target.checked;render()}});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&isRegistered)ask()});render()})();
</script></body></html>
