// تبدیل Markdown و LaTeX به نمایش امن و خوانا
function formatAnswer(raw){
  const source=String(raw||'');
  if(!window.marked||!window.DOMPurify)return esc(source).replace(/\n/g,'<br>');
  const maths=[];
  const tokenized=source.replace(/\\\[([\s\S]*?)\\\]|\$\$([\s\S]*?)\$\$|\\\(([\s\S]*?)\\\)|(?<!\$)\$([^$\n]+)\$(?!\$)/g,(full,a,b,c,d)=>{
    const expression=a??b??c??d;
    const display=a!==undefined||b!==undefined;
    const token=`MATHPLACEHOLDER${maths.length}END`;
    try{maths.push(window.katex?window.katex.renderToString(expression,{throwOnError:false,displayMode:display,output:'html'}):esc(full))}
    catch{maths.push(esc(full))}
    return token;
  });
  let html=window.marked.parse(tokenized,{breaks:true,gfm:true});
  html=html.replace(/MATHPLACEHOLDER(\d+)END/g,(_,i)=>maths[Number(i)]||'');
  return window.DOMPurify.sanitize(html);
}

function messagesMarkup(){const people=appUsers.filter(p=>appMsgFilter==='all'||p.role===appMsgFilter);const threads=v12Inbox.filter(t=>appMsgFilter==='all'||t.role===appMsgFilter);return `<div class="msg-hero"><div><h2>پیام‌ها 💬</h2><p class="muted">گفت‌وگوهای آموزشی شما</p></div><span class="bubble-art">✉️</span></div><div class="msg-filters"><button type="button" data-msg-filter="all" class="${appMsgFilter==='all'?'active':''}">همه</button><button type="button" data-msg-filter="teacher" class="${appMsgFilter==='teacher'?'active':''}">معلم‌ها</button><button type="button" data-msg-filter="student" class="${appMsgFilter==='student'?'active':''}">دانش‌آموزها</button></div><div class="v12-search-row"><input class="msg-search" id="msg-search" placeholder="🔎 جست‌وجوی نام کاربر یا پیام..."><button type="button" class="v12-filter-btn" title="بارگذاری مجدد" data-refresh-inbox="1">↻</button></div><div class="v12-section"><h3>گفت‌وگوهای شما</h3><small>پیام‌های جدید در بالا</small></div><div id="msg-list">${threads.length?threads.map(v12Card).join(''):'<div class="v12-empty">هنوز پیامی ندارید؛ از فهرست کاربران گفت‌وگو را شروع کنید.</div>'}</div><div class="v12-section v12-recent"><h3>👥 کاربران ای‌آی مدرسه</h3><small>شروع گفت‌وگوی جدید</small></div><div id="msg-directory-results">${messagePeopleMarkup(people)}</div>`}

function chatMarkup(){
 const thread=appThreads.find(t=>t.id===appChatId);
 const other=thread?(thread.student_id===authSession.user.id?thread.teacher:thread.student):null;
 const name=appEsc(other?.display_name||'گفت‌وگوی خصوصی');
 const avatar=other?.avatar_url?`<img src="${appEsc(other.avatar_url)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:`<span>${other?.role==='teacher'?'👨🏻‍🏫':'🎓'}</span>`;
 const messages=appMessages.map((m,i)=>{
  const mine=m.sender_id===authSession.user.id,media=appChatMedia.get(m.id),kind=m.attachment_type||'';
  const stamp=new Date(m.created_at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});

   if(!media)attachment='<div class="v8-loading-file">در حال دریافت پیوست…</div>';

   else if(kind.startsWith('audio/'))attachment=voiceCardMarkup(media,m.id);
   else attachment=`<a class="v8-file-link" href="${appEsc(media)}" target="_blank" rel="noopener noreferrer">📎 ${appEsc(m.attachment_name||'دریافت فایل')}</a>`;
  }
  const text=m.deleted_at?'<div class="v8-bubble-text v14-deleted">این پیام حذف شده است.</div>':m.body&&m.body.trim()?`<div class="v8-bubble-text">${appEsc(m.body).replace(/\n/g,'<br>')}</div>`:'';

  return `<div class="v8-message ${mine?'v8-out':'v8-in'}"><div class="v14-msg-row"><div class="v8-message-content">${text}${attachment}<div class="v8-message-meta"><time>${stamp}</time>${m.edited_at&&!m.deleted_at?'<span class="v14-edited">ویرایش‌شده</span>':''}${m.pinned_at&&!m.deleted_at?' <span title="پین شده">📌</span>':''}${mine?'<span aria-label="ارسال شده">✓✓</span>':''}</div></div>${menu}</div></div>`;
 }).join('');
 return `<section class="chat-panel v8-chat" aria-label="گفت‌وگوی خصوصی">

 ${appMessages.filter(m=>m.pinned_at&&!m.deleted_at).slice(-1).map(m=>`<div class="v14-pin-banner">📌 <span>${appEsc(m.body?.trim()||m.attachment_name||'پیوست پین‌شده')}</span><button type="button" data-v14-action="unpin" data-v14-id="${appEsc(m.id)}">برداشتن پین</button></div>`).join('')}
 <div id="v12-typing-chat" class="v12-typing-chat" aria-live="polite"></div><div class="chat-feed v8-feed" id="chat-feed"><div class="v8-day-divider"><span>گفت‌وگوی شما</span></div>${messages||'<div class="v8-empty-chat"><span>💬</span><strong>گفت‌وگو را شروع کنید</strong><p>اولین پیام آموزشی‌تان را ارسال کنید.</p></div>'}</div>
 <div id="chat-file-preview" class="chat-attach-preview v8-preview" style="display:${appPendingFile?'flex':'none'}"><span>${appPendingFile?appEsc(appPendingFile.name):''}</span><button type="button" class="chip" data-remove-attachment="1">حذف ×</button></div>
 <form id="app-chat-form" class="chat-compose v8-compose"><input id="chat-media-file" type="file" accept="image/jpeg,image/png,image/webp,audio/webm,audio/mp4,audio/mpeg,audio/ogg,audio/wav" aria-label="انتخاب عکس یا صوت"><button class="chat-tool v8-voice" type="button" data-record-voice="1" title="شروع یا پایان ضبط ویس" aria-label="ضبط ویس">🎙</button><button class="chat-tool v8-media" type="button" data-pick-attachment="1" title="انتخاب عکس یا فایل صوتی" aria-label="انتخاب عکس یا فایل صوتی">▧</button><input name="body" maxlength="2000" placeholder="پیام خود را بنویسید…" autocomplete="off" aria-label="متن پیام"><button class="chat-send v8-send" type="submit" ${appUploading?'disabled':''} aria-label="ارسال پیام">➤</button></form>
 <p class="chat-status v8-hint">عکس تا ۵ مگابایت · ویس تا ۱۰ مگابایت · فقط اعضای گفت‌وگو</p></section>`;
}

async function v12FetchInbox(){if(!authSession||!appProfile||v12InboxBusy)return;v12InboxBusy=true;try{const a=await ensureSession();if(!a)return;const result=await sbRequest('/rest/v1/rpc/aimadrese_inbox_v12',{method:'POST',token:a.access_token,body:'{}'});v12Inbox=Array.isArray(result)?result:[];appUnread=v12Inbox.reduce((n,t)=>n+(Number(t.unread_count)||0),0);updateMessageBadge();if(s.page==='messages')v12UpdateInboxDom()}catch(e){console.warn('Inbox:',e.message)}finally{v12InboxBusy=false}}
function v12UpdateInboxDom(){const search=document.getElementById('msg-search');const term=(search?.value||'').trim().toLocaleLowerCase('fa');const threads=v12Inbox.filter(t=>(appMsgFilter==='all'||t.role===appMsgFilter)&&[t.display_name,t.last_body,t.subject,t.grade].join(' ').toLocaleLowerCase('fa').includes(term));const el=document.getElementById('msg-list');if(el)el.innerHTML=threads.length?threads.map(v12Card).join(''):'<div class="v12-empty">گفت‌وگویی پیدا نشد.</div>'}
async function v12SetupRealtime(){if(!authSession||!appProfile||!window.supabase?.createClient)return;const a=await ensureSession();if(!a)return;try{if(v12Client)await v12Client.removeAllChannels();v12Client=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false},realtime:{params:{eventsPerSecond:10}}});v12Client.realtime.setAuth(a.access_token);v12UserChannel=v12Client.channel('aimadrese-user-'+a.user.id,{config:{private:true}}).on('broadcast',{event:'inbox-update'},()=>{v12FetchInbox();if(s.page==='chat')fetchMessages().catch(console.warn)}).subscribe();v12Client.channel('aimadrese-inbox-db-'+a.user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'app_messages'},()=>{v12FetchInbox();if(s.page==='chat')fetchMessages().catch(console.warn)}).subscribe();v12AttachTyping()}catch(e){console.warn('Realtime:',e.message)}}
function v12AttachTyping(){if(!v12Client)return;if(v12ChatChannel){v12Client.removeChannel(v12ChatChannel);v12ChatChannel=null}if(!appChatId)return;const id=appChatId;v12ChatChannel=v12Client.channel('aimadrese-typing-'+id,{config:{private:true}}).on('broadcast',{event:'typing'},({payload})=>{if(!payload||payload.sender===authSession?.user?.id)return;v12Typing[payload.sender]=payload.active?Date.now()+3200:0;if(s.page==='messages')v12UpdateInboxDom();if(s.page==='chat'){const el=document.getElementById('v12-typing-chat');if(el)el.innerHTML=payload.active?'در حال نوشتن... <span class="v12-typing-dots"><i></i><i></i><i></i></span>':''}}).subscribe()}

function v12StartTimers(){if(v12RefreshTimer)clearInterval(v12RefreshTimer);v12RefreshTimer=setInterval(()=>{if(!document.hidden&&authSession){v12FetchInbox();if(s.page==='chat')fetchMessages().catch(console.warn)}},5000);v12FetchInbox();v12SetupRealtime()}
async function fetchUsers(){const a=await ensureSession();appUsers=[];for(let offset=0;offset<10000;offset+=500){const batch=await sbRequest('/rest/v1/app_profiles?select=id,display_name,role,subject,grade,avatar_url,last_seen_at&order=created_at.desc&limit=500&offset='+offset,{token:a.access_token})||[];appUsers.push(...batch);if(batch.length<500)break}appUsers=appUsers.filter(x=>x.id!==a.user.id)}

async function fetchMessages(){if(!appChatId)return;const a=await ensureSession();if(!a)return;const data=await sbRequest('/rest/v1/app_messages?select=id,conversation_id,sender_id,body,created_at,attachment_path,attachment_type,attachment_name,edited_at,deleted_at,pinned_at,pinned_by&conversation_id=eq.'+encodeURIComponent(appChatId)+'&order=created_at.asc&limit=200',{token:a.access_token});const previous=JSON.stringify(appMessages.map(m=>[m.id,m.body,m.attachment_path,m.edited_at,m.deleted_at,m.pinned_at]));appMessages=data||[];const changed=previous!==JSON.stringify(appMessages.map(m=>[m.id,m.body,m.attachment_path,m.edited_at,m.deleted_at,m.pinned_at]));if(s.page==='chat'&&changed){const oldFeed=document.getElementById('chat-feed');const nearBottom=!oldFeed||oldFeed.scrollHeight-oldFeed.scrollTop-oldFeed.clientHeight<100;const typed=document.querySelector('#app-chat-form input[name=body]')?.value||'';appRender();const newInput=document.querySelector('#app-chat-form input[name=body]');if(newInput)newInput.value=typed;const feed=document.getElementById('chat-feed');if(feed&&nearBottom)feed.scrollTop=feed.scrollHeight}await resolveChatMedia();if(s.page==='chat')markChatRead().catch(console.warn)}
async function resolveChatMedia(){const a=await ensureSession();if(!a)return;const pending=appMessages.filter(m=>m.attachment_path&&!m.deleted_at&&!appChatMedia.has(m.id));if(!pending.length)return;for(const m of pending){try{const r=await sbRequest('/storage/v1/object/sign/aimadrese-chat/'+m.attachment_path,{method:'POST',token:a.access_token,body:JSON.stringify({expiresIn:3600})});const signed=r.signedURL||r.signedUrl;if(signed)appChatMedia.set(m.id,SB_URL+(signed.startsWith('/storage/v1/')?signed:'/storage/v1'+(signed.startsWith('/')?signed:'/'+signed)))}catch(err){console.warn('پیوست:',err.message)}}if(s.page==='chat'&&pending.some(m=>appChatMedia.has(m.id))){const feed=document.getElementById('chat-feed');const nearBottom=!feed||feed.scrollHeight-feed.scrollTop-feed.clientHeight<100;const typed=document.querySelector('#app-chat-form input[name=body]')?.value||'';appRender();const input=document.querySelector('#app-chat-form input[name=body]');if(input)input.value=typed;const next=document.getElementById('chat-feed');if(next&&nearBottom)next.scrollTop=next.scrollHeight}}
function validateChatFile(file){if(!file)return;const allowed=['image/jpeg','image/png','image/webp','audio/webm','audio/mp4','audio/mpeg','audio/ogg','audio/wav'];if(!allowed.includes(file.type))throw new Error('فقط عکس JPG/PNG/WebP و فایل صوتی مجاز است.');const max=file.type.startsWith('image/')?5:10;if(file.size>max*1024*1024)throw new Error('حجم فایل نباید بیشتر از '+max+' مگابایت باشد.')}
async function sendChatMessage(body,file){if(!appChatId||(!body&&!file)||appUploading)return;appUploading=true;const a=await ensureSession();try{const data={conversation_id:appChatId,sender_id:a.user.id,body:body||' '};if(file){validateChatFile(file);const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','audio/webm':'webm','audio/mp4':'m4a','audio/mpeg':'mp3','audio/ogg':'ogg','audio/wav':'wav'}[file.type];const path=appChatId+'/'+a.user.id+'/'+crypto.randomUUID()+'.'+ext;const res=await fetch(SB_URL+'/storage/v1/object/aimadrese-chat/'+path,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+a.access_token,'Content-Type':file.type,'x-upsert':'false'},body:file});if(!res.ok){const error=await res.text();throw new Error('آپلود ناموفق بود: '+error.slice(0,200))}data.attachment_path=path;data.attachment_type=file.type;data.attachment_name=file.name.slice(0,150)}await sbRequest('/rest/v1/app_messages',{method:'POST',token:a.access_token,headers:{Prefer:'return=minimal'},body:JSON.stringify(data)});appPendingFile=null;await fetchMessages();await v12FetchInbox();appRender();const feed=document.getElementById('chat-feed');if(feed)feed.scrollTop=feed.scrollHeight}catch(e){alert('خطا در ارسال: '+e.message)}finally{appUploading=false}}
async function toggleVoiceRecord(btn){if(appRecorder&&appRecorder.state==='recording'){appRecorder.stop();btn.classList.remove('chat-recording');btn.textContent='🎙';return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){alert('مرورگر شما ضبط ویس را پشتیبانی نمی‌کند.');return}try{appRecordingStream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(x=>MediaRecorder.isTypeSupported(x));appRecorder=new MediaRecorder(appRecordingStream,mime?{mimeType:mime}:undefined);appAudioChunks=[];appRecorder.ondataavailable=e=>{if(e.data.size)appAudioChunks.push(e.data)};appRecorder.onstop=()=>{const type=appRecorder.mimeType.split(';')[0]||'audio/webm';const blob=new Blob(appAudioChunks,{type});appRecordingStream?.getTracks().forEach(t=>t.stop());appRecordingStream=null;const file=new File([blob],'voice-'+Date.now()+(type==='audio/mp4'?'.m4a':'.webm'),{type});try{validateChatFile(file);appPendingFile=file;const preview=document.getElementById('chat-file-preview');if(preview){preview.style.display='flex';preview.querySelector('span').textContent='🎙 '+file.name}}catch(e){alert(e.message)}};appRecorder.start();btn.classList.add('chat-recording');btn.textContent='■'}catch(e){alert('اجازه دسترسی به میکروفون داده نشد: '+e.message)}}

function socPostTile(p){const media=socPhoto(p),isVideo=p.media_type==='video';return `<button class="soc-ig-tile" data-soc-open="${socSafe(p.id)}" aria-label="${socSafe(p.caption||'محتوای آموزشی')}">${media&&!isVideo?`<img loading="lazy" src="${socSafe(media)}" alt="">`:`<span class="soc-ig-noimage">${socSafe((p.caption||p.subject||'آموزش').slice(0,55))}</span>`}<span class="soc-ig-kind">${isVideo?'▶':'▣'}</span><span class="soc-ig-subject">${socSafe(p.subject||'آموزشی')}</span></button>`}
function socFiltered(){return socPosts.filter(p=>(socTag==='همه'||socTag==='ریلز'&&p.media_type==='video'||socTag==='پست‌ها'&&p.media_type!=='video'||p.subject===socTag)&&(!socQuery||[p.caption,p.subject,socUser(p.user_id).display_name].join(' ').toLowerCase().includes(socQuery.toLowerCase())))}
function socFeed(){const list=socFiltered();return `<section class="soc-ig"><header class="soc-ig-top"><h2>اکسپلور ✨</h2><div class="soc-ig-actions"><button data-soc-go="profile" data-soc-id="${socMe()}">پروفایل من</button><button data-soc-go="create" aria-label="انتشار محتوا">＋</button></div></header><div class="soc-ig-search"><input id="soc-search" type="search" placeholder="جست‌وجوی پست، درس یا نام معلم..." value="${socSafe(socQuery)}"></div><div class="soc-ig-filters">${['همه','ریلز','پست‌ها','ریاضی','فیزیک','علوم','زبان','فارسی'].map(t=>`<button class="${socTag===t?'on':''}" data-soc-tag="${t}">${t}</button>`).join('')}<button data-page="courses">📚 دوره‌ها</button><button data-page="teacher-directory">👨‍🏫 معلم‌ها</button></div>${socError?`<div class="notice">${socSafe(socError)}</div>`:''}<div class="soc-ig-grid soc-grid">${list.map(socPostTile).join('')}</div>${!list.length?'<div class="soc-ig-empty"><strong>هنوز محتوایی برای نمایش نیست</strong>با انتشار اولین پست یا ریلز آموزشی، اینجا مثل اکسپلور پر می‌شود.<br><button data-soc-go="create">＋ انتشار محتوا</button></div>':''}</section>`}
function socReels(id){const videos=socPosts.filter(p=>p.media_type==='video'&&socPhoto(p));if(!videos.length)return `<div class="soc">${socHeader('ریلز')}<p class="notice">هنوز ریلزی منتشر نشده است.</p></div>`;const selected=Math.max(0,videos.findIndex(p=>p.id===id));const ordered=[...videos.slice(selected),...videos.slice(0,selected)];return `<div class="soc-reels" id="soc-reels"><button class="soc-reel-back" data-soc-go="feed">بازگشت ✕</button>${ordered.map(p=>`<article class="soc-reel"><video src="${socSafe(socPhoto(p))}" playsinline loop controls preload="metadata"></video><div class="soc-reel-overlay"><strong>${socSafe(socUser(p.user_id).display_name)}</strong><p>${socSafe(p.caption||p.subject||'ریلز آموزشی')}</p></div><div class="soc-reel-actions"><button data-soc-go="post" data-soc-id="${socSafe(p.id)}" aria-label="کامنت و لایک">♡</button><button data-soc-go="profile" data-soc-id="${socSafe(p.user_id)}" aria-label="پروفایل">♙</button></div></article>`).join('')}</div>`}
function socProfile(id){const owner=socUser(id||socMe()),own=owner.id===socMe(),posts=socPosts.filter(p=>p.user_id===owner.id),followers=socProfiles.length?null:null;return `<div class="soc">${socHeader(own?'پروفایل اجتماعی من':'پروفایل کاربر')}<div class="soc-card"><div class="soc-profile-head">${socAvatar(owner)}<div><h3>${socSafe(owner.display_name||'کاربر')}</h3><div class="soc-muted">${owner.role==='teacher'?'معلم':'دانش‌آموز'} · ${socSafe(owner.subject||owner.grade||'ای‌آی مدرسه')}</div></div></div><p>${socSafe(owner.bio||'به ای‌آی مدرسه خوش آمدید!')}</p><div class="soc-line"><b>${posts.length} پست</b><span class="soc-muted">${own?'پروفایل خودت': 'پروفایل عمومی'}</span></div><div class="soc-actions">${own?`<button data-soc-go="create">＋ انتشار محتوا</button>`:`<button class="soc-primary" data-soc-follow="${owner.id}">${socFollowing.includes(owner.id)?'دنبال می‌کنید ✓':'دنبال کردن ＋'}</button><button data-soc-message="${owner.id}">پیام خصوصی</button>`}</div></div><h3>پست‌ها و ریلزها</h3><div class="soc-grid">${posts.map(socPostTile).join('')}</div>${!posts.length?'<div class="soc-empty">هنوز پستی منتشر نشده است.</div>':''}</div>`}
function socDetail(p){if(!p)return `<div class="soc">${socHeader('محتوا')}<p>پست پیدا نشد.</p></div>`;const user=socUser(p.user_id),media=socPhoto(p),own=p.user_id===socMe();return `<div class="soc">${socHeader(p.media_type==='video'?'ریلز آموزشی':'پست آموزشی')}<div class="soc-card"><div class="soc-line"><button class="soc-icon" data-soc-go="profile" data-soc-id="${p.user_id}">${socSafe(user.display_name)}</button><span class="soc-muted">${socDate(p.created_at)}</span></div>${media?(p.media_type==='video'?`<video class="soc-video" src="${socSafe(media)}" controls playsinline preload="metadata"></video>`:`<img class="soc-photo" src="${socSafe(media)}" alt="تصویر پست">`):''}<p>${socSafe(p.caption)}</p><span class="soc-muted">${socSafe(p.subject||'آموزشی')}</span><div class="soc-actions"><button data-soc-like="${p.id}">♡ پسندیدن</button><button data-soc-save="${p.id}">▢ ذخیره</button><button data-soc-share="${p.id}">↗ اشتراک‌گذاری</button><button data-soc-report="${p.id}">گزارش</button>${own?`<button data-soc-delete="${p.id}">حذف پست</button>`:''}</div><h3>نظرات</h3>${socComments.map(c=>`<div class="soc-comment"><b>${socSafe(socUser(c.user_id).display_name)}:</b> ${socSafe(c.body)}</div>`).join('')}<form id="soc-comment-form" data-post="${p.id}"><input class="soc-input" name="body" maxlength="500" required placeholder="نظر آموزشی خود را بنویسید"><button class="btn" type="submit">ارسال نظر</button></form></div></div>`}
function socCreate(){return `<div class="soc">${socHeader('ایجاد محتوا')}<div class="soc-card"><h3>محتوای آموزشی جدید</h3><form id="soc-create-form"><label>نوع محتوا</label><select class="soc-input" name="kind"><option value="post" ${socDraftType==='post'?'selected':''}>پست (عکس یا ویدئو)</option><option value="reel" ${socDraftType==='reel'?'selected':''}>ریلز (ویدئو)</option><option value="story" ${socDraftType==='story'?'selected':''}>استوری (۲۴ ساعت)</option></select><label>درس / موضوع</label><select class="soc-input" name="subject">${['ریاضی','علوم','فیزیک','زبان','فارسی','مشاوره','سایر'].map(t=>`<option>${t}</option>`).join('')}</select><label>عکس یا ویدئو</label><input class="soc-input" type="file" name="media" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" required><label>توضیحات</label><textarea class="soc-input" name="caption" maxlength="1200" rows="4" placeholder="این محتوا درباره چیه؟"></textarea><p class="soc-muted">عکس حداکثر ۵ مگابایت؛ ویدئو حداکثر ۳۰ مگابایت. محتوای عمومی را بدون اطلاعات خصوصی منتشر کنید.</p><button class="btn" ${socBusy?'disabled':''} type="submit">${socBusy?'در حال انتشار...':'انتشار محتوا'}</button></form></div></div>`}
function socStory(id){const st=socStories.find(x=>x.id===id);if(!st)return socHeader('داستان منقضی شده');const url=socPhoto(st);return `<div class="soc">${socHeader('استوری')}<div class="soc-line"><button class="soc-icon" data-soc-go="profile" data-soc-id="${st.user_id}">${socSafe(socUser(st.user_id).display_name)}</button><small>تا ۲۴ ساعت</small></div><div class="soc-storyview">${st.media_type==='video'?`<video src="${socSafe(url)}" controls autoplay playsinline></video>`:`<img src="${socSafe(url)}" alt="استوری">`}</div><p>${socSafe(st.caption||'')}</p></div>`}
function socialMarkup(){if(socView==='feed')return socFeed();if(socView==='reel')return socReels(socCurrent);if(socView==='profile')return socProfile(socCurrent);if(socView==='create')return socCreate();if(socView==='story')return socStory(socCurrent);return socDetail(socPosts.find(p=>p.id===socCurrent))}
async function socMutate(path,method,body){const a=await ensureSession();return sbRequest('/rest/v1/'+path,{method,token:a.access_token,headers:{Prefer:'return=minimal'},body:body?JSON.stringify(body):undefined})}
async function socUpload(file){const a=await ensureSession();if(!file)throw Error('فایل را انتخاب کنید');const type=file.type,video=type.startsWith('video/'),allowed=['image/jpeg','image/png','image/webp','video/mp4','video/webm'];if(!allowed.includes(type))throw Error('فرمت فایل مجاز نیست');if(file.size>(video?30:5)*1024*1024)throw Error('حجم فایل بیش از حد مجاز است');const ext=type.split('/')[1]==='jpeg'?'jpg':type.split('/')[1];const path=socMe()+'/'+crypto.randomUUID()+'.'+ext;const r=await fetch(SB_URL+'/storage/v1/object/aimadrese-social/'+path,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+a.access_token,'Content-Type':type,'x-upsert':'false'},body:file});if(!r.ok)throw Error('آپلود فایل انجام نشد: '+(await r.text()).slice(0,180));return {path,media_type:video?'video':'image'}}
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-soc-go],button[data-soc-open],button[data-soc-tag],button[data-soc-follow],button[data-soc-like],button[data-soc-save],button[data-soc-share],button[data-soc-delete],button[data-soc-report],button[data-soc-message]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();try{if(b.dataset.socType)socDraftType=b.dataset.socType;if(b.dataset.socTag){socTag=b.dataset.socTag;appRender();return}if(b.dataset.socOpen){const chosen=socPosts.find(p=>p.id===b.dataset.socOpen);socGo(chosen?.media_type==='video'?'reel':'post',b.dataset.socOpen);return}if(b.dataset.socGo){socGo(b.dataset.socGo,b.dataset.socId);return}if(b.dataset.socMessage){s.page='messages';appRender();alert('از فهرست کاربران در بخش پیام‌ها مخاطب را انتخاب کنید.');return}if(b.dataset.socShare){const url=location.href.split('#')[0]+'#social-'+b.dataset.socShare;await navigator.clipboard.writeText(url);alert('لینک کپی شد');return}if(b.dataset.socReport){const reason=prompt('دلیل گزارش محتوا را بنویسید');if(reason?.trim()){await socMutate('social_reports','POST',{post_id:b.dataset.socReport,reporter_id:socMe(),reason:reason.slice(0,500)});alert('گزارش ثبت شد')}return}if(b.dataset.socDelete){if(!confirm('این پست حذف شود؟'))return;await socMutate('social_posts?id=eq.'+b.dataset.socDelete,'DELETE');socGo('feed');return}if(b.dataset.socFollow){const id=b.dataset.socFollow;if(socFollowing.includes(id))await socMutate('social_follows?follower_id=eq.'+socMe()+'&following_id=eq.'+id,'DELETE');else await socMutate('social_follows','POST',{follower_id:socMe(),following_id:id});await socFetch();return}if(b.dataset.socLike||b.dataset.socSave){const id=b.dataset.socLike||b.dataset.socSave,table=b.dataset.socLike?'social_likes':'social_saves';const a=await ensureSession();const exists=await sbRequest('/rest/v1/'+table+'?post_id=eq.'+id+'&user_id=eq.'+socMe()+'&select=post_id',{token:a.access_token});if(exists.length)await socMutate(table+'?post_id=eq.'+id+'&user_id=eq.'+socMe(),'DELETE');else await socMutate(table,'POST',{post_id:id,user_id:socMe()});b.textContent=exists.length?'♡ پسندیدن':'✓ ثبت شد';return}}catch(err){alert('خطا: '+err.message)}},true);
document.addEventListener('input',e=>{if(e.target.id==='soc-search'){socQuery=e.target.value;const grid=document.querySelector('.soc-grid');if(grid){grid.innerHTML=socFiltered().map(socPostTile).join('')}}},true);
document.addEventListener('submit',async e=>{if(!['soc-create-form','soc-comment-form'].includes(e.target.id))return;e.preventDefault();e.stopImmediatePropagation();const form=e.target;try{if(form.id==='soc-comment-form'){const body=form.elements.body.value.trim();if(!body)return;await socMutate('social_comments','POST',{post_id:form.dataset.post,user_id:socMe(),body});form.reset();await socFetchComments(form.dataset.post);return}if(socBusy)return;socBusy=true;const kind=form.elements.kind.value,file=form.elements.media.files[0],caption=form.elements.caption.value.trim(),subject=form.elements.subject.value;const uploaded=await socUpload(file);if(kind==='reel'&&uploaded.media_type!=='video')throw Error('ریلز باید ویدئو باشد');if(kind==='story')await socMutate('social_stories','POST',{user_id:socMe(),caption,media_path:uploaded.path,media_type:uploaded.media_type});else await socMutate('social_posts','POST',{user_id:socMe(),caption,subject,media_path:uploaded.path,media_type:uploaded.media_type,kind});socView='feed';await socFetch();alert('محتوا منتشر شد')}catch(err){alert('خطا در انتشار: '+err.message)}finally{socBusy=false}},true);
// Refresh social feed on first opening and on later visits, without changing the teacher dashboard.
// V20.2: immediate navigation with an independent first paint.
let socFetchInFlight=false;
function socSafeRender(){
 try{appRender();}
 catch(err){
  console.error('Explore render failed',err);
  const target=document.getElementById('screen');
  if(target)target.innerHTML='<section class="soc" dir="rtl"><h2>اکسپلور</h2><p class="notice">نمایش اکسپلور با مشکل مواجه شد.</p><button class="btn" id="soc-retry">تلاش مجدد</button></section>';
 }
}
function socFirstPaint(){
 const target=document.getElementById('screen');
 if(!target)return;
 try{
  target.innerHTML=socFeed();
 }catch(err){
  console.error('Explore initial paint failed',err);
  target.innerHTML='<section class="soc" dir="rtl"><h2>اکسپلور</h2><p class="notice">صفحه باز شد، اما نمایش محتوا با مشکل مواجه شد.</p><button class="btn" id="soc-retry">تلاش مجدد</button></section>';
 }
 const composer=document.getElementById('composer');
 if(composer)composer.classList.add('hidden');
 const nav=document.getElementById('nav');
 if(nav){nav.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page==='explore'));}
}
async function socSafeFetch(){
 if(socFetchInFlight)return;
 socFetchInFlight=true;
 try{
  // Fetch does not block navigation. Existing socFetch handles Supabase errors.
  await Promise.race([socFetch(),new Promise((_,reject)=>setTimeout(()=>reject(Error('timeout')),12000))]);
 }catch(err){
  socError='دریافت محتوا طول کشید. دوباره تلاش کنید.';
  if(s.page==='explore')socFirstPaint();
 }finally{socFetchInFlight=false;}
}
// Capture the nav click before older handlers and never wait for a network request.
document.addEventListener('click',function(e){
 const b=e.target.closest?.('button[data-page="explore"]');
 if(!b)return;
 e.preventDefault();e.stopImmediatePropagation();
 socView='feed';s.page='explore';socError='';
 socFirstPaint();
 if(Date.now()-socLastLoaded>15000)queueMicrotask(()=>{socSafeFetch();});
},true);
document.addEventListener('click',function(e){
 if(!e.target.closest?.('#soc-retry'))return;
 e.preventDefault();socFirstPaint();socSafeFetch();
},true);

 if(appProfile.role==='student'&&s.page==='assistant'&&!document.getElementById('ai23-memory-btn')){const el=document.createElement('div');el.id='ai23-memory-btn';el.className='card';el.style.cssText='padding:9px 12px;margin:0 0 12px;text-align:center';el.innerHTML='<button type="button" class="chip" data-ai23="memory">🧠 حافظه و اشتراک گزارش با معلم</button>';screen.prepend(el)}
 if(appProfile.role==='teacher'&&s.page==='teacher-dashboard'&&!document.querySelector('[data-ai23="teacher"]')){const el=document.createElement('div');el.className='card';el.innerHTML='<h3>📊 گزارش یادگیری شاگردان</h3><button class="btn" data-ai23="teacher">مشاهده</button>';screen.appendChild(el)}
}

render=appRender;

 const escapeVoiceValue=value=>String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
 const safeUrl=escapeVoiceValue(url),safeId=escapeVoiceValue(id);
 const bars=v13WaveHeights.map((h,i)=>`<span class="v13-bar" style="height:${h}px" data-bar="${i}"></span>`).join('');
 return `<div class="v13-voice" data-voice-id="${safeId}"><button class="v13-play" type="button" aria-label="پخش پیام صوتی" data-v13-play="1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg></button><div class="v13-middle"><div class="v13-wave" data-v13-seek="1" role="slider" tabindex="0" aria-label="موقعیت پخش ویس" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">${bars}</div><span class="v13-duration">۰:۰۰</span></div><button class="v13-speed" type="button" data-v13-speed="1" aria-label="سرعت پخش">1x</button><audio preload="metadata" src="${safeUrl}"></audio></div>`;
}
function v13Time(seconds){if(!Number.isFinite(seconds)||seconds<0)return '۰:۰۰';const n=Math.floor(seconds),v=`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;return v.replace(/\d/g,c=>'۰۱۲۳۴۵۶۷۸۹'[Number(c)])}
function v13Update(box){const a=box.querySelector('audio');if(!a)return;const total=Number.isFinite(a.duration)?a.duration:0;const percent=total?Math.max(0,Math.min(1,a.currentTime/total)):0;box.querySelectorAll('.v13-bar').forEach((bar,i,arr)=>bar.classList.toggle('played',(i+.5)/arr.length<=percent));const time=box.querySelector('.v13-duration');if(time)time.textContent=v13Time(a.paused&&a.currentTime===0?total:a.currentTime)+(a.paused&&a.currentTime===0?'':' / '+v13Time(total));const slider=box.querySelector('.v13-wave');if(slider)slider.setAttribute('aria-valuenow',String(Math.round(percent*100)));const btn=box.querySelector('.v13-play');if(btn){btn.setAttribute('aria-label',a.paused?'پخش پیام صوتی':'توقف پیام صوتی');btn.innerHTML=a.paused?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>'}}
document.addEventListener('click',async e=>{const btn=e.target.closest('[data-v13-play],[data-v13-speed],[data-v13-seek]');if(!btn)return;const box=btn.closest('.v13-voice'),a=box?.querySelector('audio');if(!a)return;e.preventDefault();e.stopImmediatePropagation();if(btn.hasAttribute('data-v13-play')){if(a.paused){document.querySelectorAll('.v13-voice audio').forEach(other=>{if(other!==a)other.pause()});try{await a.play()}catch(err){alert('پخش ویس ممکن نشد: '+err.message)}}else a.pause()}else if(btn.hasAttribute('data-v13-speed')){a.playbackRate=a.playbackRate===1?1.5:a.playbackRate===1.5?2:1;btn.textContent=a.playbackRate+'x'}else if(Number.isFinite(a.duration)&&a.duration>0){const r=btn.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration}v13Update(box)},true);
document.addEventListener('keydown',e=>{const wave=e.target.closest('[data-v13-seek]');if(!wave||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const a=wave.closest('.v13-voice')?.querySelector('audio');if(!a||!Number.isFinite(a.duration))return;e.preventDefault();a.currentTime=e.key==='Home'?0:e.key==='End'?a.duration:Math.max(0,Math.min(a.duration,a.currentTime+(e.key==='ArrowRight'?5:-5)));v13Update(wave.closest('.v13-voice'))});
for(const eventName of ['loadedmetadata','timeupdate','play','pause','ended','durationchange'])document.addEventListener(eventName,e=>{if(e.target.matches?.('.v13-voice audio'))v13Update(e.target.closest('.v13-voice'))},true);


</script></body></html>
