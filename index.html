<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087df4"><title>ای‌آی مدرسه | نسخه آزمایشی</title>
<style>
@font-face{font-family:Vazir;src:url('/fonts/Vazir.ttf')}@font-face{font-family:Vazir;src:url('/fonts/Vazir-Medium.ttf');font-weight:600}@font-face{font-family:Vazir;src:url('/fonts/Vazir-Light.ttf');font-weight:300}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e9f7ff,#d6eeff 65%,#f6fbff);font-family:Vazir,Tahoma,sans-serif;color:#142c46}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:460px;min-height:100dvh;margin:auto;background:#fbfdff;display:flex;flex-direction:column;box-shadow:0 0 50px #2b73aa18}.header{display:flex;align-items:center;justify-content:space-between;padding:19px 22px;border-bottom:1px solid #e8f0f8}.brand{font-weight:600;color:#0876d7;font-size:23px}.brand b{color:#0eafa5}.muted{color:#7890a5;font-size:12px}.screen{flex:1;padding:20px;overflow-y:auto;min-height:0}.hero{background:linear-gradient(120deg,#087df4,#29b2e7);color:white;padding:22px;border-radius:23px;margin-bottom:20px}.hero p{color:#e7f5ff}.card{border:1px solid #e5eef6;background:white;padding:17px;border-radius:18px;margin:12px 0;box-shadow:0 4px 15px #134c7a08}.card h3{margin:0 0 9px;font-size:15px}.card p{font-size:13px;line-height:2;color:#62788c}.btn{border:0;border-radius:13px;background:#087df4;color:white;padding:10px 16px}.ghost{background:#e8f4ff;color:#076ac6}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.nav{display:grid;grid-template-columns:repeat(5,1fr);background:white;border-top:1px solid #e5edf6;padding:10px 3px max(13px,env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#8393a5;font-size:11px;padding:5px 0}.nav button span{display:block;font-size:23px}.nav button.active{color:#087df4;font-weight:600}.composer{display:flex;gap:8px;padding:10px 14px;background:#f8fbff}.composer input{flex:1;min-width:0;border:1px solid #e1eaf3;border-radius:30px;padding:11px 15px;outline:0}.composer button{border:0;border-radius:50%;background:#087df4;color:white;width:42px;height:42px}.message{white-space:pre-wrap;line-height:2;font-size:13px;padding:12px 15px;border-radius:17px;margin:11px 0;max-width:94%}.message.user{background:#087df4;color:white;margin-right:auto;border-bottom-left-radius:4px}.message.assistant{background:#e9f3fd;border-bottom-right-radius:4px}.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}.chips button{background:#eef7ff;border:1px solid #d6eafa;border-radius:30px;padding:9px 12px;color:#0874c7;font-size:12px}.center{text-align:center;padding-top:70px}.robot{font-size:54px;margin-bottom:15px}.field{width:100%;padding:12px;border:1px solid #dce7f1;border-radius:13px;background:white;margin:7px 0 17px}.bar{background:#e8eff6;height:9px;border-radius:10px;overflow:hidden}.bar div{height:100%;background:#0fb9a8}.notice{font-size:11px;line-height:1.9;color:#667e93;background:#f0f7fd;border-radius:12px;padding:11px}.status{font-size:11px;color:#9a6315}.hidden{display:none}@media(min-width:700px){body{padding:25px}.wrap{height:calc(100dvh - 50px);min-height:680px;border-radius:27px;overflow:hidden}.screen{overflow:auto}}
</style></head><body><div class="wrap"><header class="header"><div class="brand"><b>ای‌آی</b> مدرسه</div><div class="muted">نسخه آزمایشی ✦</div></header><main class="screen" id="screen"></main><div class="composer hidden" id="composer"><input id="question" placeholder="سؤالت رو بپرس..." aria-label="سؤال درسی"><button id="send" aria-label="ارسال">➤</button></div><nav class="nav" id="nav"><button data-page="home"><span>⌂</span>خانه</button><button data-page="plan"><span>▦</span>برنامه</button><button data-page="assistant"><span>🤖</span>دستیار</button><button data-page="courses"><span>▤</span>دوره‌ها</button><button data-page="profile"><span>♙</span>پروفایل</button></nav></div>
<script>
(()=>{const $=s=>document.querySelector(s),screen=$('#screen'),composer=$('#composer'),input=$('#question');
const defaultState={name:'دانش‌آموز',grade:'دوازدهم',tasks:[false,false,false],messages:[],page:'home'};
let s;try{s={...defaultState,...JSON.parse(localStorage.getItem('aimadrese-demo')||'{}')}}catch{s={...defaultState}}
const save=()=>localStorage.setItem('aimadrese-demo',JSON.stringify(s));
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const grades=['سوم','چهارم','پنجم','ششم','هفتم','هشتم','نهم','دهم','یازدهم','دوازدهم'];
function render(){save();document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===s.page));composer.classList.toggle('hidden',s.page!=='assistant');
if(s.page==='home')screen.innerHTML=`<div class="hero"><h2>سلام ${esc(s.name)} جان! 👋</h2><p>هر روز یک قدم به یادگیری بهتر نزدیک‌تر شو.</p><button class="btn" style="background:white;color:#087df4" data-page="assistant">شروع گفتگو با دستیار</button></div><h3>مسیر یادگیری تو</h3><div class="grid"><div class="card"><h3>🎯 کارهای امروز</h3><p>${s.tasks.filter(Boolean).length} از ۳ انجام شده</p></div><div class="card"><h3>📚 پایه تحصیلی</h3><p>${esc(s.grade)}</p></div></div><div class="card"><h3>📐 کمک در ریاضی</h3><p>سؤالت رو بپرس و قدم‌به‌قدم یاد بگیر.</p><button class="btn" data-ask="معادله درجه دوم را توضیح بده">شروع یادگیری</button></div><div class="card"><h3>📅 برنامه امروز</h3><button class="btn ghost" data-page="plan">مشاهده برنامه</button></div>`;
if(s.page==='plan')screen.innerHTML=`<h2>برنامه امروز 📅</h2><p class="muted">کارهای انجام‌شده رو علامت بزن.</p>${['مرور درس — ۲۵ دقیقه','حل تمرین — ۳۰ دقیقه','مرور نکات — ۱۵ دقیقه'].map((x,i)=>`<div class="card"><label><input type="checkbox" data-task="${i}" ${s.tasks[i]?'checked':''}> ${x}</label></div>`).join('')}<div class="card"><h3>پیشرفت امروز</h3><div class="bar"><div style="width:${s.tasks.filter(Boolean).length/3*100}%"></div></div><p>${s.tasks.filter(Boolean).length} از ۳ فعالیت</p></div>`;
if(s.page==='assistant'){screen.innerHTML=s.messages.length?s.messages.map(m=>`<div class="message ${m.role}">${esc(m.text)}</div>`).join(''):`<div class="center"><div class="robot">🤖</div><h2>سلام ${esc(s.name)} جان!</h2><p class="muted">من دستیار آموزشی ای‌آی مدرسه هستم.<br>با هم تمرین می‌کنیم و مرحله‌به‌مرحله یاد می‌گیریم.</p></div><div class="chips"><button data-ask="معادله درجه دوم را توضیح بده">📐 ریاضی</button><button data-ask="برای امتحان برنامه بده">📅 برنامه امتحان</button><button data-ask="از من آزمون بگیر">✏️ آزمون</button><button data-ask="زبان انگلیسی تمرین کنیم">🇬🇧 زبان</button></div>`;screen.scrollTop=screen.scrollHeight}
if(s.page==='courses')screen.innerHTML=`<h2>دوره‌های آموزشی 📚</h2><div class="card"><h3>ریاضی ${esc(s.grade)}</h3><p>پیش‌نمایش مفاهیم و حل تمرین</p><button class="btn" data-ask="معادله درجه دوم را توضیح بده">پیش‌نمایش</button></div><div class="card"><h3>زبان انگلیسی</h3><p>تمرین لغت و گرامر</p><button class="btn" data-ask="زبان انگلیسی تمرین کنیم">شروع تمرین</button></div><div class="notice">دوره‌ها فعلاً نمونه هستند و خرید واقعی ندارند.</div>`;
if(s.page==='profile')screen.innerHTML=`<h2>پروفایل من 👤</h2><div class="card"><label>نام نمایشی</label><input class="field" id="name" maxlength="40" value="${esc(s.name)}"><label>پایه تحصیلی</label><select class="field" id="grade">${grades.map(g=>`<option ${g===s.grade?'selected':''}>${g}</option>`).join('')}</select><button class="btn" id="save-profile">ذخیره تغییرات</button></div><div class="card"><h3>🔒 حریم خصوصی</h3><p>نام، پایه و برنامه در همین مرورگر ذخیره می‌شود. برای تست از اطلاعات واقعی حساس استفاده نکن.</p></div><button class="btn ghost" id="reset">پاک کردن داده‌های آزمایشی</button>`}
function demoReply(q){if(/ریاضی|معادله|دلتا/.test(q))return 'بیا قدم‌به‌قدم حل کنیم! 📐\nبرای ax²+bx+c=0 از Δ=b²−4ac استفاده می‌کنیم.\nمثلاً در x²−5x+6=0، دلتا برابر ۱ است.\nحالا می‌تونی ریشه‌ها رو حساب کنی؟';if(/برنامه|امتحان/.test(q))return 'برنامه پیشنهادی 📅\n۲۵ دقیقه مرور، ۵ دقیقه استراحت، ۳۰ دقیقه حل تمرین، ۱۵ دقیقه رفع اشکال.\nکدوم درس امتحان داری؟';if(/آزمون|تست/.test(q))return 'سؤال کوتاه ✏️\n۳ × (۴ + ۲) چند می‌شود؟\nالف) ۱۴\nب) ۱۸\nج) ۲۴';if(/زبان|انگلیسی/.test(q))return 'I study every day.\nیعنی: من هر روز درس می‌خوانم.\nمی‌خوای لغت تمرین کنیم یا گرامر؟';if(/۱۸|18/.test(q))return 'آفرین! 🎉 ۴+۲=۶ و ۳×۶=۱۸.';return 'سؤالت دریافت شد. این نسخه فعلاً آفلاین و نمایشی است؛ برای پاسخ واقعی به سؤال‌های آزاد باید API هوش مصنوعی روی سرور فعال شود.'}
async function ask(q){
 q=(q||input.value).trim();if(!q)return;input.value='';s.page='assistant';s.messages.push({role:'user',text:q});
 const history=s.messages.slice(-12).map(m=>({role:m.role,content:m.text}));
 s.messages.push({role:'assistant',text:'در حال فکر کردن…'});render();
 try{
  const response=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,grade:s.grade})});
  let data=await response.json();
  if(!response.ok)throw new Error(data.error||'خطا در ارتباط با دستیار');
  s.messages[s.messages.length-1].text=data.reply||'پاسخی دریافت نشد.';
 }catch(err){s.messages[s.messages.length-1].text='⚠️ '+(err.message||'ارتباط برقرار نشد')+'\nبرای استفاده از هوش مصنوعی، تنظیمات Netlify و کلید API باید فعال باشند.';}
 render();
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){s.page=b.dataset.page;render()}else if(b.dataset.ask)ask(b.dataset.ask);else if(b.id==='send')ask();else if(b.id==='save-profile'){s.name=$('#name').value.trim()||'دانش‌آموز';s.grade=$('#grade').value;render()}else if(b.id==='reset'){if(confirm('داده‌های آزمایشی پاک شوند؟')){localStorage.removeItem('aimadrese-demo');s={...defaultState,tasks:[false,false,false],messages:[]};render()}}});
document.addEventListener('change',e=>{if(e.target.dataset.task!==undefined){s.tasks[+e.target.dataset.task]=e.target.checked;render()}});input.addEventListener('keydown',e=>{if(e.key==='Enter')ask()});render()})();
</script></body></html>
