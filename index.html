  </div>
  <section class="v15-goal"><span class="v16-goal-art">${v16svg('target')}</span><div class="v15-goal-body"><h3>هدف امروز</h3><p>تکمیل ۳ فعالیت مطالعاتی · ${done} فعالیت انجام شده</p><div class="v15-bar"><div style="width:${percent}%"></div></div></div></section>
  <div class="v15-duo">
   <section class="v15-panel"><h3>فعالیت‌های امروز</h3>${schedule.map((x,i)=>`<div class="v15-activity"><span class="v16-tick">${v16svg(tasks[i]?'check':'clock')}</span><span>${esc(x)}</span></div>`).join('')}<button class="chip" data-page="plan" style="margin-top:9px">مشاهده فعالیت‌ها</button></section>

  </div>

 </div>`;

// تبدیل Markdown و LaTeX به نمایش امن و خوانا
function formatAnswer(raw){
  const source=String(raw||'');
  if(!window.marked||!window.DOMPurify)return esc(source).replace(/\n/g,'<br>');
  const maths=[];
  const tokenized=source.replace(/\\\[([\s\S]*?)\\\]|\$\$([\s\S]*?)\$\$|\\\(([\s\S]*?)\\\)|(?<!\$)\$([^$\n]+)\$(?!\$)/g,(full,a,b,c,d)=>{
    const expression=a??b??c??d;
    const display=a!==undefined||b!==undefined;
    const token=`MATHPLACEHOLDER${maths.length}END`;
    try{maths.push(window.katex?window.katex.renderToString(expression,{throwOnError:false,displayMode:display,output:'html'}):esc(full))}
    catch{maths.push(esc(full))}
    return token;
  });
  let html=window.marked.parse(tokenized,{breaks:true,gfm:true});
  html=html.replace(/MATHPLACEHOLDER(\d+)END/g,(_,i)=>maths[Number(i)]||'');
  return window.DOMPurify.sanitize(html);
}

function v12StartTimers(){if(v12RefreshTimer)clearInterval(v12RefreshTimer);v12RefreshTimer=setInterval(()=>{if(!document.hidden&&authSession){v12FetchInbox();if(s.page==='chat')fetchMessages().catch(console.warn)}},5000);v12FetchInbox();v12SetupRealtime()}
async function fetchUsers(){const a=await ensureSession();appUsers=[];for(let offset=0;offset<10000;offset+=500){const batch=await sbRequest('/rest/v1/app_profiles?select=id,display_name,role,subject,grade,avatar_url,last_seen_at&order=created_at.desc&limit=500&offset='+offset,{token:a.access_token})||[];appUsers.push(...batch);if(batch.length<500)break}appUsers=appUsers.filter(x=>x.id!==a.user.id)}

async function fetchMessages(){if(!appChatId)return;const a=await ensureSession();if(!a)return;const data=await sbRequest('/rest/v1/app_messages?select=id,conversation_id,sender_id,body,created_at,attachment_path,attachment_type,attachment_name,edited_at,deleted_at,pinned_at,pinned_by&conversation_id=eq.'+encodeURIComponent(appChatId)+'&order=created_at.asc&limit=200',{token:a.access_token});const previous=JSON.stringify(appMessages.map(m=>[m.id,m.body,m.attachment_path,m.edited_at,m.deleted_at,m.pinned_at]));appMessages=data||[];const changed=previous!==JSON.stringify(appMessages.map(m=>[m.id,m.body,m.attachment_path,m.edited_at,m.deleted_at,m.pinned_at]));if(s.page==='chat'&&changed){const oldFeed=document.getElementById('chat-feed');const nearBottom=!oldFeed||oldFeed.scrollHeight-oldFeed.scrollTop-oldFeed.clientHeight<100;const typed=document.querySelector('#app-chat-form input[name=body]')?.value||'';appRender();const newInput=document.querySelector('#app-chat-form input[name=body]');if(newInput)newInput.value=typed;const feed=document.getElementById('chat-feed');if(feed&&nearBottom)feed.scrollTop=feed.scrollHeight}await resolveChatMedia();if(s.page==='chat')markChatRead().catch(console.warn)}
async function resolveChatMedia(){const a=await ensureSession();if(!a)return;const pending=appMessages.filter(m=>m.attachment_path&&!m.deleted_at&&!appChatMedia.has(m.id));if(!pending.length)return;for(const m of pending){try{const r=await sbRequest('/storage/v1/object/sign/aimadrese-chat/'+m.attachment_path,{method:'POST',token:a.access_token,body:JSON.stringify({expiresIn:3600})});const signed=r.signedURL||r.signedUrl;if(signed)appChatMedia.set(m.id,SB_URL+(signed.startsWith('/storage/v1/')?signed:'/storage/v1'+(signed.startsWith('/')?signed:'/'+signed)))}catch(err){console.warn('پیوست:',err.message)}}if(s.page==='chat'&&pending.some(m=>appChatMedia.has(m.id))){const feed=document.getElementById('chat-feed');const nearBottom=!feed||feed.scrollHeight-feed.scrollTop-feed.clientHeight<100;const typed=document.querySelector('#app-chat-form input[name=body]')?.value||'';appRender();const input=document.querySelector('#app-chat-form input[name=body]');if(input)input.value=typed;const next=document.getElementById('chat-feed');if(next&&nearBottom)next.scrollTop=next.scrollHeight}}
function validateChatFile(file){if(!file)return;const allowed=['image/jpeg','image/png','image/webp','audio/webm','audio/mp4','audio/mpeg','audio/ogg','audio/wav'];if(!allowed.includes(file.type))throw new Error('فقط عکس JPG/PNG/WebP و فایل صوتی مجاز است.');const max=file.type.startsWith('image/')?5:10;if(file.size>max*1024*1024)throw new Error('حجم فایل نباید بیشتر از '+max+' مگابایت باشد.')}
async function sendChatMessage(body,file){if(!appChatId||(!body&&!file)||appUploading)return;appUploading=true;const a=await ensureSession();try{const data={conversation_id:appChatId,sender_id:a.user.id,body:body||' '};if(file){validateChatFile(file);const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','audio/webm':'webm','audio/mp4':'m4a','audio/mpeg':'mp3','audio/ogg':'ogg','audio/wav':'wav'}[file.type];const path=appChatId+'/'+a.user.id+'/'+crypto.randomUUID()+'.'+ext;const res=await fetch(SB_URL+'/storage/v1/object/aimadrese-chat/'+path,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+a.access_token,'Content-Type':file.type,'x-upsert':'false'},body:file});if(!res.ok){const error=await res.text();throw new Error('آپلود ناموفق بود: '+error.slice(0,200))}data.attachment_path=path;data.attachment_type=file.type;data.attachment_name=file.name.slice(0,150)}await sbRequest('/rest/v1/app_messages',{method:'POST',token:a.access_token,headers:{Prefer:'return=minimal'},body:JSON.stringify(data)});appPendingFile=null;await fetchMessages();await v12FetchInbox();appRender();const feed=document.getElementById('chat-feed');if(feed)feed.scrollTop=feed.scrollHeight}catch(e){alert('خطا در ارسال: '+e.message)}finally{appUploading=false}}
async function toggleVoiceRecord(btn){if(appRecorder&&appRecorder.state==='recording'){appRecorder.stop();btn.classList.remove('chat-recording');btn.textContent='🎙';return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){alert('مرورگر شما ضبط ویس را پشتیبانی نمی‌کند.');return}try{appRecordingStream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(x=>MediaRecorder.isTypeSupported(x));appRecorder=new MediaRecorder(appRecordingStream,mime?{mimeType:mime}:undefined);appAudioChunks=[];appRecorder.ondataavailable=e=>{if(e.data.size)appAudioChunks.push(e.data)};appRecorder.onstop=()=>{const type=appRecorder.mimeType.split(';')[0]||'audio/webm';const blob=new Blob(appAudioChunks,{type});appRecordingStream?.getTracks().forEach(t=>t.stop());appRecordingStream=null;const file=new File([blob],'voice-'+Date.now()+(type==='audio/mp4'?'.m4a':'.webm'),{type});try{validateChatFile(file);appPendingFile=file;const preview=document.getElementById('chat-file-preview');if(preview){preview.style.display='flex';preview.querySelector('span').textContent='🎙 '+file.name}}catch(e){alert(e.message)}};appRecorder.start();btn.classList.add('chat-recording');btn.textContent='■'}catch(e){alert('اجازه دسترسی به میکروفون داده نشد: '+e.message)}}

ng(f.get('body')||'').trim();await sendChatMessage(body,appPendingFile)}}catch(err){appAuthError=err.message;alert('خطا: '+err.message);appRender()}},true);

// Voice playback uses the actual audio duration and currentTime; waveform bars are visual.
const v13WaveHeights=[8,12,9,16,21,13,24,17,11,20,26,14,18,31,20,13,26,18,12,23,30,17,12,20,14,9,15,11];
function voiceCardMarkup(url,id){
 const escapeVoiceValue=value=>String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
 const safeUrl=escapeVoiceValue(url),safeId=escapeVoiceValue(id);
 const bars=v13WaveHeights.map((h,i)=>`<span class="v13-bar" style="height:${h}px" data-bar="${i}"></span>`).join('');
 return `<div class="v13-voice" data-voice-id="${safeId}"><button class="v13-play" type="button" aria-label="پخش پیام صوتی" data-v13-play="1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg></button><div class="v13-middle"><div class="v13-wave" data-v13-seek="1" role="slider" tabindex="0" aria-label="موقعیت پخش ویس" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">${bars}</div><span class="v13-duration">۰:۰۰</span></div><button class="v13-speed" type="button" data-v13-speed="1" aria-label="سرعت پخش">1x</button><audio preload="metadata" src="${safeUrl}"></audio></div>`;
}
function v13Time(seconds){if(!Number.isFinite(seconds)||seconds<0)return '۰:۰۰';const n=Math.floor(seconds),v=`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;return v.replace(/\d/g,c=>'۰۱۲۳۴۵۶۷۸۹'[Number(c)])}
function v13Update(box){const a=box.querySelector('audio');if(!a)return;const total=Number.isFinite(a.duration)?a.duration:0;const percent=total?Math.max(0,Math.min(1,a.currentTime/total)):0;box.querySelectorAll('.v13-bar').forEach((bar,i,arr)=>bar.classList.toggle('played',(i+.5)/arr.length<=percent));const time=box.querySelector('.v13-duration');if(time)time.textContent=v13Time(a.paused&&a.currentTime===0?total:a.currentTime)+(a.paused&&a.currentTime===0?'':' / '+v13Time(total));const slider=box.querySelector('.v13-wave');if(slider)slider.setAttribute('aria-valuenow',String(Math.round(percent*100)));const btn=box.querySelector('.v13-play');if(btn){btn.setAttribute('aria-label',a.paused?'پخش پیام صوتی':'توقف پیام صوتی');btn.innerHTML=a.paused?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>'}}
document.addEventListener('click',async e=>{const btn=e.target.closest('[data-v13-play],[data-v13-speed],[data-v13-seek]');if(!btn)return;const box=btn.closest('.v13-voice'),a=box?.querySelector('audio');if(!a)return;e.preventDefault();e.stopImmediatePropagation();if(btn.hasAttribute('data-v13-play')){if(a.paused){document.querySelectorAll('.v13-voice audio').forEach(other=>{if(other!==a)other.pause()});try{await a.play()}catch(err){alert('پخش ویس ممکن نشد: '+err.message)}}else a.pause()}else if(btn.hasAttribute('data-v13-speed')){a.playbackRate=a.playbackRate===1?1.5:a.playbackRate===1.5?2:1;btn.textContent=a.playbackRate+'x'}else if(Number.isFinite(a.duration)&&a.duration>0){const r=btn.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration}v13Update(box)},true);
document.addEventListener('keydown',e=>{const wave=e.target.closest('[data-v13-seek]');if(!wave||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const a=wave.closest('.v13-voice')?.querySelector('audio');if(!a||!Number.isFinite(a.duration))return;e.preventDefault();a.currentTime=e.key==='Home'?0:e.key==='End'?a.duration:Math.max(0,Math.min(a.duration,a.currentTime+(e.key==='ArrowRight'?5:-5)));v13Update(wave.closest('.v13-voice'))});
for(const eventName of ['loadedmetadata','timeupdate','play','pause','ended','durationchange'])document.addEventListener(eventName,e=>{if(e.target.matches?.('.v13-voice audio'))v13Update(e.target.closest('.v13-voice'))},true);
